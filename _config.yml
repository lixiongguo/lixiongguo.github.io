destination: docs

# Machine Learning 专栏：公网暂不开放正文（见 _plugins/ml_posts_gate.rb）
# 开放时改为 public: true
ml_posts:
  public: false

markdown: kramdown
kramdown:
  math_engine: mathjax
  entity_output: as_char  # 保留原始符号
excerpt_separator: <!--more-->
# highlighter-theme:autumn
highlighter-theme : emacs
# highlighter-theme : rouge
category_dir: category
# 保留 WASM 文件，不被 Jekyll 清理
keep_files:
  - assets/wasm/*.wasm
  - assets/wasm/*.js
  - gallery/

# 排除不需要 Jekyll 处理的目录和文件
# gallery/*.md 是帮助面板的源文档，由流水线转为 _data/gallery_help.yml，
# 不应被 Jekyll 单独渲染（否则会和同名 .html 冲突）
exclude:
  - cpp/
  - docs/cpp/
  - "gallery/*.md"
plugins:
  - jekyll-feed
github_username: David Lee

# 解决中文文件名编码问题
encoding: utf-8

# ============================================
# 微信公众号发布配置
# ============================================
wechat:
  enabled: false                   # 是否启用微信版本生成
  output_dir: "wechat"             # 输出目录（相对于 _site）

  # 阿里云 OSS 图床配置
  oss:
    base_url: "https://lgximgs.oss-cn-beijing.aliyuncs.com/images"  # OSS 基础 URL（不含文件名）

  # MathJax 公式转图片配置
  mathjax:
    enabled: true                  # 是否启用公式转图片
    service: "codecogs"            # 使用 CodeCogs API (免费)

  # 微信样式配置
  style:
    font_family: "-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif"
    font_size: "16px"
    line_height: "1.8"
    text_color: "#333333"