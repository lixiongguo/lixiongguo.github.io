      function computeBenChenCones(meshData) {
        if (!meshData || !meshData.positions || !meshData.faces) return [];
        const n = meshData.positions.length;
        const angleSum = new Array(n).fill(0);
        const edgeCount = new Map();
        const boundary = new Array(n).fill(false);

        function edgeKey(a, b) { return a < b ? (a + "_" + b) : (b + "_" + a); }
        function cornerAngle(pa, pb, pc) {
          const ux = pb[0] - pa[0], uy = pb[1] - pa[1], uz = pb[2] - pa[2];
          const vx = pc[0] - pa[0], vy = pc[1] - pa[1], vz = pc[2] - pa[2];
          const lu = Math.hypot(ux, uy, uz), lv = Math.hypot(vx, vy, vz);
          if (lu < 1e-12 || lv < 1e-12) return 0;
          const d = Math.max(-1, Math.min(1, (ux * vx + uy * vy + uz * vz) / (lu * lv)));
          return Math.acos(d);
        }

        for (let fi = 0; fi < meshData.faces.length; fi++) {
          const f = meshData.faces[fi];
          const a = f[0], b = f[1], c = f[2];
          const pa = meshData.positions[a], pb = meshData.positions[b], pc = meshData.positions[c];
          angleSum[a] += cornerAngle(pa, pb, pc);
          angleSum[b] += cornerAngle(pb, pc, pa);
          angleSum[c] += cornerAngle(pc, pa, pb);
          for (const e of [[a, b], [b, c], [c, a]]) {
            const k = edgeKey(e[0], e[1]);
            edgeCount.set(k, (edgeCount.get(k) || 0) + 1);
          }
        }

        edgeCount.forEach(function (count, k) {
          if (count !== 1) return;
          const ids = k.split('_').map(Number);
          boundary[ids[0]] = true;
          boundary[ids[1]] = true;
        });

        let minX = Infinity, minY = Infinity, minZ = Infinity;
        let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
        for (let i = 0; i < n; i++) {
          const p = meshData.positions[i];
          if (p[0] < minX) minX = p[0];
          if (p[1] < minY) minY = p[1];
          if (p[2] < minZ) minZ = p[2];
          if (p[0] > maxX) maxX = p[0];
          if (p[1] > maxY) maxY = p[1];
          if (p[2] > maxZ) maxZ = p[2];
        }
        const diag = Math.hypot(maxX - minX, maxY - minY, maxZ - minZ) || 1;
        const minSep = diag * 0.08;
        const candidates = [];
        const twoPi = Math.PI * 2;

        for (let i = 0; i < n; i++) {
          if (boundary[i]) continue;
          const curvature = twoPi - angleSum[i];
          if (Math.abs(curvature) < 0.08) continue;
          // Θ = 2π − K. Positive curvature becomes a cone (Θ < 2π); a saddle stays
          // above 2π. Clamped so the chart does not wrap several full turns.
          const coneAngle = twoPi - curvature;
          const clampedAngle = Math.max(Math.PI * 0.5, Math.min(Math.PI * 2.5, coneAngle));
          candidates.push({ index: i, angle: clampedAngle, score: Math.abs(curvature) });
        }
        candidates.sort(function (a, b) { return b.score - a.score; });

        const maxCount = Math.max(4, Math.min(24, Math.ceil(Math.sqrt(n) / 8)));
        const chosen = [];
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          const p = meshData.positions[c.index];
          let farEnough = true;
          for (let j = 0; j < chosen.length; j++) {
            const q = meshData.positions[chosen[j].index];
            if (Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]) < minSep) {
              farEnough = false;
              break;
            }
          }
          if (farEnough) chosen.push({ index: c.index, angle: c.angle });
          if (chosen.length >= maxCount) break;
        }
        return chosen;
      }

      function addOrRemoveConeVertex(vertexIndex) {
        const idx = coneVertices.findIndex(function (c) { return c.index === vertexIndex; });
        if (idx >= 0) coneVertices.splice(idx, 1);
        else coneVertices.push({ index: vertexIndex, angle: 4 * Math.PI });  // default cone angle = 4π
        updateConeDisplay();
      }

      function applyBenChenCones() {
        if (!supportsConeSelection(getCurrentMethod()) || !currentMeshData) return;
        coneVertices = computeBenChenCones(currentMeshData);
        updateConeDisplay();
        setStatus("Ben-Chen 锥奇异点已计算: " + coneVertices.length + " 个", "#89f0b6");
      }

      function updateConeDisplay() {
        const info = document.getElementById('cone-info');
        if (info) {
          info.style.display = coneVertices.length > 0 ? '' : 'none';
          info.textContent = coneVertices.length + ' 个';
        }
        if (coneMarkers) {
          modelScene.remove(coneMarkers);
          coneMarkers = null;
        }
        if (!supportsConeSelection(getCurrentMethod()) || coneVertices.length === 0 || !currentMeshData) return;

        const pts = [];
        for (let i = 0; i < coneVertices.length; i++) {
          const c = coneVertices[i];
          if (c.index >= 0 && c.index < currentMeshData.positions.length) {
            const p = currentMeshData.positions[c.index];
            pts.push(p[0], p[1], p[2]);
          }
        }
        if (pts.length === 0) return;

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
        coneMarkers = new THREE.Points(geom, new THREE.PointsMaterial({
          color: 0xff4488,
          size: 0.055,
          sizeAttenuation: true,
          depthTest: false,
          depthWrite: false
        }));
        coneMarkers.renderOrder = 12;
        modelScene.add(coneMarkers);
      }

      function buildUvMesh(uv, faces, anchors, showPins) {
        const edgeSet = new Set();
        const segments = [];

        function toPlane(p) {
          return [(p[0] - 0.5) * 1.8, (p[1] - 0.5) * 1.8, 0];
        }

        function addEdge(a, b) {
          const key = a < b ? a + "_" + b : b + "_" + a;
          if (edgeSet.has(key)) return;
          edgeSet.add(key);
          const pa = toPlane(uv[a]);
          const pb = toPlane(uv[b]);
          segments.push(pa[0], pa[1], pa[2], pb[0], pb[1], pb[2]);
        }

        if (isQuadMesh && currentRawFaces && currentRawFaces.length > 0) {
          for (let i = 0; i < currentRawFaces.length; i++) {
            const f = currentRawFaces[i];
            for (let k = 0; k < f.length; k++) {
              addEdge(f[k], f[(k + 1) % f.length]);
            }
          }
        } else {
          for (let i = 0; i < faces.length; i++) {
            addEdge(faces[i][0], faces[i][1]);
            addEdge(faces[i][1], faces[i][2]);
            addEdge(faces[i][2], faces[i][0]);
          }
        }

        const lineGeom = new THREE.BufferGeometry();
        lineGeom.setAttribute("position", new THREE.Float32BufferAttribute(segments, 3));
        const lines = new THREE.LineSegments(
          lineGeom,
          new THREE.LineBasicMaterial({ color: 0x86b2ff, transparent: true, opacity: 0.95 })
        );
        let pins = null;
        if (showPins) {
          const pinPositions = [];
          for (let i = 0; i < anchors.length; i++) {
            const p = toPlane(uv[anchors[i]]);
            pinPositions.push(p[0], p[1], 0.01);
          }
          pins = new THREE.Points(
            new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(pinPositions, 3)),
            new THREE.PointsMaterial({ color: 0xffa94d, size: 8, sizeAttenuation: false })
          );
        }
        return { lines: lines, pins: pins };
      }

      function buildHomologyOverlay(meshData, homology) {
        if (!meshData || !homology || !homology.edgePairs || homology.edgePairs.length === 0) return null;
        const segs = [];
        const positions = meshData.positions;
        for (let i = 0; i < homology.edgePairs.length; i++) {
          const a = homology.edgePairs[i][0];
          const b = homology.edgePairs[i][1];
          if (a < 0 || b < 0 || a >= positions.length || b >= positions.length) continue;
          const pa = positions[a];
          const pb = positions[b];
          segs.push(pa[0], pa[1], pa[2], pb[0], pb[1], pb[2]);
        }
        if (segs.length === 0) return null;
        const geom = new THREE.BufferGeometry();
        geom.setAttribute("position", new THREE.Float32BufferAttribute(segs, 3));
        const lines = new THREE.LineSegments(
          geom,
          new THREE.LineBasicMaterial({ color: 0x60e060, transparent: true, opacity: 0.95 })
        );
        lines.renderOrder = 15;
        return lines;
      }


      function createCheckerTexture() {
        const texSize = 512;
        const cells = 16;
        const cellSize = texSize / cells;
        const canvas = document.createElement("canvas");
        canvas.width = texSize;
        canvas.height = texSize;
        const ctx = canvas.getContext("2d");

        for (let y = 0; y < cells; y++) {
          for (let x = 0; x < cells; x++) {
            const dark = ((x + y) & 1) === 0;
            ctx.fillStyle = dark ? "#1f2f54" : "#e9f0ff";
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
          }
        }

        ctx.strokeStyle = "rgba(120,150,210,0.4)";
        for (let i = 0; i <= cells; i++) {
          const p = i * cellSize;
          ctx.beginPath();
          ctx.moveTo(p, 0);
          ctx.lineTo(p, texSize);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, p);
          ctx.lineTo(texSize, p);
          ctx.stroke();
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(1, 1);
        texture.needsUpdate = true;
        return texture;
      }

      function createDotTexture() {
        const texSize = 512;
        const cells = 16;
        const cellSize = texSize / cells;
        const canvas = document.createElement("canvas");
        canvas.width = texSize;
        canvas.height = texSize;
        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "#f4f8ff";
        ctx.fillRect(0, 0, texSize, texSize);

        for (let y = 0; y < cells; y++) {
          for (let x = 0; x < cells; x++) {
            const cx = (x + 0.5) * cellSize;
            const cy = (y + 0.5) * cellSize;
            const radius = cellSize * 0.27;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = "#3f7cff";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(17,39,84,0.45)";
            ctx.stroke();
          }
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(1, 1);
        texture.needsUpdate = true;
        return texture;
      }

      function getUvTexture(textureMode) {
        if (textureMode === "dots") {
          if (!dotTexture) {
            dotTexture = createDotTexture();
          }
          return dotTexture;
        }
        if (!checkerTexture) {
          checkerTexture = createCheckerTexture();
        }
        return checkerTexture;
      }

      function buildTexturedMesh(meshData, uv, textureMode) {
        const positions = [];
        for (let i = 0; i < meshData.positions.length; i++) {
          positions.push(meshData.positions[i][0], meshData.positions[i][1], meshData.positions[i][2]);
        }
        const indices = [];
        for (let i = 0; i < meshData.faces.length; i++) {
          indices.push(meshData.faces[i][0], meshData.faces[i][1], meshData.faces[i][2]);
        }
        const uvFlat = [];
        for (let i = 0; i < uv.length; i++) {
          uvFlat.push(uv[i][0], uv[i][1]);
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geom.setAttribute("uv", new THREE.Float32BufferAttribute(uvFlat, 2));
        geom.setIndex(indices);
        geom.computeVertexNormals();

        const material = new THREE.MeshStandardMaterial({
          map: getUvTexture(textureMode),
          metalness: 0.05,
          roughness: 0.75,
          side: THREE.DoubleSide
        });

        return new THREE.Mesh(geom, material);
      }

      function clearTexturedMesh() {
        if (currentTexturedMesh && currentTexturedMesh.parent) {
          currentTexturedMesh.parent.remove(currentTexturedMesh);
        }
        currentTexturedMesh = null;
      }

      /**
       * 切换模型组的实心面显隐，线框始终可见
       */
      function setModelSolidVisible(visible) {
        if (!currentModelGroup) return;
        currentModelGroup.children.forEach(function(child) {
          if (child.isMesh) child.visible = visible;
        });
      }

      function setTextureDistortionEnabled(enabled, textureMode) {
        if (enabled && (!currentMeshData || !currentUnwrapUv)) {
          setStatus('请先点击"展开!"生成 UV，再开启纹理扭曲', '#ffd38a');
          if (radioCheckerboard) radioCheckerboard.checked = false;
          if (radioDots) radioDots.checked = false;
          return;
        }

        textureEnabled = enabled;
        if (textureEnabled) {
          currentTextureMode = textureMode || currentTextureMode || "checkerboard";
          clearTexturedMesh();
          currentTexturedMesh = buildTexturedMesh(currentMeshData, currentUnwrapUv, currentTextureMode);
          modelScene.add(currentTexturedMesh);
          setModelSolidVisible(false);
          if (currentDistortionMesh) currentDistortionMesh.visible = false;
          setStatus("已开启纹理扭曲（" + (currentTextureMode === "dots" ? "圆点贴图" : "棋盘格贴图") + "）", "#89f0b6");
        } else {
          clearTexturedMesh();
          setModelSolidVisible(true);
          setStatus("已关闭纹理扭曲", "#8cc4ff");
        }
      }

      function clearDistortionMesh() {
        if (currentDistortionMesh && currentDistortionMesh.parent) {
          currentDistortionMesh.parent.remove(currentDistortionMesh);
        }
        currentDistortionMesh = null;
      }

      let currentUvDistortionMesh = null;  // UV 面板上的扭曲显示 mesh

      function clearUvDistortionMesh() {
        if (currentUvDistortionMesh && currentUvDistortionMesh.parent) {
          currentUvDistortionMesh.parent.remove(currentUvDistortionMesh);
        }
        currentUvDistortionMesh = null;
      }

      async function setDistortionEnabled(enabled) {
        if (!enabled) {
          distortionEnabled = false;
          clearDistortionMesh();
          clearUvDistortionMesh();
          setModelSolidVisible(true);
          if (currentTexturedMesh && textureEnabled) currentTexturedMesh.visible = true;
          return;
        }

        if (!currentMeshData || !currentUnwrapUv) {
          setStatus('请先点击"展开!"生成 UV', '#ffd38a');
          if (radioDistortion) radioDistortion.checked = false;
          if (radioDots) radioDots.checked = false;
          if (radioCheckerboard) { radioCheckerboard.checked = true; setTextureDistortionEnabled(true, "checkerboard"); }
          return;
        }

        if (!wasmReady && !wasmLoadFailed) {
          setStatus('正在加载 QC 引擎...', '#ffd38a');
          await initSimpleSolver();
        }
        if (!wasmReady) {
          setStatus('QC 引擎加载失败', '#ff9d9d');
          if (radioDistortion) radioDistortion.checked = false;
          if (radioDots) radioDots.checked = false;
          if (radioCheckerboard) { radioCheckerboard.checked = true; setTextureDistortionEnabled(true, "checkerboard"); }
          return;
        }

        setStatus('共形扭曲计算中...', '#ffd38a');

        try {
          // 1. load mesh + UV into WASM
          const flatPos = new Float64Array(currentMeshData.positions.length * 3);
          for (let i = 0; i < currentMeshData.positions.length; i++) {
            flatPos[i*3]=currentMeshData.positions[i][0]; flatPos[i*3+1]=currentMeshData.positions[i][1]; flatPos[i*3+2]=currentMeshData.positions[i][2];
          }
          const flatFaces = new Int32Array(currentMeshData.faces.length * 3);
          for (let i = 0; i < currentMeshData.faces.length; i++) {
            flatFaces[i*3]=currentMeshData.faces[i][0]; flatFaces[i*3+1]=currentMeshData.faces[i][1]; flatFaces[i*3+2]=currentMeshData.faces[i][2];
          }
          const flatUV = new Float64Array(currentUnwrapUv.length * 2);
          for (let i = 0; i < currentUnwrapUv.length; i++) {
            flatUV[i*2]=currentUnwrapUv[i][0]; flatUV[i*2+1]=currentUnwrapUv[i][1];
          }

          const posPtr = simpleInstance._malloc(flatPos.length * 8);
          for (let i = 0; i < flatPos.length; i++) simpleInstance.setValue(posPtr+i*8, flatPos[i], 'double');
          const facePtr = simpleInstance._malloc(flatFaces.length * 4);
          for (let i = 0; i < flatFaces.length; i++) simpleInstance.setValue(facePtr+i*4, flatFaces[i], 'i32');
          const uvPtr = simpleInstance._malloc(flatUV.length * 8);
          for (let i = 0; i < flatUV.length; i++) simpleInstance.setValue(uvPtr+i*8, flatUV[i], 'double');

          // 2. load + compute QC
          const loadRet = simpleInstance.ccall('load_mesh_with_uv', 'number',
            ['number','number','number','number','number','number'],
            [posPtr, flatPos.length, facePtr, flatFaces.length, uvPtr, flatUV.length]);
          if (loadRet !== 0) throw new Error("load_mesh_with_uv failed");

          const nFaces = simpleInstance.ccall('compute_qc_error', 'number', [], []);
          if (nFaces <= 0) throw new Error("compute_qc_error returned " + nFaces);

          // 3. read errors & colors
          const errSize = simpleInstance.ccall('get_qc_errors_size', 'number', [], []);
          const errPtr  = simpleInstance.ccall('get_qc_errors', 'number', [], []);
          const colSize = simpleInstance.ccall('get_qc_colors_size', 'number', [], []);
          const colPtr  = simpleInstance.ccall('get_qc_colors', 'number', [], []);

          const errors = []; for (let i=0;i<errSize;i++) errors.push(simpleInstance.getValue(errPtr+i*8,'double'));
          const colors = []; for (let i=0;i<colSize;i++) colors.push(simpleInstance.getValue(colPtr+i*8,'double'));

          simpleInstance.ccall('dispose', 'void', [], []);

          // 4. free memory
          simpleInstance._free(posPtr); simpleInstance._free(facePtr); simpleInstance._free(uvPtr);

          // 5. compute stats
          let avgErr = 0, maxErr = 0;
          for (let i=0;i<errors.length;i++) { avgErr += errors[i]; if (errors[i]>maxErr) maxErr=errors[i]; }
          avgErr /= errors.length;

          // 6. build colored mesh for 3D model (per-vertex colors averaged from adjacent faces)
          const nV = currentMeshData.positions.length;
          const vCol = new Float32Array(nV * 3);
          const vCount = new Float32Array(nV);
          let fi = 0;
          for (let i = 0; i < currentMeshData.faces.length; i++) {
            const f = currentMeshData.faces[i];
            const r = colors[fi*3] || 0.5, g = colors[fi*3+1] || 0.5, b = colors[fi*3+2] || 0.5;
            fi++;
            for (let k = 0; k < 3; k++) {
              const vidx = f[k];
              vCol[vidx*3] += r; vCol[vidx*3+1] += g; vCol[vidx*3+2] += b;
              vCount[vidx] += 1;
            }
          }
          for (let i=0;i<nV;i++) {
            if (vCount[i] > 0) { vCol[i*3]/=vCount[i]; vCol[i*3+1]/=vCount[i]; vCol[i*3+2]/=vCount[i]; }
            else { vCol[i*3]=0.5; vCol[i*3+1]=0.5; vCol[i*3+2]=0.5; }
          }

          const positions = [];
          for (let i=0;i<currentMeshData.positions.length;i++) positions.push(currentMeshData.positions[i][0],currentMeshData.positions[i][1],currentMeshData.positions[i][2]);
          const indices = [];
          for (let i=0;i<currentMeshData.faces.length;i++) indices.push(currentMeshData.faces[i][0],currentMeshData.faces[i][1],currentMeshData.faces[i][2]);

          const geom = new THREE.BufferGeometry();
          geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          geom.setAttribute('color', new THREE.Float32BufferAttribute(vCol, 3));
          geom.setIndex(indices);
          geom.computeVertexNormals();

          const mat = new THREE.MeshPhongMaterial({ vertexColors: true, side: THREE.DoubleSide, flatShading: false, specular: 0x111111, shininess: 10 });
          clearDistortionMesh();
          currentDistortionMesh = new THREE.Mesh(geom, mat);
          modelScene.add(currentDistortionMesh);

          // 7. build colored mesh for UV panel (flat 2D mesh with same distortion colors)
          const uvPositions = [];
          for (let i = 0; i < currentUnwrapUv.length; i++) {
            uvPositions.push(currentUnwrapUv[i][0], currentUnwrapUv[i][1], 0);
          }
          const uvGeom = new THREE.BufferGeometry();
          uvGeom.setAttribute('position', new THREE.Float32BufferAttribute(uvPositions, 3));
          // share same color array (per-vertex colors already computed above)
          uvGeom.setAttribute('color', new THREE.Float32BufferAttribute(vCol, 3));
          uvGeom.setIndex(indices.slice());  // copy indices
          uvGeom.computeVertexNormals();

          const uvMat = new THREE.MeshPhongMaterial({ vertexColors: true, side: THREE.DoubleSide, flatShading: false, specular: 0x111111, shininess: 10 });
          clearUvDistortionMesh();
          currentUvDistortionMesh = new THREE.Mesh(uvGeom, uvMat);
          uvScene.add(currentUvDistortionMesh);

          // hide normal model and checkerboard
          setModelSolidVisible(false);
          if (currentTexturedMesh) currentTexturedMesh.visible = false;

          distortionEnabled = true;
          setStatus('共形扭曲: avg=' + avgErr.toFixed(4) + '  max=' + maxErr.toFixed(4) + '  (绿=1.0无扭曲, 红>1.5)', '#89f0b6');
        } catch (err) {
          console.error('QC error:', err);
          setStatus('扭曲计算失败: ' + err.message, '#ff9d9d');
          if (radioDistortion) radioDistortion.checked = false;
          if (radioDots) radioDots.checked = false;
          if (radioCheckerboard) { radioCheckerboard.checked = true; setTextureDistortionEnabled(true, "checkerboard"); }
        }
      }

      function rebuildUvGrid() {
        const grid = new THREE.Group();
        const gridMaterial = new THREE.LineBasicMaterial({ color: 0x1a2947, transparent: true, opacity: 0.85 });
        const coords = [];
        for (let i = -10; i <= 10; i++) {
          const t = i / 10;
          coords.push(-1, t, 0, 1, t, 0);
          coords.push(t, -1, 0, t, 1, 0);
        }
        const geom = new THREE.BufferGeometry();
        geom.setAttribute("position", new THREE.Float32BufferAttribute(coords, 3));
        grid.add(new THREE.LineSegments(geom, gridMaterial));
        uvScene.add(grid);
      }

      function clearGroup(scene, objectRef) {
        if (objectRef && objectRef.parent) {
          objectRef.parent.remove(objectRef);
        }
      }

      async function resolveSourceObject() {
        return loadBuiltinModel(getCurrentModelKey());
      }

      function getCurrentSourceLabel() {
        const m = getCurrentModelObj();
        return m ? m.label : "未知模型";
      }

      /**
       * 清除当前展开结果并重新加载模型
       */
      async function clearAndReload() {
        if (busy) return;
        // 隐藏耗时信息
        hideTiming();
        // 重新加载模型（内部已完成 UV/纹理/扭曲的清理和 pin 点重置）
        await loadModelPreview();
      }

      async function loadModelPreview() {
        if (busy) {
          return;
        }

        setBusy(true);
        setStatus("正在加载 OBJ 模型: " + getCurrentSourceLabel() + " ...");

        try {
          const resolved = await resolveSourceObject();
          const root = resolved.root;
          normalizeObject(root);

          clearGroup(modelScene, currentModelGroup);
          clearGroup(uvScene, currentUvLines);
          clearGroup(uvScene, currentUvPins);
          clearHomologyOverlay();
          clearOtherOverlays();
          clearTexturedMesh();
          clearDistortionMesh();
          distortionEnabled = false;
          currentUvLines = null;
          currentUvPins = null;
          currentUnwrapUv = null;
          textureEnabled = false;
          // 重置纹理显示单选框为未选中
          if (radioCheckerboard) radioCheckerboard.checked = false;
          if (radioDots) radioDots.checked = false;
          if (radioDistortion) radioDistortion.checked = false;

          setStatus("正在提取三角网格...");
          let meshData = collectMeshData(root);
          const repair = repairMeshForSolver(meshData);
          meshData = repair.meshData;
          currentCustomAnchors = null;  // 加载新模型时重置自定义 pin 点
          coneVertices = [];
          coneMode = false;
          controls.enabled = true;
          modelCanvas.style.cursor = '';
          const coneBtn = document.getElementById('cone-btn');
          if (coneBtn) {
            coneBtn.textContent = '🎯 锥奇异点';
            coneBtn.style.background = '#2a1a3e';
          }
          const anchors = chooseAnchorPair(meshData.positions);

          const modelVisual = buildModelGroup(root, anchors, meshData.positions, shouldShowPinPoints());
          currentModelGroup = modelVisual.group;
          currentPins = modelVisual.pinPoints;
          currentModelGroup.visible = true;
          modelScene.add(currentModelGroup);
          controls.target.set(0, 0, 0);
          controls.update();

          currentMeshData = meshData;
          currentSourcePath = resolved.sourcePath;
          currentRawFaces = resolved.rawFaces;  // 原始 OBJ 面数据（含四边形）
          updateConeDisplay();

          // 检测是否为四边形网格（原始面至少有 3/4 是四边面）
          if (currentRawFaces && currentRawFaces.length > 0) {
            let quadCount = 0;
            for (let i = 0; i < currentRawFaces.length; i++) {
              if (currentRawFaces[i].length === 4) quadCount++;
            }
            isQuadMesh = (quadCount >= currentRawFaces.length * 0.75);
          } else {
            isQuadMesh = false;
          }

          const faceType = isQuadMesh ? "四边面" : "三角形";

          const faceCount = currentRawFaces ? currentRawFaces.length : meshData.faces.length;
          const repairNote = (repair.edgeSplits > 0 || repair.vertexSplits > 0)
            ? " / 已修复非流形结构"
            : "";
          setStatus(
            "3D 预览: " + getCurrentSourceLabel() + " / " + meshData.positions.length + " 顶点 / " +
            faceCount + " " + faceType + repairNote + "，点击「开始展开」执行 UV",
            "#89f0b6"
          );
        } catch (error) {
          console.error(error);
          setStatus("模型加载失败: " + error.message, "#ff9d9d");
        } finally {
          setBusy(false);
        }
      }

      async function updateModel() {
        if (busy) return;

        if (!currentMeshData) {
          await loadModelPreview();
          if (!currentMeshData) return;
        }

        // UV 重算/更新前，先清理“其他计算”的覆盖层，避免与新模型/新网格混淆
        clearOtherOverlays();

        const method = getCurrentMethod();

        let methodLabel;
        if (method === 'cp') methodLabel = 'Circle Pattern';
        else if (method === 'cetm') methodLabel = 'CETM';
        else if (method === 'ricci') methodLabel = 'Ricci 流';
        else if (method === 'incflat') methodLabel = 'Incremental Flattening';
        else methodLabel = 'Circle Pattern';

        const wasmFnByMethod = { cp: "solve_cp", cetm: "solve_cetm", ricci: "solve_ricci", incflat: "solve_incremental_flattening" };
        const wasmFn = wasmFnByMethod[method] || "solve_cp";
        console.log("[uv-unwrap-cone] method=", method, "→", wasmFn, "model=", getCurrentModelKey());

        setBusy(true);
        setStatus("正在执行 " + methodLabel + "（" + method + " → " + wasmFn + "）...");
        hideTiming();

        try {
          const startTime = performance.now();
          // CETM lays the metric into the plane without cutting seams. An automatic
          // cone (Θ ≠ 2π) is a branch point, so the chart overlaps. Cones are
          // applied only after the user places them or clicks the Ben-Chen button.
          if (method !== 'cetm' && supportsConeSelection(method) && coneVertices.length === 0 && currentMeshData) {
            coneVertices = computeBenChenCones(currentMeshData);
            updateConeDisplay();
          }

          let unwrapResult;
          if (method === 'cp') {
            unwrapResult = await solveCirclePatternAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'cetm') {
            unwrapResult = await solveCETMAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'ricci') {
            unwrapResult = await solveRicciAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else if (method === 'incflat') {
            unwrapResult = await solveIncrementalFlatteningAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          } else {
            unwrapResult = await solveCirclePatternAsync(currentMeshData, function(p, t) {
              updateTimingProgress(p, t);
            });
          }

          const elapsedMs = unwrapResult.timeMs > 0 ? unwrapResult.timeMs : (performance.now() - startTime);
          currentUnwrapUv = unwrapResult.uv;
          // WASM 返回的 UV 坐标可能超出 [0,1] 范围，归一化以保证 2D 面板完整显示
          _normalizeUvBox(currentUnwrapUv);

          // 清除旧的扭曲显示（UV 变了）
          clearDistortionMesh();
          distortionEnabled = false;
          // 展开完成后启用纹理显示单选框，默认选中"棋盘格"
          if (radioCheckerboard && radioDots && radioDistortion) {
            radioCheckerboard.disabled = false;
            radioDots.disabled = false;
            radioDistortion.disabled = false;
            radioCheckerboard.checked = true;
            radioDots.checked = false;
            radioDistortion.checked = false;
            setTextureDistortionEnabled(true, "checkerboard");
          }

          // 更新 UV 面板标签
          const methodNames = { cp:'Circle Pattern', cetm:'CETM', ricci:'Ricci 流', incflat:'Incremental Flattening' };
          const uvPanelLabelEl = document.getElementById('uv-panel-label');
          uvPanelLabelEl.textContent = (methodNames[unwrapResult.method] || unwrapResult.method) + ' UV 网格';
          uvPanelLabelEl.style.color = '';

          clearGroup(uvScene, currentUvLines);
          clearGroup(uvScene, currentUvPins);
          const uvVisual = buildUvMesh(unwrapResult.uv, currentMeshData.faces, unwrapResult.anchors, shouldShowPinPoints());
          currentUvLines = uvVisual.lines;
          currentUvPins = uvVisual.pins;
          uvScene.add(currentUvLines);
          if (currentUvPins) uvScene.add(currentUvPins);

          let details =
            methodLabel +
            " / " + getCurrentSourceLabel() +
            " / " + currentMeshData.positions.length + " 顶点" +
            " / " + currentMeshData.faces.length + " 三角形";
          if (unwrapResult.C) details += " / C=" + unwrapResult.C.toFixed(1);
          if (unwrapResult.maxIter) details += " / 迭代=" + unwrapResult.maxIter;
          if (unwrapResult.optScheme) details += " / " + unwrapResult.optScheme;
          if (unwrapResult.pinInfo) details += " / pin=" + unwrapResult.pinInfo;
          if (unwrapResult.boundary) details += " / " + unwrapResult.boundary;
          if (unwrapResult.weight) details += " / " + unwrapResult.weight;
          if (typeof unwrapResult.cones === 'number') details += " / 锥奇异点 " + unwrapResult.cones + " 个";
          showTiming(elapsedMs, details, unwrapResult.flippedFaceCount);

          const color = unwrapResult.flippedFaceCount === 0 ? "#89f0b6" : "#ffd38a";
          setStatus(
            methodLabel + " 展开完成，翻转面 " + unwrapResult.flippedFaceCount + " 个",
            color
          );
        } catch (error) {
          console.error('展开失败:', error.message, error.stack);
          hideTiming();
          setStatus("展开失败: " + error.message, "#ff9d9d");
        } finally {
          setBusy(false);
        }
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        modelRenderer.render(modelScene, modelCamera);
        uvRenderer.render(uvScene, uvCamera);
      }

      rebuildUvGrid();
      initModelOptions();
      resize();
      setStatus("正在加载默认模型 3D 预览...", "#8cc4ff");
      window.addEventListener("resize", resize);
      modelSelect.addEventListener("change", loadModelPreview);
      reloadBtn.addEventListener("click", updateModel);
      clearBtn.addEventListener("click", clearAndReload);

      if (btnClearOther) btnClearOther.addEventListener("click", function () {
        clearOtherOverlays();
        setStatus("已清除其他计算显示", "#8cc4ff");
      });

      if (btnGc) btnGc.addEventListener("click", async function () {
        if (busy) return;
        setBusy(true);
        try {
          setStatus("正在计算 Gauss 曲率（angle deficit / area）...");
          clearOtherOverlays();
          await runDgpBasicOnCurrentMesh();

          const ret = simpleInstance.ccall("dgp_compute_gauss_curvature_per_area", "number", [], []);
          if (ret !== 0) throw new Error("compute_gauss_curvature_per_area 失败");
          const n = simpleInstance.ccall("dgp_get_gc_result_size", "number", [], []);
          const ptr = simpleInstance.ccall("dgp_get_gc_result", "number", [], []);
          if (!ptr || n !== currentMeshData.positions.length) throw new Error("Gauss 曲率结果长度异常: " + n);
          const K = new Array(n);
          for (let i = 0; i < n; i++) K[i] = simpleInstance.getValue(ptr + i * 8, "double");

          const overlay = buildGaussianCurvatureOverlay(currentMeshData, K);
          if (!overlay) throw new Error("Gauss 曲率可视化构建失败");
          currentOtherOverlay = overlay.object;
          modelScene.add(currentOtherOverlay);

          const info = "K(min/max)=(" + overlay.stats.min.toExponential(3) + ", " + overlay.stats.max.toExponential(3) + ")" +
                       " / norm=K/absMax (absMax=" + (overlay.stats.absMax || 1).toExponential(3) + ")" +
                       " / clip p=" + Math.round((overlay.stats.clipP || 0.98) * 100) + "%";
          if (otherCalcInfo) otherCalcInfo.textContent = info;
          showGaussColorbar(overlay.stats.min, overlay.stats.max);
          setStatus("Gauss 曲率计算完成 " + info, "#89f0b6");
        } catch (e) {
          console.error(e);
          setStatus("Gauss 曲率失败: " + e.message, "#ff9d9d");
        } finally {
          try { if (simpleInstance) simpleInstance.ccall("dispose", "void", [], []); } catch (_) {}
          setBusy(false);
        }
      });


      // 纹理显示单选框切换
      if (radioCheckerboard) {
        radioCheckerboard.addEventListener("change", function () {
          if (this.checked) {
            setTextureDistortionEnabled(true, "checkerboard");
            if (radioDots) radioDots.checked = false;
            if (radioDistortion) radioDistortion.checked = false;
          }
        });
      }
      if (radioDots) {
        radioDots.addEventListener("change", function () {
          if (this.checked) {
            setTextureDistortionEnabled(true, "dots");
            if (radioDistortion) radioDistortion.checked = false;
            if (radioCheckerboard) radioCheckerboard.checked = false;
          }
        });
      }
      if (radioDistortion) {
        radioDistortion.addEventListener("change", async function () {
          if (this.checked) {
            setTextureDistortionEnabled(false);
            await setDistortionEnabled(true);
          }
        });
      }
      
      // 页面启动时预加载 uv_unwrap_simple WASM
      updateStartButtonState();
      Promise.all([initSimpleSolver()]).then(([simpleOk]) => {
        updateStartButtonState();
        if (!simpleOk && !bdOk) {
          setStatus("WASM 引擎加载失败", "#ff9d9d");
        }
      });
      
      // 启动加载第一个模型
      (function(){ loadModelPreview(); })();
      animate();
    })();
  </script>
</body>
</html>
