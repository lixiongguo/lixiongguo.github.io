<!DOCTYPE html>

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: #1d1d1d;
      color: #e6e6e6;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 10px 16px;
      background: #2a2a2a;
      border-bottom: 1px solid #111;
      flex-shrink: 0;
    }
    .toolbar h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #f0f0f0;
    }
    .toolbar label {
      display: inline-flex;
      align-items: center;

    }
    select {

  </style>

<body>
  <div class="app">
    <div class="toolbar">
      <h1>四边形网格</h1>
      <label>模型
        <select id="model-select"></select>
      </label>
      <button id="run-miq" type="button">MIQ</button>
      <label>密度 <input id="grid-div" type="range" min="4" max="28" value="10"></label>
      <label><input type="checkbox" id="show-curvature" checked> 主曲率</label>
      <label><input type="checkbox" id="show-surface" checked> 表面</label>
      <label><input type="checkbox" id="show-wire" checked> 线框</label>
      <div class="stats" id="stats">正在加载…</div>
    </div>
    <div class="viewport">
      <canvas id="view"></canvas>
    </div>
  </div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const FALLBACK_MODELS = [
      "3holes_F7200.obj",
      "costa.obj",
      "double-torus_F6144.obj",
      "elephant.obj",
      "kitten_F18894.obj",
      "rocker-arm_F20088.obj",
      "torus_F7680.obj"
    ];

    const MODELS_DIR = (window.ALGO_MODELS_DIR || "assets/Models2").replace(/^\/+|\/+$/g, "");
    const modelFiles = (window.ALGO_MODEL_FILES && window.ALGO_MODEL_FILES.length)
      ? window.ALGO_MODEL_FILES.slice().sort()
      : FALLBACK_MODELS;

    const modelSelect = document.getElementById("model-select");
    const runButton = document.getElementById("run-miq");
    const gridDiv = document.getElementById("grid-div");
    const showCurvature = document.getElementById("show-curvature");
    const showSurface = document.getElementById("show-surface");
    const showWire = document.getElementById("show-wire");
    const statsEl = document.getElementById("stats");
    const canvas = document.getElementById("view");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x393939);

    const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 50);
    camera.position.set(1.15, 0.75, 1.35);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    scene.add(new THREE.AmbientLight(0xffffff, 0.38));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
    keyLight.position.set(0.55, 1.05, 0.85);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xd5dbe8, 0.42);
    fillLight.position.set(-0.9, 0.25, -0.45);
    scene.add(fillLight);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    const quadMaterial = new THREE.MeshStandardMaterial({
      color: 0xb8b8b8,
      roughness: 0.72,
      metalness: 0,
      side: THREE.DoubleSide,
      flatShading: false,
      polygonOffset: true,
      polygonOffsetFactor: 1,
      polygonOffsetUnits: 1
    });
    const triMaterial = new THREE.MeshStandardMaterial({
      color: 0xd39a6a,
      roughness: 0.72,
      metalness: 0,
      side: THREE.DoubleSide,
      flatShading: false,
      polygonOffset: true,
      polygonOffsetFactor: 1,
      polygonOffsetUnits: 1
    });
    const quadLineMaterial = new THREE.LineBasicMaterial({ color: 0x1c1c1c });
    const triLineMaterial = new THREE.LineBasicMaterial({ color: 0x6b3a16 });
    const curvatureK1Material = new THREE.LineBasicMaterial({ color: 0xe87d0d });
    const curvatureK2Material = new THREE.LineBasicMaterial({ color: 0x6aa8ff });

    let currentRoot = null;
    let curvatureGroup = null;

    function edgeKey(a, b) {
      return a < b ? a + "_" + b : b + "_" + a;
    }

    function parseOBJ(text) {
      const verts = [];
      const faces = [];
      const lines = text.split(/\r?\n/);
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith("v ")) {
          const p = line.split(/\s+/);
          verts.push([Number(p[1]), Number(p[2]), Number(p[3])]);
          continue;
        }
        if (!line.startsWith("f ") && !line.startsWith("f\t")) continue;
        const parts = line.slice(1).trim().split(/\s+/);
        const idx = [];
        for (let j = 0; j < parts.length; j++) {
          const raw = parseInt(parts[j].split("/")[0], 10);
          if (Number.isNaN(raw) || raw === 0) continue;
          idx.push(raw > 0 ? raw - 1 : verts.length + raw);
        }
        if (idx.length < 3) continue;
        for (let k = 1; k < idx.length - 1; k++) {
          const a = idx[0];
          const b = idx[k];
          const c = idx[k + 1];
          if (a !== b && b !== c && c !== a) faces.push([a, b, c]);
        }
      }
      return { verts, faces };
    }

    function centerAndScale(verts) {
      const min = [Infinity, Infinity, Infinity];
      const max = [-Infinity, -Infinity, -Infinity];
      for (let i = 0; i < verts.length; i++) {
        const v = verts[i];
        for (let k = 0; k < 3; k++) {
          if (v[k] < min[k]) min[k] = v[k];
          if (v[k] > max[k]) max[k] = v[k];
        }
      }
      const size = Math.max(max[0] - min[0], max[1] - min[1], max[2] - min[2]) || 1;
      const scale = 1 / size;
      const cx = (min[0] + max[0]) * 0.5;
      const cy = (min[1] + max[1]) * 0.5;
      const cz = (min[2] + max[2]) * 0.5;
      const out = new Array(verts.length);
      for (let i = 0; i < verts.length; i++) {
        const v = verts[i];
        out[i] = [(v[0] - cx) * scale, (v[1] - cy) * scale, (v[2] - cz) * scale];
      }
      return out;
    }

    function newellNormal(verts, loop) {
      let nx = 0;
      let ny = 0;
      let nz = 0;
      for (let i = 0; i < loop.length; i++) {
        const p = verts[loop[i]];
        const q = verts[loop[(i + 1) % loop.length]];
        nx += (p[1] - q[1]) * (p[2] + q[2]);
        ny += (p[2] - q[2]) * (p[0] + q[0]);
        nz += (p[0] - q[0]) * (p[1] + q[1]);
      }
      let len = Math.hypot(nx, ny, nz);
      if (len < 1e-12 && loop.length >= 3) {
        const a = verts[loop[0]];
        const b = verts[loop[1]];
        const c = verts[loop[2]];
        const ux = b[0] - a[0];
        const uy = b[1] - a[1];
        const uz = b[2] - a[2];
        const vx = c[0] - a[0];
        const vy = c[1] - a[1];
        const vz = c[2] - a[2];
        nx = uy * vz - uz * vy;
        ny = uz * vx - ux * vz;
        nz = ux * vy - uy * vx;
        len = Math.hypot(nx, ny, nz);
      }
      if (len < 1e-12) return [0, 1, 0];
      return [nx / len, ny / len, nz / len];
    }

    function paint() {
      return new Promise(function (resolve) { requestAnimationFrame(function () { resolve(); }); });
    }

    function loadClassicScript(src) {
      return new Promise(function (resolve, reject) {
        const existing = document.querySelector('script[data-quad-src="' + src + '"]');
        if (existing) {
          if (existing.dataset.loaded === "1") resolve();
          else existing.addEventListener("load", function () { resolve(); }, { once: true });
          return;
        }
        const script = document.createElement("script");
        script.src = src;
        script.dataset.quadSrc = src;
        script.onload = function () { script.dataset.loaded = "1"; resolve(); };
        script.onerror = function () { reject(new Error("无法加载 " + src)); };
        document.head.appendChild(script);
      });
    }

    let fieldInst = null;
    let wasmChain = Promise.resolve();
    function afterWasm(task) {
      const next = wasmChain.then(task, task);
      wasmChain = next.then(function () {}, function () {});
      return next;
    }

    async function fieldSolver() {
      if (fieldInst) return fieldInst;
      await loadClassicScript("assets/js/wasm-loader.js");
      await loadClassicScript("assets/wasm/uv_unwrap_field.js");
      if (typeof window.UvUnwrapFieldSolver !== "function") throw new Error("MIQ 引擎未加载");
      fieldInst = await window.UvUnwrapFieldSolver({
        locateFile: function (file) { return "assets/wasm/" + file; }
      });
      return fieldInst;
    }

    function wasmWriteDoubles(inst, values) {
      const ptr = inst._malloc(values.length * 8);
      for (let i = 0; i < values.length; i++) inst.setValue(ptr + i * 8, values[i], "double");
      return ptr;
    }

    function wasmWriteInts(inst, values) {
      const ptr = inst._malloc(values.length * 4);
      for (let i = 0; i < values.length; i++) inst.setValue(ptr + i * 4, values[i] | 0, "i32");
      return ptr;
    }

    function lerp3(a, b, t) {
      return [
        a[0] + (b[0] - a[0]) * t,
        a[1] + (b[1] - a[1]) * t,
        a[2] + (b[2] - a[2]) * t
      ];
    }

    function gridStep(span, divisions) {
      let k = Math.round(divisions / Math.max(span, 1e-6));
      if (k < 1) k = 1;
      if (k > 8) k = 8;
      return 1 / k;
    }

    // 割缝两侧的整数等值线才对得上。用每个三角形自己的角点 UV 画这些线，
    // 而不是把割缝上的多份坐标平均成一个顶点后再反查格点。
    function traceGrid(positions, faces, corners, divisions) {
      let uMin = Infinity, vMin = Infinity, uMax = -Infinity, vMax = -Infinity;
      for (let fi = 0; fi < corners.length; fi++) {
        const q = corners[fi];
        for (let k = 0; k < 3; k++) {
          const u = q[k][0], v = q[k][1];
          if (!Number.isFinite(u) || !Number.isFinite(v)) continue;
          if (u < uMin) uMin = u;
          if (v < vMin) vMin = v;
          if (u > uMax) uMax = u;
          if (v > vMax) vMax = v;
        }
      }
      const span = Math.max(uMax - uMin, vMax - vMin) || 1;
      const step = gridStep(span, divisions);
      const positionsOut = [];
      const seen = new Set();
      const cells = new Set();

      function quant(p) {
        return Math.round(p[0] * 1e5) + "," + Math.round(p[1] * 1e5) + "," + Math.round(p[2] * 1e5);
      }

      function addSegment(a, b) {
        const ka = quant(a);
        const kb = quant(b);
        if (ka === kb) return;
        const key = ka < kb ? ka + "|" + kb : kb + "|" + ka;
        if (seen.has(key)) return;
        seen.add(key);
        positionsOut.push(a[0], a[1], a[2], b[0], b[1], b[2]);
      }

      function cut(p, q, axis, value) {
        const hits = [];
        for (let e = 0; e < 3; e++) {
          const i0 = e;
          const i1 = (e + 1) % 3;
          const d = q[i1][axis] - q[i0][axis];
          if (Math.abs(d) < 1e-14) continue;
          const t = (value - q[i0][axis]) / d;
          if (t < -1e-6 || t > 1 + 1e-6) continue;
          hits.push(lerp3(p[i0], p[i1], Math.min(1, Math.max(0, t))));
        }
        if (hits.length >= 2) addSegment(hits[0], hits[1]);
      }

      for (let fi = 0; fi < faces.length; fi++) {
        const f = faces[fi];
        const q = corners[fi];
        if (!q) continue;
        let finite = true;
        for (let k = 0; k < 3; k++) {
          if (!Number.isFinite(q[k][0]) || !Number.isFinite(q[k][1])) finite = false;
        }
        if (!finite) continue;
        let tuMin = Infinity, tuMax = -Infinity, tvMin = Infinity, tvMax = -Infinity;
        for (let k = 0; k < 3; k++) {
          if (q[k][0] < tuMin) tuMin = q[k][0];
          if (q[k][0] > tuMax) tuMax = q[k][0];
          if (q[k][1] < tvMin) tvMin = q[k][1];
          if (q[k][1] > tvMax) tvMax = q[k][1];
        }
        if ((tuMax - tuMin) / step > 16 || (tvMax - tvMin) / step > 16) continue;
        const p = [positions[f[0]], positions[f[1]], positions[f[2]]];
        const iu0 = Math.ceil(tuMin / step - 1e-8);
        const iu1 = Math.floor(tuMax / step + 1e-8);
        for (let i = iu0; i <= iu1; i++) cut(p, q, 0, i * step);
        const iv0 = Math.ceil(tvMin / step - 1e-8);
        const iv1 = Math.floor(tvMax / step + 1e-8);
        for (let i = iv0; i <= iv1; i++) cut(p, q, 1, i * step);
        const cu0 = Math.floor(tuMin / step);
        const cu1 = Math.floor((tuMax - 1e-8) / step);
        const cv0 = Math.floor(tvMin / step);
        const cv1 = Math.floor((tvMax - 1e-8) / step);
        for (let iu = cu0; iu <= cu1; iu++) {
          for (let iv = cv0; iv <= cv1; iv++) cells.add(iu + "_" + iv);
        }
      }
      return { positions: positionsOut, cells: cells.size, step: step };
    }

    async function solveMIQUV(verts, faces) {
      const inst = await fieldSolver();
      const flatPos = new Float64Array(verts.length * 3);
      for (let i = 0; i < verts.length; i++) {
        flatPos[i * 3] = verts[i][0];
        flatPos[i * 3 + 1] = verts[i][1];
        flatPos[i * 3 + 2] = verts[i][2];
      }
      const flatFaces = new Int32Array(faces.length * 3);
      for (let i = 0; i < faces.length; i++) {
        flatFaces[i * 3] = faces[i][0];
        flatFaces[i * 3 + 1] = faces[i][1];
        flatFaces[i * 3 + 2] = faces[i][2];
      }
      const posPtr = wasmWriteDoubles(inst, flatPos);
      const facePtr = wasmWriteInts(inst, flatFaces);
      try {
        let rc = inst.ccall("load_mesh", "number", ["number", "number", "number", "number"], [posPtr, flatPos.length, facePtr, flatFaces.length]);
        if (rc !== 0) throw new Error("load_mesh " + rc);
        await paint();
        rc = inst.ccall("solve_miq", "number", ["number", "number"], [12, 2]);
        if (rc !== 0) throw new Error("MIQ 失败 (" + rc + ")");
        const count = inst.ccall("get_uv_result_size", "number", [], []);
        const ptr = inst.ccall("get_uv_result", "number", [], []);
        const uv = new Array(verts.length);
        for (let i = 0; i < verts.length; i++) {
          uv[i] = [inst.getValue(ptr + (i * 2) * 8, "double"), inst.getValue(ptr + (i * 2 + 1) * 8, "double")];
        }
        if (count < verts.length * 2) throw new Error("UV 数量不足");
        const cornerCount = inst.ccall("get_corner_uv_size", "number", [], []);
        if (cornerCount < faces.length * 6) throw new Error("缺少三角形角点坐标");
        const cornerPtr = inst.ccall("get_corner_uv", "number", [], []);
        const corners = new Array(faces.length);
        for (let fi = 0; fi < faces.length; fi++) {
          const base = cornerPtr + fi * 48;
          corners[fi] = [
            [inst.getValue(base, "double"), inst.getValue(base + 8, "double")],
            [inst.getValue(base + 16, "double"), inst.getValue(base + 24, "double")],
            [inst.getValue(base + 32, "double"), inst.getValue(base + 40, "double")]
          ];
        }
        const timeMs = inst.ccall("get_last_time_ms", "number", [], []);
        inst.ccall("dispose", "void", [], []);
        return { uv: uv, corners: corners, timeMs: timeMs };
      } finally {
        inst._free(posPtr);
        inst._free(facePtr);
      }
    }

    function uploadMesh(inst, verts, faces) {
      const flatPos = new Float64Array(verts.length * 3);
      for (let i = 0; i < verts.length; i++) {
        flatPos[i * 3] = verts[i][0];
        flatPos[i * 3 + 1] = verts[i][1];
        flatPos[i * 3 + 2] = verts[i][2];
      }
      const flatFaces = new Int32Array(faces.length * 3);
      for (let i = 0; i < faces.length; i++) {
        flatFaces[i * 3] = faces[i][0];
        flatFaces[i * 3 + 1] = faces[i][1];
        flatFaces[i * 3 + 2] = faces[i][2];
      }
      const posPtr = wasmWriteDoubles(inst, flatPos);
      const facePtr = wasmWriteInts(inst, flatFaces);
      const rc = inst.ccall("load_mesh", "number", ["number", "number", "number", "number"], [posPtr, flatPos.length, facePtr, flatFaces.length]);
      inst._free(posPtr);
      inst._free(facePtr);
      if (rc !== 0) throw new Error("load_mesh " + rc);
    }

    // QuadCover 的交叉场来自 Weingarten 主曲率方向（PrincipalCurvatureField::estimateFromWeingarten）。
    async function computePrincipalDirs(verts, faces) {
      const inst = await fieldSolver();
      const t0 = performance.now();
      uploadMesh(inst, verts, faces);
      const rc = inst.ccall("step1_compute_principal_field", "number", [], []);
      if (rc !== 0) throw new Error("主曲率失败 (" + rc + ")");
      const count = inst.ccall("get_face_dirs_size", "number", [], []);
      const ptr = inst.ccall("get_face_dirs", "number", [], []);
      if (!ptr || count < faces.length * 3) throw new Error("主曲率方向数量不足");
      let dirs;
      if (inst.HEAPF64 && (ptr % 8) === 0) dirs = inst.HEAPF64.slice(ptr >> 3, (ptr >> 3) + count);
      else {
        dirs = new Float64Array(count);
        for (let i = 0; i < count; i++) dirs[i] = inst.getValue(ptr + i * 8, "double");
      }
      inst.ccall("dispose", "void", [], []);
      return { dirs: dirs, timeMs: performance.now() - t0 };
    }

    function clearCurvature() {
      if (!curvatureGroup) return;
      scene.remove(curvatureGroup);
      disposeRoot(curvatureGroup);
      curvatureGroup = null;
    }

    function buildCurvatureLines(verts, faces, dirs) {
      const step = faces.length > 8000 ? Math.ceil(faces.length / 6000) : 1;
      const k1 = [];
      const k2 = [];
      for (let fi = 0; fi < faces.length; fi += step) {
        const f = faces[fi];
        const p0 = verts[f[0]];
        const p1 = verts[f[1]];
        const p2 = verts[f[2]];
        const c = [(p0[0] + p1[0] + p2[0]) / 3, (p0[1] + p1[1] + p2[1]) / 3, (p0[2] + p1[2] + p2[2]) / 3];
        const e1x = p1[0] - p0[0], e1y = p1[1] - p0[1], e1z = p1[2] - p0[2];
        const e2x = p2[0] - p0[0], e2y = p2[1] - p0[1], e2z = p2[2] - p0[2];
        let nx = e1y * e2z - e1z * e2y;
        let ny = e1z * e2x - e1x * e2z;
        let nz = e1x * e2y - e1y * e2x;
        const area2 = Math.hypot(nx, ny, nz);
        if (area2 < 1e-12) continue;
        nx /= area2; ny /= area2; nz /= area2;
        let dx = dirs[fi * 3], dy = dirs[fi * 3 + 1], dz = dirs[fi * 3 + 2];
        const nd = dx * nx + dy * ny + dz * nz;
        dx -= nd * nx; dy -= nd * ny; dz -= nd * nz;
        const dlen = Math.hypot(dx, dy, dz);
        if (dlen < 1e-8) continue;
        dx /= dlen; dy /= dlen; dz /= dlen;
        const ox = ny * dz - nz * dy;
        const oy = nz * dx - nx * dz;
        const oz = nx * dy - ny * dx;
        const half = Math.sqrt(area2) * 0.22;
        const lift = 0.003;
        const ox0 = c[0] + nx * lift, oy0 = c[1] + ny * lift, oz0 = c[2] + nz * lift;
        k1.push(ox0 - dx * half, oy0 - dy * half, oz0 - dz * half, ox0 + dx * half, oy0 + dy * half, oz0 + dz * half);
        k2.push(ox0 - ox * half, oy0 - oy * half, oz0 - oz * half, ox0 + ox * half, oy0 + oy * half, oz0 + oz * half);
      }
      const group = new THREE.Group();
      group.name = "curvature";
      if (k1.length) {
        const lines = makeLines(k1, curvatureK1Material);
        lines.userData.wire = false;
        group.add(lines);
      }
      if (k2.length) {
        const lines = makeLines(k2, curvatureK2Material);
        lines.userData.wire = false;
        group.add(lines);
      }
      return group;
    }

    function applyCurvatureVisibility() {
      if (curvatureGroup) curvatureGroup.visible = showCurvature.checked;
    }

    function pushTriangle(positions, normals, verts, i0, i1, i2, normal) {
      const ids = [i0, i1, i2];
      for (let k = 0; k < 3; k++) {
        const v = verts[ids[k]];
        positions.push(v[0], v[1], v[2]);
        normals.push(normal[0], normal[1], normal[2]);
      }
    }

    function pushEdge(out, seen, verts, i, j) {
      const key = edgeKey(i, j);
      if (seen.has(key)) return;
      seen.add(key);
      const p = verts[i];
      const q = verts[j];
      out.push(p[0], p[1], p[2], q[0], q[1], q[2]);
    }

    function makeMesh(positions, normals, material) {
      const geom = new THREE.BufferGeometry();
      geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
      return new THREE.Mesh(geom, material);
    }

    function makeLines(positions, material) {
      const geom = new THREE.BufferGeometry();
      geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      const lines = new THREE.LineSegments(geom, material);
      lines.userData.wire = true;
      return lines;
    }

    function buildSurface(verts, faces, material) {
      const pos = [];
      const nrm = [];
      for (let i = 0; i < faces.length; i++) {
        const f = faces[i];
        const normal = newellNormal(verts, f);
        for (let k = 1; k < f.length - 1; k++) {
          pushTriangle(pos, nrm, verts, f[0], f[k], f[k + 1], normal);
        }
      }
      return makeMesh(pos, nrm, material);
    }

    function buildPolygonObject(verts, faces, material, lineMaterial) {
      const pos = [];
      const nrm = [];
      const edgePos = [];
      const seen = new Set();
      for (let i = 0; i < faces.length; i++) {
        const f = faces[i];
        const normal = newellNormal(verts, f);
        if (f.length === 3) {
          pushTriangle(pos, nrm, verts, f[0], f[1], f[2], normal);
        } else {
          pushTriangle(pos, nrm, verts, f[0], f[1], f[2], normal);
          pushTriangle(pos, nrm, verts, f[0], f[2], f[3], normal);
        }
        for (let k = 0; k < f.length; k++) pushEdge(edgePos, seen, verts, f[k], f[(k + 1) % f.length]);
      }
      const root = new THREE.Group();
      if (pos.length) root.add(makeMesh(pos, nrm, material));
      if (edgePos.length) root.add(makeLines(edgePos, lineMaterial));
      return root;
    }

    function disposeRoot(root) {
      root.traverse(function (child) {
        if (child.geometry) child.geometry.dispose();
      });
    }

    function applyVisibility() {
      if (!currentRoot) return;
      const surface = showSurface.checked;
      const wire = showWire.checked;
      currentRoot.traverse(function (child) {
        if (child.isMesh) child.visible = surface;
        if (child.isLineSegments) child.visible = wire;
      });
    }

    function resize() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      if (width < 1 || height < 1) return;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    }

    let loadToken = 0;
    let sourceMesh = null;
    let cachedUV = null;
    let solving = false;
    let rerun = false;

    function showRoot(root) {
      if (currentRoot) {
        scene.remove(currentRoot);
        disposeRoot(currentRoot);
      }
      currentRoot = root;
      scene.add(currentRoot);
      applyVisibility();
    }

    function showInput(verts, faces) {
      const root = buildPolygonObject(verts, faces, triMaterial, triLineMaterial);
      showRoot(root);
      statsEl.textContent = "输入三角网格 · 顶点 " + verts.length + " · 三角面 " + faces.length;
    }

    function showQuads(verts, faces, grid, timeMs) {
      if (!grid.positions.length) {
        showInput(verts, faces);
        statsEl.textContent = "MIQ 没有抽出四边网格线";
        return;
      }
      const root = new THREE.Group();
      root.add(buildSurface(verts, faces, quadMaterial));
      root.add(makeLines(grid.positions, quadLineMaterial));
      showRoot(root);
      const seconds = (timeMs / 1000).toFixed(1);
      statsEl.textContent = "MIQ · 四边单元 " + grid.cells + " · " + seconds + "s";
    }

    async function runMIQ() {
      if (!sourceMesh) return;
      if (solving) { rerun = true; return; }
      const mesh = sourceMesh;
      const token = mesh.token;
      const divisions = Number(gridDiv.value) || 10;
      solving = true;
      runButton.disabled = true;
      modelSelect.disabled = true;
      gridDiv.disabled = true;
      try {
        if (!cachedUV || cachedUV.token !== token) {
          statsEl.textContent = "MIQ 求解中…";
          await paint();
          const solved = await afterWasm(function () { return solveMIQUV(mesh.verts, mesh.faces); });
          if (token !== loadToken) return;
          cachedUV = { token: token, corners: solved.corners, timeMs: solved.timeMs };
        }
        const grid = traceGrid(mesh.verts, mesh.faces, cachedUV.corners, divisions);
        if (token !== loadToken) return;
        showQuads(mesh.verts, mesh.faces, grid, cachedUV.timeMs);
      } catch (error) {
        if (token !== loadToken) return;
        statsEl.textContent = "MIQ 失败：" + (error && error.message ? error.message : error);
      } finally {
        solving = false;
        if (token === loadToken) {
          runButton.disabled = false;
          modelSelect.disabled = false;
          gridDiv.disabled = false;
        }
        if (rerun) {
          rerun = false;
          if (sourceMesh && sourceMesh.token === loadToken) runMIQ();
        }
      }
    }

    async function loadModel(file) {
      const token = ++loadToken;
      cachedUV = null;
      modelSelect.disabled = true;
      runButton.disabled = true;
      statsEl.textContent = "正在加载 " + file + " …";
      try {
        const response = await fetch(MODELS_DIR + "/" + file);
        if (!response.ok) throw new Error("HTTP " + response.status);
        const text = await response.text();
        if (token !== loadToken) return;
        const parsed = parseOBJ(text);
        if (!parsed.verts.length || !parsed.faces.length) throw new Error("OBJ 里没有网格");
        const verts = centerAndScale(parsed.verts);
        sourceMesh = { verts: verts, faces: parsed.faces, token: token };
        showInput(verts, parsed.faces);
        clearCurvature();
        if (token !== loadToken) return;
        statsEl.textContent = "主曲率计算中…";
        await paint();
        const field = await afterWasm(function () {
          if (token !== loadToken) return null;
          return computePrincipalDirs(verts, parsed.faces);
        });
        if (token !== loadToken) return;
        if (field) {
          curvatureGroup = buildCurvatureLines(verts, parsed.faces, field.dirs);
          scene.add(curvatureGroup);
          applyCurvatureVisibility();
          const ms = Math.round(field.timeMs);
          statsEl.textContent = "主曲率场 · Weingarten · 三角面 " + parsed.faces.length + " · " + ms + " ms · 橙=主方向，蓝=正交";
        }
        modelSelect.disabled = false;
        runButton.disabled = false;
      } catch (error) {
        if (token !== loadToken) return;
        statsEl.textContent = "加载失败：" + (error && error.message ? error.message : error);
        modelSelect.disabled = false;
        runButton.disabled = false;
      }
    }

    for (let i = 0; i < modelFiles.length; i++) {
      const option = document.createElement("option");
      option.value = modelFiles[i];
      option.textContent = modelFiles[i].replace(/\.obj$/i, "");
      modelSelect.appendChild(option);
    }
    const initial = modelFiles.indexOf("torus_F7680.obj");
    modelSelect.selectedIndex = initial >= 0 ? initial : 0;
    modelSelect.addEventListener("change", function () {
      loadModel(modelSelect.value);
    });
    runButton.addEventListener("click", runMIQ);
    gridDiv.addEventListener("change", function () {
      if (cachedUV) runMIQ();
    });
    showCurvature.addEventListener("change", applyCurvatureVisibility);
    showSurface.addEventListener("change", applyVisibility);
    showWire.addEventListener("change", applyVisibility);
    window.addEventListener("resize", resize);

    function frame() {
      requestAnimationFrame(frame);
      controls.update();
      renderer.render(scene, camera);
    }

    resize();
    loadModel(modelSelect.value);
    frame();
  </script>
</body>
</html>
