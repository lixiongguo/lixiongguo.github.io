webgl-water: '<h2>光的舞蹈-焦散</h2>

  <p>焦散(''caustic'')是光线经过经过表面的散射和折射作用后形成的现象。</p>

  <p><img alt="image-20250801140209582" src="https://lgximgs.oss-cn-beijing.aliyuncs.com/images/image-20250801140209582.png" /></p>

  <p><img alt="image-20250724090825649" src="https://lgximgs.oss-cn-beijing.aliyuncs.com/images/image-20250724090825649.png" /></p>

  <p>水面由于有水波(wave)的存在，使其构成了多个凹面镜与凸面镜,最简单的焦散效果—透镜聚焦</p>

  <p><img alt="image-20250724091317364" src="https://lgximgs.oss-cn-beijing.aliyuncs.com/images/image-20250724091317364.png" /></p>

  <p>实时渲染的模拟方案:直接用一个triangle mesh来做为光源波面</p>

  <p><img alt="image-20250801134149935" src="https://lgximgs.oss-cn-beijing.aliyuncs.com/images/image-20250801134149935.png" /></p>

  <p><em>图：实时渲染管线 — (1) Use mesh for the light wavefront，将三角形网格作为光源波面；(2) Refract vertices through the surface，顶点经水面折射；(3) Intersect rays with the ground plane，与地平面求交得到焦散图案。</em></p>

  <p>通过模拟光线的运动可以实现效果，但是需要消耗太多运算资源。不显式计算顶点位置，直接求原始三角形与折射后三角形的面积比。</p>

  <!-- ![image-20250801160146361](https://lgximgs.oss-cn-beijing.aliyuncs.com/images/image-20250801160146361.png)


  *图：GLSL 面积比计算。可以不显式计算顶点位置，直接求原始三角形与折射后三角形的面积比。利用 fragment shader 的 2x2 并行求值特性，通过 `dFdx()` / `dFdy()` 有限差分得到屏幕空间偏导数，计算面积比并作为颜色输出：* -->


  <div class="codehilite"><pre><span></span><code><span class="kt">float</span><span class="w"> </span><span class="n">oldArea</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">length</span><span class="p">(</span><span class="n">dFdx</span><span class="p">(</span><span class="n">oldPos</span><span class="p">))</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="n">length</span><span class="p">(</span><span class="n">dFdy</span><span class="p">(</span><span class="n">oldPos</span><span class="p">));</span>

  <span class="kt">float</span><span class="w"> </span><span class="n">newArea</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">length</span><span class="p">(</span><span class="n">dFdx</span><span class="p">(</span><span class="n">newPos</span><span class="p">))</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="n">length</span><span class="p">(</span><span class="n">dFdy</span><span class="p">(</span><span class="n">newPos</span><span class="p">));</span>

  <span class="nb">gl_FragColor</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="kt">vec4</span><span class="p">(</span><span class="n">oldArea</span><span class="w"> </span><span class="o">/</span><span class="w"> </span><span class="n">newArea</span><span class="p">,</span><span class="w"> </span><span class="mo">0</span><span class="p">,</span><span class="w"> </span><span class="mf">0.2</span><span class="p">);</span>

  </code></pre></div>'
bezier-editor: '<h2>Bézier 曲线编辑器</h2>

  <p>Bézier 曲线是计算机图形学中最基础的参数曲线，由法国工程师 Pierre Bézier 于 1962 年在雷诺汽车公司开发，用于汽车车身设计。</p>

  <h3>三次 Bézier 曲线</h3>

  <p>三次 Bézier 曲线由 4 个控制点定义：两个锚点 $P_0$、$P_3$ 和两个控制手柄 $P_1$、$P_2$：</p>

  <p>$$B(t) = (1-t)^3 P_0 + 3(1-t)^2 t P_1 + 3(1-t) t^2 P_2 + t^3 P_3, \quad t \in [0,1]$$</p>

  <p><strong>De Casteljau 递归构造</strong>（几何直觉更直观）：</p>

  <p>给定控制点 ${P_0, P_1, P_2, P_3}$，递推插值：</p>

  <p>$$P_i^{(0)} = P_i$$<br />

  $$P_i^{(k)} = (1-t) \cdot P_i^{(k-1)} + t \cdot P_{i+1}^{(k-1)}$$</p>

  <p>最终 $B(t) = P_0^{(3)}$ 即最顶层的唯一点。</p>

  <h3>曲线拼接</h3>

  <p>相邻两段曲线在共享锚点处需要满足连续性：</p>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">级别</th>

  <th style="text-align: left;">条件</th>

  <th style="text-align: left;">含义</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;">$C^0$</td>

  <td style="text-align: left;">端点重合</td>

  <td style="text-align: left;">连续但不光滑</td>

  </tr>

  <tr>

  <td style="text-align: left;">$C^1$</td>

  <td style="text-align: left;">一阶导数连续</td>

  <td style="text-align: left;">光滑拼接（共享手柄共线等距）</td>

  </tr>

  <tr>

  <td style="text-align: left;">$G^1$</td>

  <td style="text-align: left;">切向量同向</td>

  <td style="text-align: left;">视觉光滑（共享手柄共线，不等距即可）</td>

  </tr>

  </tbody>

  </table>

  <h3>Photoshop 钢笔工具</h3>

  <p>PS 钢笔工具的核心操作：</p>

  <ul>

  <li><strong>单击</strong>：添加直线锚点（无控制手柄）</li>

  <li><strong>拖拽</strong>：添加曲线锚点，拖出两个对称的手柄</li>

  <li><strong>Alt+拖拽手柄</strong>：打破对称，单独调整一侧手柄</li>

  <li><strong>Ctrl+拖拽锚点</strong>：移动已有锚点</li>

  <li><strong>单击已有锚点</strong>：删除该锚点</li>

  <li><strong>闭合路径</strong>：点击起始锚点形成封闭曲线</li>

  </ul>

  <h3>数学性质</h3>

  <ul>

  <li><strong>仿射不变性</strong>：对控制点做仿射变换等价于对曲线做相同变换</li>

  <li><strong>凸包性</strong>：曲线始终在控制点的凸包内</li>

  <li><strong>端点插值</strong>：$B(0) = P_0$，$B(1) = P_3$</li>

  <li><strong>端点切向</strong>：$B''(0) = 3(P_1 - P_0)$，$B''(1) = 3(P_3 - P_2)$</li>

  </ul>

  <h3>参考</h3>

  <ul>

  <li>Bézier, P. (1972). <em>Numerical Control: Mathematics and Applications.</em></li>

  <li>Farin, G. (2002). <em>Curves and Surfaces for CAGD</em> (5th ed.). Academic Press.</li>

  </ul>'
boid: '<h2>Boid — 群体运动算法</h2>

  <p>Boid 算法由 Craig Reynolds 于 1986 年提出，用三条简单规则模拟鸟群、鱼群等群体运动行为——<strong>没有中央控制，完全由个体自治产生涌现现象</strong>。</p>

  <h3>三条核心规则</h3>

  <p>每个个体（Boid）根据周围邻居的状态调整自己的速度，三条规则等权叠加：</p>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">规则</th>

  <th style="text-align: left;">含义</th>

  <th style="text-align: left;">效果</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>分离 (Separation)</strong></td>

  <td style="text-align: left;">远离附近个体，避免碰撞</td>

  <td style="text-align: left;">保持最小间距</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>对齐 (Alignment)</strong></td>

  <td style="text-align: left;">匹配邻域的平均速度方向</td>

  <td style="text-align: left;">形成一致航向</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>凝聚 (Cohesion)</strong></td>

  <td style="text-align: left;">飞向邻域的平均位置</td>

  <td style="text-align: left;">防止群体解散</td>

  </tr>

  </tbody>

  </table>

  <h3>形式化定义</h3>

  <p>对 Boid $i$，定义邻域 $N_i = {\ j \mid |\mathbf{p}_j - \mathbf{p}_i| &lt; r\ }$（或取前 $k$ 个最近邻居）。</p>

  <p><strong>分离：</strong></p>

  <p>$$\mathbf{F}<em>{\text{sep}} = -\sum</em>{j \in N_i} \frac{\mathbf{p}_j - \mathbf{p}_i}{|\mathbf{p}_j - \mathbf{p}_i|^2}$$</p>

  <p>排斥力与距离平方成反比——越近的邻居排斥越强。</p>

  <p><strong>对齐：</strong></p>

  <p>$$\mathbf{F}<em>{\text{align}} = \frac{1}{|N_i|}\sum</em>{j \in N_i} \mathbf{v}_j - \mathbf{v}_i$$</p>

  <p>将自身速度拉向邻居的平均速度。</p>

  <p><strong>凝聚：</strong></p>

  <p>$$\mathbf{F}<em>{\text{coh}} = \frac{1}{|N_i|}\sum</em>{j \in N_i} \mathbf{p}_j - \mathbf{p}_i$$</p>

  <p>将自身位置拉向邻居的质心。</p>

  <h3>更新方程</h3>

  <p>每帧对每个 Boid 更新速度与位置：</p>

  <p>$$\mathbf{v}<em>i \gets \mathbf{v}_i + w_s \cdot \mathbf{F}</em>{\text{sep}} + w_a \cdot \mathbf{F}<em>{\text{align}} + w_c \cdot \mathbf{F}</em>{\text{coh}}$$</p>

  <p>$$\mathbf{v}<em>i \gets \text{clamp}(|\mathbf{v}_i|, v</em>{\min}, v_{\max}) \cdot \frac{\mathbf{v}_i}{|\mathbf{v}_i|}$$</p>

  <p>$$\mathbf{p}_i \gets \mathbf{p}_i + \mathbf{v}_i \cdot \Delta t$$</p>

  <h3>扩展规则</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">扩展</th>

  <th style="text-align: left;">效果</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>边界回避</strong></td>

  <td style="text-align: left;">遇到边界时转向，避免飞出视野</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>目标吸引</strong></td>

  <td style="text-align: left;">群体向鼠标/目标点靠拢</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>障碍回避</strong></td>

  <td style="text-align: left;">射线检测避障物</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>视野限制</strong></td>

  <td style="text-align: left;">只考虑前方锥形视野内的邻居</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>多群体</strong></td>

  <td style="text-align: left;">不同群体用不同规则权重，出现分离/合并</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>捕食者-猎物</strong></td>

  <td style="text-align: left;">分离对捕食者更强，猎物额外逃离</td>

  </tr>

  </tbody>

  </table>

  <h3>复杂度与优化</h3>

  <p>朴素实现是 $O(n^2)$（每对 Boid 检查距离），实际优化方法：</p>

  <ul>

  <li><strong>空间哈希 / 网格</strong>：将空间划分为单元格，只检查相邻单元格</li>

  <li><strong>K-D Tree</strong>：对空间位置建树，$O(n \log n)$ 邻居查询</li>

  <li><strong>固定 $k$ 近邻</strong>：不扫描所有邻居，只取最近的 $k$ 个</li>

  </ul>

  <h3>涌现现象</h3>

  <p>三条简单规则的叠加产生复杂群体行为：</p>

  <ul>

  <li><strong>群体转向</strong>：领头个体偏转 → 对齐传播 → 整个群体同步转向</li>

  <li><strong>分裂与合并</strong>：遇到障碍 → 分离压倒凝聚 → 分裂 → 绕过障碍 → 凝聚恢复 → 合并</li>

  <li><strong>漩涡</strong>：边界 + 速度限制产生回转漩涡</li>

  <li><strong>线形队形</strong>：对齐 + 凝聚在高速时易形成线形（V 形）</li>

  </ul>

  <h3>与其他模型的对比</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">方法</th>

  <th style="text-align: left;">机制</th>

  <th style="text-align: left;">全局控制</th>

  <th style="text-align: left;">适用场景</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>Boid</strong></td>

  <td style="text-align: left;">3 条局部规则叠加</td>

  <td style="text-align: left;">无中心</td>

  <td style="text-align: left;">鸟群、鱼群</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>Vicsek 模型</strong></td>

  <td style="text-align: left;">仅对齐 + 随机噪声</td>

  <td style="text-align: left;">无中心</td>

  <td style="text-align: left;">物理相变研究</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>Couzin 模型</strong></td>

  <td style="text-align: left;">分区规则（排斥/对齐/吸引）</td>

  <td style="text-align: left;">无中心</td>

  <td style="text-align: left;">分层群体行为</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>ORCA</strong></td>

  <td style="text-align: left;">速度障碍法</td>

  <td style="text-align: left;">无中心</td>

  <td style="text-align: left;">机器人导航</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>势场法</strong></td>

  <td style="text-align: left;">全局势函数梯度</td>

  <td style="text-align: left;">全局势场</td>

  <td style="text-align: left;">路径规划</td>

  </tr>

  </tbody>

  </table>

  <h3>参考</h3>

  <ul>

  <li>Reynolds, C. W. (1987). "Flocks, herds and schools: A distributed behavioral model." <em>SIGGRAPH ''87</em>.</li>

  <li>Vicsek, T., et al. (1995). "Novel type of phase transition in a system of self-driven particles." <em>Physical Review Letters</em>.</li>

  <li>Couzin, I. D., et al. (2002). "Collective memory and spatial sorting in animal groups." <em>Journal of Theoretical Biology</em>.</li>

  </ul>'
gaussian-splat-ply: '<h2>3D Gaussian Splatting（3DGS）高斯基元渲染</h2>

  <p>3D Gaussian Splatting 是 2023 年提出的新一代场景重建与渲染方法，它用<strong>数百万个各向异性的 3D 高斯椭球体</strong>精确建模现实场景，实现照片级真实感的实时渲染。</p>

  <h3>核心思想</h3>

  <p>与传统的点云或 Mesh 不同，每个高斯核在三维空间中具有：</p>

  <ul>

  <li><strong>位置</strong> <code>μ ∈ ℝ³</code>（均值中心）</li>

  <li><strong>协方差矩阵</strong> <code>Σ ∈ ℝ³ˣ³</code>（椭球的形状与方向）</li>

  <li><strong>颜色</strong> 由球面谐波函数（Spherical Harmonics, SH）表示</li>

  <li><strong>不透明度</strong> <code>α ∈ [0,1]</code></li>

  </ul>

  <p>场景由 $N$ 个 3D 高斯混合表示：</p>

  <p>$$G(\mathbf{x}) = \exp\left(-\frac{1}{2}(\mathbf{x} - \mathbf{\mu})^\top \mathbf{\Sigma}^{-1} (\mathbf{x} - \mathbf{\mu})\right)$$</p>

  <h3>渲染流程（Tile-based Rasterization）</h3>

  <ol>

  <li><strong>排好深度序</strong>：所有高斯核按到相机的距离排序</li>

  <li><strong>投影到屏幕</strong>：3D 协方差矩阵 → 2D 屏幕协方差矩阵</li>

  <li><strong>α-blending</strong>：从近到远逐层叠加颜色</li>

  </ol>

  <p>$$C = \sum_{i=1}^{N} c_i \alpha_i \prod_{j=1}^{i-1} (1 - \alpha_j)$$</p>

  <h3>特点</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">优势</th>

  <th style="text-align: left;">说明</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>照片级真实感</strong></td>

  <td style="text-align: left;">捕捉视相关效果（高光、反射）</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>实时渲染</strong></td>

  <td style="text-align: left;">≥30 FPS 在普通 GPU 上</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>显式表示</strong></td>

  <td style="text-align: left;">无需神经网络推理，直接光栅化</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>紧凑</strong></td>

  <td style="text-align: left;">场景压缩为几 MB ~ 几十 MB 的 <code>.spz</code> / <code>.ply</code> 文件</td>

  </tr>

  </tbody>

  </table>

  <h3>SPZ 格式</h3>

  <p><code>.spz</code> 格式是专门为 Gaussian Splatting 优化的压缩格式，将位置、协方差、颜色、SH 系数等数据压缩存储，便于网络传输。</p>

  <h3>参考</h3>

  <ul>

  <li>Kerbl et al. (2023). "3D Gaussian Splatting for Real-Time Radiance Field Rendering." <em>ACM Transactions on Graphics (SIGGRAPH 2023)</em>.</li>

  <li>gsplat.js: WebGL-based 3DGS viewer by Kevin Kwok.</li>

  </ul>'
gaussian-splat: '<h2>3D Gaussian Splatting（3DGS）高斯基元渲染</h2>

  <p>3D Gaussian Splatting 是 2023 年提出的新一代场景重建与渲染方法，它用<strong>数百万个各向异性的 3D 高斯椭球体</strong>精确建模现实场景，实现照片级真实感的实时渲染。</p>

  <h3>核心思想</h3>

  <p>与传统的点云或 Mesh 不同，每个高斯核在三维空间中具有：</p>

  <ul>

  <li><strong>位置</strong> <code>μ ∈ ℝ³</code>（均值中心）</li>

  <li><strong>协方差矩阵</strong> <code>Σ ∈ ℝ³ˣ³</code>（椭球的形状与方向）</li>

  <li><strong>颜色</strong> 由球面谐波函数（Spherical Harmonics, SH）表示</li>

  <li><strong>不透明度</strong> <code>α ∈ [0,1]</code></li>

  </ul>

  <p>场景由 $N$ 个 3D 高斯混合表示：</p>

  <p>$$G(\mathbf{x}) = \exp\left(-\frac{1}{2}(\mathbf{x} - \mathbf{\mu})^\top \mathbf{\Sigma}^{-1} (\mathbf{x} - \mathbf{\mu})\right)$$</p>

  <h3>渲染流程（Tile-based Rasterization）</h3>

  <ol>

  <li><strong>排好深度序</strong>：所有高斯核按到相机的距离排序</li>

  <li><strong>投影到屏幕</strong>：3D 协方差矩阵 → 2D 屏幕协方差矩阵</li>

  <li><strong>α-blending</strong>：从近到远逐层叠加颜色</li>

  </ol>

  <p>$$C = \sum_{i=1}^{N} c_i \alpha_i \prod_{j=1}^{i-1} (1 - \alpha_j)$$</p>

  <h3>特点</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">优势</th>

  <th style="text-align: left;">说明</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>照片级真实感</strong></td>

  <td style="text-align: left;">捕捉视相关效果（高光、反射）</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>实时渲染</strong></td>

  <td style="text-align: left;">≥30 FPS 在普通 GPU 上</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>显式表示</strong></td>

  <td style="text-align: left;">无需神经网络推理，直接光栅化</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>紧凑</strong></td>

  <td style="text-align: left;">场景压缩为几 MB ~ 几十 MB 的 <code>.spz</code> / <code>.ply</code> 文件</td>

  </tr>

  </tbody>

  </table>

  <h3>SPZ 格式</h3>

  <p><code>.spz</code> 格式是专门为 Gaussian Splatting 优化的压缩格式，将位置、协方差、颜色、SH 系数等数据压缩存储，便于网络传输。</p>

  <h3>参考</h3>

  <ul>

  <li>Kerbl et al. (2023). "3D Gaussian Splatting for Real-Time Radiance Field Rendering." <em>ACM Transactions on Graphics (SIGGRAPH 2023)</em>.</li>

  <li>gsplat.js: WebGL-based 3DGS viewer by Kevin Kwok.</li>

  </ul>'
ik-spider: "<h2>IK 蜘蛛 — CCD 逆运动学驱动</h2>\n<p>本 demo 用 <strong>CCD（Cyclic Coordinate Descent，循环坐标下降）</strong> 驱动 Spider Tank 的 6 条腿。模型来自 <code>assets/gallery/Spider tank.glb</code>（取其中的 <code>6legv2_ARM</code> 骨骼）。足端目标由三足步态生成，身体用 WASD 在平地上移动。打开 <strong>IK 链</strong> 可看到黄色折线（髋 → 膝 → 踝 → 足底）和橙色目标点，迭代次数越低，足底离目标越远。</p>\n<hr />\n<h3>逆运动学（IK）问题</h3>\n<p>已知开链骨骼：根关节 $\\mathbf{p}_0$（固定在机体上）与 $n-1$ 段定长连杆 $| \\mathbf{p}_{i+1}-\\mathbf{p}_i | = L_i$，求关节角使末端 $\\mathbf{p}_{n-1}$ 到达目标 $\\mathbf{t}$。</p>\n<p>与正运动学（FK）$\\mathbf{p}_i = f(\\theta_1,\\ldots,\\theta_{n-1})$ 相反，IK 一般<strong>无闭式解</strong>（$n&gt;2$ 时），需迭代数值法。</p>\n<p>本 demo 每条腿：$n=4$ 个关节（髋 → 膝 → 踝 → 足底），3 段骨长 $L_0,L_1,L_2$。前两段是模型骨骼的实际长度；足底是踝骨局部空间里的固定点，大约在踝关节正下方贴地，这样第三条骨骼负责把足底踩到目标上。</p>\n<hr />\n<h3>CCD 算法原理</h3>\n<p><strong>思想</strong>：从末端向根，逐个关节“转向”末端，使末端方向对准目标；再从前向后<strong>恢复骨长</strong>；重复直至收敛。</p>\n<p>对关节 $i$（$i = n-2,\\ldots,0$）：</p>\n<ol>\n<li>记枢轴 $\\mathbf{p}_i$，末端 $\\mathbf{p}_{n-1}$，目标 $\\mathbf{t}$。</li>\n<li>单位向量 $\\mathbf{u} = (\\mathbf{p}_{n-1}-\\\
  mathbf{p}_i)/|\\cdot|$，$\\mathbf{v} = (\\mathbf{t}-\\mathbf{p}_i)/|\\cdot|$。</li>\n<li>求最小旋转 $\\mathbf{R}$ 使 $\\mathbf{R}\\mathbf{u}=\\mathbf{v}$（轴角 / 四元数 <code>setFromUnitVectors</code>）。</li>\n<li>对 $j=i+1,\\ldots,n-1$：$\\mathbf{p}_j \\leftarrow \\mathbf{p}_i + \\mathbf{R}(\\mathbf{p}_j-\\mathbf{p}_i)$。</li>\n<li><strong>前向约束</strong>：固定 $\\mathbf{p}_0$，依次 $\\mathbf{p}_{i+1} = \\mathbf{p}_i + L_i \\cdot \\mathrm{normalize}(\\mathbf{p}_{i+1}-\\mathbf{p}_i)$。</li>\n</ol>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"k\">while</span><span class=\"w\"> </span><span class=\"n\">未收敛</span><span class=\"w\"> </span><span class=\"ow\">and</span><span class=\"w\"> </span><span class=\"n\">迭代</span><span class=\"w\"> </span><span class=\"o\">&lt;</span><span class=\"w\"> </span><span class=\"nl\">maxIter</span><span class=\"p\">:</span>\n<span class=\"w\">  </span><span class=\"k\">for</span><span class=\"w\"> </span><span class=\"n\">i</span><span class=\"w\"> </span><span\
  \ class=\"o\">=</span><span class=\"w\"> </span><span class=\"n\">n</span><span class=\"o\">-</span><span class=\"mi\">2</span><span class=\"w\"> </span><span class=\"p\">..</span><span class=\"w\"> </span><span class=\"mi\">0</span><span class=\"err\">:</span>\n<span class=\"w\">      </span><span class=\"n\">旋转关节</span><span class=\"w\"> </span><span class=\"n\">i</span><span class=\"err\">，</span><span class=\"n\">使末端指向目标</span>\n<span class=\"w\">  </span><span class=\"k\">for</span><span class=\"w\"> </span><span class=\"n\">i</span><span class=\"w\"> </span><span class=\"o\">=</span><span class=\"w\"> </span><span class=\"mi\">0</span><span class=\"w\"> </span><span class=\"p\">..</span><span class=\"w\"> </span><span class=\"n\">n</span><span class=\"o\">-</span><span class=\"mi\">2</span><span class=\"err\">:</span>\n<span class=\"w\">      </span><span class=\"n\">恢复骨长</span><span class=\"w\"> </span><span class=\"n\">L</span><span class=\"o\">[</span><span class=\"n\">i</span><span\
  \ class=\"o\">]</span>\n</code></pre></div>\n\n<p><strong>优点</strong>：实现简单、每关节 $O(n)$、无需雅可比矩阵；适合实时角色/机械臂。</p>\n<p><strong>缺点</strong>：可能陷入局部极小；长链或大角度弯曲时收敛慢。CCD 把每节当成<strong>球铰</strong>：<code>maxAngles[i]</code> 只限制单次迭代转角，多次迭代可以累加超过一圈；写回时若把这个旋转叠到当前四元数上，绕骨轴的扭转还会留在关节里，足部就能转满 360°。这不符合腿的机构约束。</p>\n<hr />\n<h3>与 FABRIK 的对比</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">方法</th>\n<th style=\"text-align: left;\">机制</th>\n<th style=\"text-align: left;\">特点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>CCD</strong></td>\n<td style=\"text-align: left;\">逐关节旋转，再拉直骨长</td>\n<td style=\"text-align: left;\">实现极简，本 demo 采用</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>FABRIK</strong></td>\n<td style=\"text-align: left;\">先向目标“伸手”，再向根“拉回”保持骨长</td>\n<td style=\"text-align: left;\">大弯曲更稳，无三角函数</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>雅可比转置 / IK</strong></td>\n<td style=\"text-align: left;\">$\\Delta\\theta = J^T (\\mathbf{t}-\\\
  mathbf{p}_{end})$</td>\n<td style=\"text-align: left;\">通用，需求导与步长控制</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3>本 demo 中的运动管线</h3>\n<div class=\"codehilite\"><pre><span></span><code>身体位姿 (位置 + yaw)\n    ↓\n三足步态 → 足底目标 t（一组摆动、一组钉在地上）\n    ↓\n读取当前骨骼世界坐标，CCD(关节, 骨长, t)\n    ↓\n把相邻关节的方向写回髋 / 膝 / 踝的局部旋转\n    ↓\n蒙皮网格跟随骨骼\n</code></pre></div>\n\n<p><strong>骨骼</strong>：每条腿三节，名称如 <code>ValveBiped.L_leg_front</code>、<code>…front1</code>、<code>…front2</code>（髋、膝、踝）。glTF 里同一套骨骼还有一份 <code>6legv3_ARM</code>，demo 只用 <code>6legv2_ARM</code>。</p>\n<p><strong>步态</strong>：6 条腿分成两组三足，</p>\n<ul>\n<li>A：左前、右中、左后</li>\n<li>B：右前、左中、右后</li>\n</ul>\n<p>移动或原地转向导致落足点偏离时，两组交替摆动。支撑相的足底保持世界坐标不动，由 IK 去够；摆动相沿平滑步从旧落点走到新落点，高度走一个正弦。站立且落足点已对齐时，不空踏。</p>\n<p><strong>写回骨骼</strong>：CCD 得到的是世界坐标，再按关节类型收成合法旋转。每帧从<strong>休息姿态冷启动</strong>再解，不从上帧已经限位过的残差接着迭代，避免突然跳到另一侧的错解。若新姿态相对上一帧转角过大，会先插值再贴上去。</p>\n<ul>\n<li><strong>髋</strong>：球铰，只允许相对休息方向做锥形摆动，绕股骨的扭转为 0。</li>\n<li><strong>膝</strong>：单轴铰链。轴是休息姿态里股骨 × 胫骨。可以再弯，也可以往伸直收，但不能反折。</li>\n\
  <li><strong>踝</strong>：单轴铰链，优先把脚掌对准地面（休息姿态已经是平的），而不是跟着足端目标一起歪。脚掌比踝关节正下方大一圈，踝一斜，边缘就会插进地里。</li>\n<li><strong>贴地</strong>：从蒙皮网格采脚底若干点。解完后若最低点低于地面，把目标抬高再解一两次。</li>\n</ul>\n<p><strong>步态</strong>：开始摆动时把相位小数清零，一步从抬脚开始，避免在周期中途突然切到另一组腿。</p>\n<p><strong>场景</strong>：起伏草地（多层正弦高度场）、石块与树桩。身体高度取机体下方与落足点的平均地面高；足端目标贴着当地高度，摆动时在两点之间插值再抬脚；踝关节沿地面法向放平。相机环绕，移动时注视点跟着机体。</p>\n<hr />\n<h3>操作说明</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">按键</th>\n<th style=\"text-align: left;\">功能</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>W A S D</strong></td>\n<td style=\"text-align: left;\">沿机头方向前后左右移动</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Q / E</strong></td>\n<td style=\"text-align: left;\">原地左转 / 右转</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>速度</strong></td>\n<td style=\"text-align: left;\">移动快慢（步频随之提高）</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>IK 迭代</strong></td>\n<td style=\"text-align: left;\">CCD 每帧循环次数（越大越贴目标）</td>\n\
  </tr>\n<tr>\n<td style=\"text-align: left;\"><strong>显示 IK 链</strong></td>\n<td style=\"text-align: left;\">黄线为骨骼，橙点为足底目标</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>重置位置</strong></td>\n<td style=\"text-align: left;\">回到场景中心，骨骼恢复休息姿态</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3>代码入口</h3>\n<p>求解器 <code>solveCCD(joints, boneLengths, target, iterations, maxAngles)</code> 在 <code>ik-spider.html</code> 脚本顶部，与上面的伪代码对应。步态和写回骨骼在同一个脚本的动画循环里。</p>\n<hr />\n<h3>参考</h3>\n<ul>\n<li>Wang, L.-C. T., &amp; Chen, C.-C. (1991). <em>A Combined Optimization Method for Solving the Inverse Kinematics Problem of Mechanical Manipulators.</em> IEEE Trans. RA.</li>\n<li>Aristidou, A., &amp; Lasenby, J. (2011). <em>FABRIK: A fast, iterative solver for the inverse kinematics problem.</em> Graphical Models.</li>\n<li>Bouaziz, S., et al. (2012). <em>Shape-Up</em> — 局部投影与全局线性步（另一套约束求解范式，可与 IK 对比）。</li>\n</ul>"
lbm-suiboku: "<h2>LBM 水墨动画</h2>\n<p>水墨画的视觉本质是<strong>墨水在水中的扩散与流动</strong>。本 demo 用 D2Q9 LBM 提供速度场，墨水浓度用<strong>标量场</strong>在平流-扩散方程下演化，模拟落笔、晕染与提笔后的静止晕开。</p>\n<hr />\n<h3>D2Q9 流体（速度场）</h3>\n<p>二维 D2Q9 在每个格点追踪 9 个方向的分布函数 $f_i$，宏观密度 $\\rho$ 和速度 $\\mathbf{u}$ 由矩求得：</p>\n<p>$$\\rho = \\sum_i f_i, \\quad \\rho\\mathbf{u} = \\sum_i \\mathbf{c}_i f_i$$</p>\n<p>采用 <strong>pull scheme</strong>（先沿格点拉取邻域分布，再 BGK 碰撞），边界用 bounce-back，比 collide-then-stream 更稳定：</p>\n<p>$$f_i^{\\text{eq}} = w_i\\rho\\left[1 + 3(\\mathbf{c}_i \\cdot \\mathbf{u}) + \\frac{9}{2}(\\mathbf{c}_i \\cdot \\mathbf{u})^2 - \\frac{3}{2}\\mathbf{u}^2\\right]$$</p>\n<p>每步后对速度场施加衰减，避免余流长期搅动墨水。</p>\n<hr />\n<h3>墨水标量场（浓度 $C$）</h3>\n<p>墨水<strong>不再</strong>用第二套 LBM 分布函数 $g_i$ 求解（见下方「问题记录」）。当前实现：</p>\n<p>$$\\frac{\\partial C}{\\partial t} + \\mathbf{u} \\cdot \\nabla C = D_{\\text{eff}} \\nabla^2 C$$</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">步骤</th>\n<th style=\"text-align: left;\">做法</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n\
  <td style=\"text-align: left;\"><strong>平流</strong></td>\n<td style=\"text-align: left;\">半拉格朗日回溯：$C(\\mathbf{x}) \\leftarrow C(\\mathbf{x} - \\mathbf{u}\\,\\Delta t)$，双线性插值</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>扩散</strong></td>\n<td style=\"text-align: left;\">五点拉普拉斯显式扩散，系数 $D_{\\text{eff}} = D \\cdot (0.35 + 0.65\\,C)$</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>注入</strong></td>\n<td style=\"text-align: left;\">鼠标落笔向 $C$ 直接加墨，并沿笔触方向给局部速度脉冲</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>渲染</strong></td>\n<td style=\"text-align: left;\">$t = \\bigl(1 - e^{-4.2C}\\bigr)^{0.78}$，灰度 $252 - 228t$，避免硬裁切为纯黑</td>\n</tr>\n</tbody>\n</table>\n<p><strong>提笔后</strong>：扩散系数降为落笔时的约 28%；流速接近零时跳过平流插值，减少数值耗散导致的「越晕越淡」。</p>\n<hr />\n<h3>控制参数</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">参数</th>\n<th style=\"text-align: left;\">效果</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>粘度</strong> ($\\tau$)</td>\n<td style=\"\
  text-align: left;\">流体弛豫时间；越大流速衰减越快、墨迹越「定」</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>扩散</strong> ($D$)</td>\n<td style=\"text-align: left;\">晕染速度；越小墨心保持越久</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>笔触强度</strong></td>\n<td style=\"text-align: left;\">单次落笔注入浓度与笔锋半径</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3>水墨效果</h3>\n<ul>\n<li><strong>笔触</strong>：拖拽落笔，墨迹随流体自然扩散</li>\n<li><strong>晕染 (Nijimi)</strong>：适当扩散 + 流体搅动 → 边缘晕开</li>\n<li><strong>叠加</strong>：多层墨迹在浓度上限 $C \\le 1$ 内叠加产生浓淡变化</li>\n</ul>\n<hr />\n<h3>问题记录（开发与调参）</h3>\n<h4>1. 提笔后墨团变黑块（原始 bug）</h4>\n<p><strong>现象</strong>：每次落笔再提笔，墨迹中心逐渐变成不自然的浓黑团块。</p>\n<p><strong>原因（多重叠加）</strong>：</p>\n<ol>\n<li><strong>主循环仅在 <code>drawing === true</code> 时步进</strong> — 提笔后模拟冻结，高浓度墨停在落笔点无法继续扩散，视觉上像「凝固的黑斑」。</li>\n<li><strong>墨水用 $g_i$ BGK 被动标量</strong> — 在浓墨、高梯度区域，$\\tau_g$ 接近稳定性下限时 BGK 易产生数值振荡与局部堆积。</li>\n<li><strong>注入过强</strong>（原 <code>×1.8</code>）+ <strong>线性渲染硬裁切</strong> — 浓度快速饱和后显示为纯黑。</li>\n<li><strong>边界 stream\
  \ 的 bounce-back</strong> — 边界格点反射分布，与上述问题叠加时局部浓度更易异常。</li>\n</ol>\n<p><strong>第一次修补（效果更差）</strong>：持续模拟 + <code>DYE_CAP</code> 钳制 + 减弱注入 + 柔和 tone mapping。黑块减轻，但整体偏淡、晕染不自然，用户反馈「好像更差了」。</p>\n<h4>2. 架构调整（当前方案）</h4>\n<p><strong>思路</strong>：流体仍用 LBM 求 $\\mathbf{u}$；墨水改为<strong>标量场 $C$</strong> + 半拉格朗日平流 + 显式扩散。</p>\n<ul>\n<li>去掉 $g_i$ 分布函数与 <code>clampDyeField</code> 等补丁逻辑</li>\n<li>每格 $C \\in [0,1]$ 硬上限，从物理量层面防止 blow-up</li>\n<li>pull-scheme 流体 + 速度衰减，落笔时沿笔触注入速度</li>\n</ul>\n<p><strong>结果</strong>：提笔后墨迹能自然晕开，黑块问题消除。</p>\n<h4>3. 墨迹偏淡</h4>\n<p><strong>调整</strong>：提高注入系数（<code>0.22 → 0.32</code>）、加强渲染对比（<code>exp(-d·2.8) → exp(-d·4.0)</code>）、默认笔触滑块略增。</p>\n<h4>4. 静置后淡化过快</h4>\n<p><strong>现象</strong>：停笔一段时间后，笔画整体变淡、墨心被冲散。</p>\n<p><strong>原因</strong>：拉普拉斯扩散使浓度从峰向周围摊薄；半拉格朗日插值在有余流时带来额外数值耗散；随机速度扰动延长搅动时间。</p>\n<p><strong>调整</strong>：</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">项</th>\n<th style=\"text-align: left;\">改动</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:\
  \ left;\">默认扩散</td>\n<td style=\"text-align: left;\"><code>diffK</code> 降低，滑块默认 5</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">提笔后</td>\n<td style=\"text-align: left;\">扩散 ×0.28</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">非线性扩散</td>\n<td style=\"text-align: left;\">$D_{\\text{eff}} \\propto (0.35 + 0.65C)$，浓墨区更抗扩散</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">低速跳过平流</td>\n<td style=\"text-align: left;\">$|\\mathbf{u}| &lt; 0.015$ 时不做回溯插值</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">速度衰减</td>\n<td style=\"text-align: left;\"><code>velDamp</code> 0.965 → 0.92，余流更快静止</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">渲染</td>\n<td style=\"text-align: left;\">低浓度 gamma 0.78，淡墨仍可见</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3>实现要点（<code>lbm-suiboku.html</code>）</h3>\n<div class=\"codehilite\"><pre><span></span><code>主循环 (!paused):\n  stepFluid()   // D2Q9 pull + 速度衰减\n  stepDye()     // 半拉格朗日 + 扩散（提笔后降扩散）\n  render()      // tone mapping 出图\n\n落笔:\n  inject() → C += 墨量,\
  \ ux/uy += 笔触方向脉冲\n</code></pre></div>\n\n<p>格点分辨率 <code>200×150</code>，与画布等比映射；模拟在 <code>requestAnimationFrame</code> 中每帧 1～2 子步。</p>\n<hr />\n<h3>参考</h3>\n<ul>\n<li>Chen &amp; Doolen (1998). \"Lattice Boltzmann method for fluid flows.\" <em>Annual Review of Fluid Mechanics</em>.</li>\n<li>Krüger et al. (2017). <em>The Lattice Boltzmann Method: Principles and Practice.</em> Springer.</li>\n<li>Stam (1999). \"Stable Fluids.\" <em>SIGGRAPH</em> — 半拉格朗日平流 + 扩散思路。</li>\n</ul>"
little-tokyo: '<h2>Draco 几何压缩</h2>

  <p>Draco 是 Google 开源的高效 3D 几何压缩库，专为网格和点云数据的传输与存储优化设计。它将模型文件体积压缩至 <strong>原来的 5%~20%</strong>，解码速度极快，是 Web 3D 应用的标准压缩方案。</p>

  <h3>核心原理</h3>

  <p>Draco 的核心思路是<strong>对网格数据进行量化和熵编码</strong>，而非简单的 zlib/gzip 字节流压缩——后者对浮点几何数据几乎没有效果。</p>

  <h4>1. 顶点位置量化（Position Quantization）</h4>

  <p>顶点坐标通常是 32 位浮点数（每顶点 12 字节）。Draco 首先计算模型的包围盒，然后将顶点归一化到包围盒内的整数网格：</p>

  <p>$$v_q = \left\lfloor \frac{v - v_{\min}}{v_{\max} - v_{\min}} \cdot (2^b - 1) + 0.5 \right\rfloor$$</p>

  <p>其中 $b$ 为量化位深（通常 8~14 位），$v_q$ 为整数坐标。</p>

  <blockquote>

  <p>这样每个顶点坐标从 96 位压缩到 $3b$ 位（如 b=10 即为 30 位），体积缩小 3~10 倍。</p>

  </blockquote>

  <p>解码时反量化恢复近似浮点位置：</p>

  <p>$$v'' = v_{\min} + \frac{v_q}{2^b - 1} \cdot (v_{\max} - v_{\min})$$</p>

  <h4>2. 边断裂器（Edgebreaker）连通性压缩</h4>

  <p>三角面片的顶点索引占用大量空间。Draco 使用 Edgebreaker 算法，将网格拓扑编码为 CLERS 符号序列：</p>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">符号</th>

  <th style="text-align: left;">含义</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>C</strong></td>

  <td style="text-align: left;">新顶点，创建三角形</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>L</strong></td>

  <td style="text-align: left;">左邻接，闭合左侧</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>R</strong></td>

  <td style="text-align: left;">右邻接，闭合右侧</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>E</strong></td>

  <td style="text-align: left;">边界</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>S</strong></td>

  <td style="text-align: left;">分裂，创建新边界</td>

  </tr>

  </tbody>

  </table>

  <p>每个三角形只需 1~2 位编码，远小于原始索引的 96 位/面。</p>

  <h4>3. 平行四边形预测（Parallelogram Prediction）</h4>

  <p>相邻顶点通常位于近似平行四边形顶点上。Draco 利用这一规律对量化后的顶点残差编码：</p>

  <p>$$\hat{v}<em>k = v</em>{k-1} + v_{k-2} - v_{k-3}$$</p>

  <p>仅存储预测残差 $\Delta = v_k - \hat{v}_k$，残差很小（通常 0~3），熵编码效率极高。</p>

  <h4>4. 熵编码（Entropy Coding）</h4>

  <p>量化后的整数序列和残差通过 <strong>rANS</strong>（范围非对称数字系统）进行熵编码。rANS 兼具算术编码的压缩率和 Huffman 编码的速度。</p>

  <h3>Draco 在 GLTF/GLB 中的应用</h3>

  <p>GLTF 2.0 规范原生支持 Draco 压缩扩展 <code>KHR_draco_mesh_compression</code>。压缩后的 GLB 文件中：</p>

  <ul>

  <li><strong>bufferView</strong> 指向压缩的 Draco 数据</li>

  <li><strong>extension</strong> 声明中记录量化参数</li>

  <li><strong>accessor</strong> 信息保留原始语义（位置/法线/UV）</li>

  </ul>

  <p>Three.js 中解码仅需一行：</p>

  <div class="codehilite"><pre><span></span><code><span class="kd">const</span><span class="w"> </span><span class="nx">dracoLoader</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="ow">new</span><span class="w"> </span><span class="nx">DRACOLoader</span><span class="p">();</span>

  <span class="nx">dracoLoader</span><span class="p">.</span><span class="nx">setDecoderPath</span><span class="p">(</span><span class="s1">&#39;/draco/&#39;</span><span class="p">);</span>

  <span class="nx">gltfLoader</span><span class="p">.</span><span class="nx">setDRACOLoader</span><span class="p">(</span><span class="nx">dracoLoader</span><span class="p">);</span>

  </code></pre></div>


  <h3>压缩效果参考</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">模型</th>

  <th style="text-align: left;">原始大小</th>

  <th style="text-align: left;">Draco 压缩后</th>

  <th style="text-align: left;">压缩率</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;">Littlest Tokyo</td>

  <td style="text-align: left;">~40 MB (OBJ)</td>

  <td style="text-align: left;"><strong>3.9 MB</strong> (GLB)</td>

  <td style="text-align: left;"><strong>10%</strong></td>

  </tr>

  <tr>

  <td style="text-align: left;">典型建筑场景</td>

  <td style="text-align: left;">25 MB</td>

  <td style="text-align: left;">2.5 MB</td>

  <td style="text-align: left;">10%</td>

  </tr>

  <tr>

  <td style="text-align: left;">角色模型</td>

  <td style="text-align: left;">8 MB</td>

  <td style="text-align: left;">1.2 MB</td>

  <td style="text-align: left;">15%</td>

  </tr>

  </tbody>

  </table>

  <h3>参考</h3>

  <ul>

  <li>Galligan et al. (2018). "Google Draco: 3D Data Compression." Google.</li>

  <li><code>KHR_draco_mesh_compression</code> GLTF Extension Specification.</li>

  <li>Edgebreaker: Rossignac (1999). "Edgebreaker: Connectivity compression for triangle meshes." <em>IEEE TVCG</em>.</li>

  </ul>'
neural-ot: '<h2>Neural Lagrangian OT 可视化</h2>

  <p>本 demo 展示 <strong>Neural Lagrangian Optimal Transport (NLOT)</strong> 的核心思想：用神经网络参数化的<strong>时变速度场</strong> $v_\theta(x,t)$ 驱动粒子（拉格朗日视角），将源分布 $\rho_0$ 连续推送到目标分布 $\rho_1$，而不是在网格上显式求解密度 PDE。</p>

  <blockquote>

  <p>页面动画为<strong>已收敛流的视觉示意</strong>（预定义粒子路径 + 近邻插值速度场），用于直观理解 NLOT 的流动形态，并非在浏览器内实时训练神经网络。</p>

  </blockquote>

  <hr />

  <h3>最优传输（OT）问题</h3>

  <p>给定源、目标概率密度 $\rho_0, \rho_1$，寻找代价最小的传输计划。Benamou–Brenier 动态表述将 OT 写成<strong>连续性方程 + 动能最小</strong>：</p>

  <p>$$\min_{(\rho, v)} \int_0^1 \int \frac{1}{2}|v(x,t)|^2 \,\rho(x,t)\, dx\, dt$$</p>

  <p>$$\text{s.t.}\quad \partial_t \rho + \nabla \cdot (\rho v) = 0, \quad \rho(\cdot,0)=\rho_0,\; \rho(\cdot,1)=\rho_1$$</p>

  <hr />

  <h3>Neural Lagrangian 视角</h3>

  <p>NLOT 用粒子流 $X_t^\theta$ 表示密度推进（push-forward）：</p>

  <p>$$\frac{d x_t}{dt} = v_\theta(x_t, t), \qquad \rho_t = (X_t^\theta)_{#}\rho_0$$</p>

  <p>训练目标通常包含<strong>动能正则</strong>、<strong>终点分布匹配</strong>与网络正则：</p>

  <p>$$\mathcal{E}(\theta) + \lambda\, D\bigl((X_1^\theta)_{#}\rho_0,\, \rho_1\bigr) + R(\theta)$$</p>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">项</th>

  <th style="text-align: left;">含义</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;">$\mathcal{E}(\theta)$</td>

  <td style="text-align: left;">路径动能 / 控制代价</td>

  </tr>

  <tr>

  <td style="text-align: left;">$D(\cdot,\cdot)$</td>

  <td style="text-align: left;">终点与 $\rho_1$ 的散度（Wasserstein、MMD 等）</td>

  </tr>

  <tr>

  <td style="text-align: left;">$R(\theta)$</td>

  <td style="text-align: left;">网络权重正则</td>

  </tr>

  </tbody>

  </table>

  <hr />

  <h3>页面元素</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">颜色</th>

  <th style="text-align: left;">含义</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;">绿色云</td>

  <td style="text-align: left;">源分布 $\rho_0$（左下高斯团）</td>

  </tr>

  <tr>

  <td style="text-align: left;">蓝色粒子</td>

  <td style="text-align: left;">当前时刻 $x_t$</td>

  </tr>

  <tr>

  <td style="text-align: left;">粉色云</td>

  <td style="text-align: left;">目标分布 $\rho_1$（可切换形状）</td>

  </tr>

  <tr>

  <td style="text-align: left;">黄色箭头</td>

  <td style="text-align: left;">由近邻粒子路径估计的 $v_\theta$ 示意</td>

  </tr>

  </tbody>

  </table>

  <p>左下角 HUD 显示 flow time $t$、动能、终点匹配误差与粒子数；右下角 Loss 曲线为示意，竖线对应当前 $t$。</p>

  <hr />

  <h3>交互</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">控件</th>

  <th style="text-align: left;">效果</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>暂停 / 播放</strong></td>

  <td style="text-align: left;">控制 $t \in [0,1]$ 循环</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>重新采样</strong></td>

  <td style="text-align: left;">按当前设置重抽粒子与弯曲路径</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>目标分布</strong></td>

  <td style="text-align: left;">三峰混合 / 圆环 / 双月形</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>粒子数</strong></td>

  <td style="text-align: left;">300–2400，影响密度云细腻度</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>流动时间</strong></td>

  <td style="text-align: left;">动画播放速度</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>轨迹 / 速度场 / Loss</strong></td>

  <td style="text-align: left;">开关叠加层</td>

  </tr>

  </tbody>

  </table>

  <p>切换目标分布可观察同一源高斯如何被<strong>连续时间流</strong>推送到不同几何形状——这正是 OT 流与 Eulerian 密度场方法在视觉上的主要区别。</p>

  <hr />

  <h3>与 Eulerian OT / CFM 的对比</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">方法</th>

  <th style="text-align: left;">存储</th>

  <th style="text-align: left;">特点</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>网格密度 PDE</strong></td>

  <td style="text-align: left;">$\rho(x,t)$ on grid</td>

  <td style="text-align: left;">易可视化密度，高维代价大</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>Neural Lagrangian OT</strong></td>

  <td style="text-align: left;">粒子 + $v_\theta$</td>

  <td style="text-align: left;">天然高维、与生成模型结合</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>Flow Matching / CFM</strong></td>

  <td style="text-align: left;">学习向量场</td>

  <td style="text-align: left;">类似思路，常固定直线路径或条件流</td>

  </tr>

  </tbody>

  </table>

  <hr />

  <h3>参考</h3>

  <ul>

  <li>Benamou &amp; Brenier (2000). "A computational fluid mechanics solution to the Monge–Kantorovich mass transfer problem." <em>Numerische Mathematik</em>.</li>

  <li>相关 Neural OT / Lagrangian OT 文献（粒子 push-forward + 神经速度场）。</li>

  </ul>'
sdf-raymarching: '<h2>SDF（有符号距离场）</h2>

  <p>SDF（Signed Distance Function / Signed Distance Field）是空间中每个点到最近表面的<strong>有符号距离</strong>：点在物体内部为负值，外部为正值，表面为零。</p>

  <p>$$f(\mathbf{p}) = d(\mathbf{p}, \text{surface}) \cdot \text{sign}(\text{inside})$$</p>

  <h3>基本图元</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">图元</th>

  <th style="text-align: left;">SDF 表达式</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>球体</strong></td>

  <td style="text-align: left;">$f(\mathbf{p}) = |\mathbf{p} - \mathbf{c}| - r$</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>立方体</strong></td>

  <td style="text-align: left;">$f(\mathbf{p}) = \max(|p_x|,\ |p_y|,\ |p_z|) - s$</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>平面</strong></td>

  <td style="text-align: left;">$f(\mathbf{p}) = \mathbf{p} \cdot \mathbf{n} - d$</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>圆环</strong></td>

  <td style="text-align: left;">$f(\mathbf{p}) = |(\sqrt{p_x^2 + p_z^2} - R,\ p_y)| - r$</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>圆柱</strong></td>

  <td style="text-align: left;">$f(\mathbf{p}) = |(p_x,\ p_z)| - r$（裁剪 y 后）</td>

  </tr>

  </tbody>

  </table>

  <h3>组合操作（CSG）</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">操作</th>

  <th style="text-align: left;">表达式</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>并集</strong></td>

  <td style="text-align: left;">$\min(f_1, f_2)$</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>交集</strong></td>

  <td style="text-align: left;">$\max(f_1, f_2)$</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>差集</strong></td>

  <td style="text-align: left;">$\max(f_1, -f_2)$</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>光滑混合</strong></td>

  <td style="text-align: left;">$\text{smin}(f_1, f_2, k)$</td>

  </tr>

  </tbody>

  </table>

  <p>光滑混合（Smooth Minimum）：</p>

  <p>$$\text{smin}(a, b, k) = -\log\left(e^{-k \cdot a} + e^{-k \cdot b}\right) \cdot \frac{1}{k}$$</p>

  <div class="codehilite"><pre><span></span><code><span class="kt">float</span><span class="w"> </span><span class="n">smin</span><span class="p">(</span><span class="kt">float</span><span class="w"> </span><span class="n">a</span><span class="p">,</span><span class="w"> </span><span class="kt">float</span><span class="w"> </span><span class="n">b</span><span class="p">,</span><span class="w"> </span><span class="kt">float</span><span class="w"> </span><span class="n">k</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>

  <span class="w">    </span><span class="kt">float</span><span class="w"> </span><span class="n">h</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">max</span><span class="p">(</span><span class="n">k</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">abs</span><span class="p">(</span><span class="n">a</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">b</span><span class="p">),</span><span class="w"> </span><span class="mf">0.0</span><span class="p">)</span><span class="w"> </span><span class="o">/</span><span class="w"> </span><span class="n">k</span><span class="p">;</span>

  <span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="n">min</span><span class="p">(</span><span class="n">a</span><span class="p">,</span><span class="w"> </span><span class="n">b</span><span class="p">)</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">h</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="n">h</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="n">k</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="mf">0.25</span><span class="p">;</span>

  <span class="p">}</span>

  </code></pre></div>


  <h3>形变</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">形变</th>

  <th style="text-align: left;">操作</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>平移</strong></td>

  <td style="text-align: left;">$f(\mathbf{p} - \mathbf{t})$</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>旋转</strong></td>

  <td style="text-align: left;">$f(R^{-1} \cdot \mathbf{p})$</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>缩放</strong></td>

  <td style="text-align: left;">$f(\mathbf{p} / s) \cdot s$</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>镜像</strong></td>

  <td style="text-align: left;">$f(\text{abs}(\mathbf{p}))$ — 在原点处镜像</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>重复/平铺</strong></td>

  <td style="text-align: left;">$f(\text{mod}(\mathbf{p}, c) - c/2)$ — 无限周期复制</td>

  </tr>

  </tbody>

  </table>

  <hr />

  <h2>Ray Marching（光线步进）</h2>

  <p>Ray Marching 是结合 SDF 的实时渲染方法。核心算法是 <strong>Sphere Tracing</strong>：</p>

  <h3>算法</h3>

  <div class="codehilite"><pre><span></span><code><span class="kt">vec3</span><span class="w"> </span><span class="n">rayMarch</span><span class="p">(</span><span class="kt">vec3</span><span class="w"> </span><span class="n">ro</span><span class="p">,</span><span class="w"> </span><span class="kt">vec3</span><span class="w"> </span><span class="n">rd</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>

  <span class="w">    </span><span class="kt">float</span><span class="w"> </span><span class="n">t</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mf">0.0</span><span class="p">;</span>

  <span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="p">(</span><span class="kt">int</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mo">0</span><span class="p">;</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">MAX_STEPS</span><span class="p">;</span><span class="w"> </span><span class="n">i</span><span class="o">++</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>

  <span class="w">        </span><span class="kt">vec3</span><span class="w"> </span><span class="n">p</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">ro</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">rd</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="n">t</span><span class="p">;</span><span class="w">       </span><span class="c1">// 当前采样点</span>

  <span class="w">        </span><span class="kt">float</span><span class="w"> </span><span class="n">d</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">sdfScene</span><span class="p">(</span><span class="n">p</span><span class="p">);</span><span class="w">       </span><span class="c1">// 到最近表面的距离</span>

  <span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">d</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">EPS</span><span class="p">)</span><span class="w"> </span><span class="k">break</span><span class="p">;</span><span class="w">          </span><span class="c1">// 击中表面</span>

  <span class="w">        </span><span class="n">t</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="n">d</span><span class="p">;</span><span class="w">                      </span><span class="c1">// 安全步进</span>

  <span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="p">(</span><span class="n">t</span><span class="w"> </span><span class="o">&gt;</span><span class="w"> </span><span class="n">FAR</span><span class="p">)</span><span class="w"> </span><span class="k">break</span><span class="p">;</span><span class="w">          </span><span class="c1">// 超出范围</span>

  <span class="w">    </span><span class="p">}</span>

  <span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="n">ro</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="n">rd</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="n">t</span><span class="p">;</span>

  <span class="p">}</span>

  </code></pre></div>


  <p><strong>关键洞察</strong>：SDF 给出的距离保证了以该距离为半径的球体内<strong>不会碰到任何表面</strong>，因此可以安全地一次前进 <code>d</code> 的距离。</p>

  <h3>法线计算</h3>

  <p>通过梯度近似：</p>

  <div class="codehilite"><pre><span></span><code><span class="kt">vec3</span><span class="w"> </span><span class="n">calcNormal</span><span class="p">(</span><span class="kt">vec3</span><span class="w"> </span><span class="n">p</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>

  <span class="w">    </span><span class="kt">float</span><span class="w"> </span><span class="n">h</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mf">0.001</span><span class="p">;</span>

  <span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="n">normalize</span><span class="p">(</span><span class="kt">vec3</span><span class="p">(</span>

  <span class="w">        </span><span class="n">sdfScene</span><span class="p">(</span><span class="n">p</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="kt">vec3</span><span class="p">(</span><span class="n">h</span><span class="p">,</span><span class="w"> </span><span class="mo">0</span><span class="p">,</span><span class="w"> </span><span class="mo">0</span><span class="p">))</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">sdfScene</span><span class="p">(</span><span class="n">p</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="kt">vec3</span><span class="p">(</span><span class="n">h</span><span class="p">,</span><span class="w"> </span><span class="mo">0</span><span class="p">,</span><span class="w"> </span><span class="mo">0</span><span class="p">)),</span>

  <span class="w">        </span><span class="n">sdfScene</span><span class="p">(</span><span class="n">p</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="kt">vec3</span><span class="p">(</span><span class="mo">0</span><span class="p">,</span><span class="w"> </span><span class="n">h</span><span class="p">,</span><span class="w"> </span><span class="mo">0</span><span class="p">))</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">sdfScene</span><span class="p">(</span><span class="n">p</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="kt">vec3</span><span class="p">(</span><span class="mo">0</span><span class="p">,</span><span class="w"> </span><span class="n">h</span><span class="p">,</span><span class="w"> </span><span class="mo">0</span><span class="p">)),</span>

  <span class="w">        </span><span class="n">sdfScene</span><span class="p">(</span><span class="n">p</span><span class="w"> </span><span class="o">+</span><span class="w"> </span><span class="kt">vec3</span><span class="p">(</span><span class="mo">0</span><span class="p">,</span><span class="w"> </span><span class="mo">0</span><span class="p">,</span><span class="w"> </span><span class="n">h</span><span class="p">))</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">sdfScene</span><span class="p">(</span><span class="n">p</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="kt">vec3</span><span class="p">(</span><span class="mo">0</span><span class="p">,</span><span class="w"> </span><span class="mo">0</span><span class="p">,</span><span class="w"> </span><span class="n">h</span><span class="p">))</span>

  <span class="w">    </span><span class="p">));</span>

  <span class="p">}</span>

  </code></pre></div>


  <h3>AO（环境光遮蔽）</h3>

  <p>在法线方向采样几步 SDF，距离越近越暗：</p>

  <p>$$AO = \frac{1}{n} \sum_{i=1}^{n} \max\left(0,\ \frac{\text{sdf}(p + N \cdot t_i) - t_i}{t_i}\right)$$</p>

  <h3>软阴影</h3>

  <p>从着色点向光源方向步进，检查是否有遮挡。遮挡物越近，阴影越暗：</p>

  <p>$$k = \min\left(1,\ 32 \cdot \frac{d_i}{t_i}\right)$$</p>

  <hr />

  <h2>Marching Cube（移动立方体）</h2>

  <p>Marching Cube 将 SDF（或其他标量场）转换为三角网格，用于离线渲染或 3D 打印。</p>

  <h3>算法流程</h3>

  <ol>

  <li>在三维网格的每个顶点求 SDF 值</li>

  <li>每条边上：若两端 SDF 异号，则该边与曲面相交</li>

  <li>根据 8 个顶点的正负组合查表，确定该体素内的三角形拓扑</li>

  <li>线性插值求交点的精确位置</li>

  </ol>

  <p>$$<br />

  \mathbf{p}_{\text{intersect}} = \mathbf{p}_1 + \frac{|f_1|}{|f_1| + |f_2|} (\mathbf{p}_2 - \mathbf{p}_1)<br />

  $$</p>

  <h3>配置表</h3>

  <p>8 个顶点，每个顶点两种状态（内/外），共 $2^8 = 256$ 种配置。利用对称性可简化为 <strong>15 种基本情形</strong>：</p>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">情形</th>

  <th style="text-align: left;">描述</th>

  <th style="text-align: left;">三角数</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;">0</td>

  <td style="text-align: left;">全部在内/外</td>

  <td style="text-align: left;">0</td>

  </tr>

  <tr>

  <td style="text-align: left;">1</td>

  <td style="text-align: left;">一个顶角不同</td>

  <td style="text-align: left;">1</td>

  </tr>

  <tr>

  <td style="text-align: left;">2</td>

  <td style="text-align: left;">两个相邻顶角</td>

  <td style="text-align: left;">2</td>

  </tr>

  <tr>

  <td style="text-align: left;">3</td>

  <td style="text-align: left;">对角/相邻三个</td>

  <td style="text-align: left;">2–3</td>

  </tr>

  <tr>

  <td style="text-align: left;">4</td>

  <td style="text-align: left;">四顶角切片</td>

  <td style="text-align: left;">2–4</td>

  </tr>

  </tbody>

  </table>

  <h3>应用</h3>

  <ul>

  <li>医学影像（CT/MRI）的三维重建</li>

  <li>SDF 网格生成（CSG → mesh）</li>

  <li>元球渲染（Metaball）</li>

  <li>地形等值面提取</li>

  </ul>

  <hr />

  <h2>MetaBall（元球）</h2>

  <p>MetaBall 是有机融合多个球体的技术：多个球体的<strong>势能函数叠加</strong>后取等值面。</p>

  <h3>势能函数</h3>

  <p>单个球的势能：</p>

  <p>$$f_i(\mathbf{p}) = \frac{1}{|\mathbf{p} - \mathbf{c}_i|^2}$$</p>

  <p>多个球的总势能：</p>

  <p>$$F(\mathbf{p}) = \sum_i f_i(\mathbf{p})$$</p>

  <p>取 $F(\mathbf{p}) = \text{threshold}$ 的等值面即可得到融合后的光滑曲面。</p>

  <h3>SDF 等效实现</h3>

  <div class="codehilite"><pre><span></span><code><span class="kt">float</span><span class="w"> </span><span class="n">sdMetaBall</span><span class="p">(</span><span class="kt">vec3</span><span class="w"> </span><span class="n">p</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>

  <span class="w">    </span><span class="kt">float</span><span class="w"> </span><span class="n">d</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mf">0.0</span><span class="p">;</span>

  <span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="p">(</span><span class="kt">int</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="mo">0</span><span class="p">;</span><span class="w"> </span><span class="n">i</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">BALL_COUNT</span><span class="p">;</span><span class="w"> </span><span class="n">i</span><span class="o">++</span><span class="p">)</span><span class="w"> </span><span class="p">{</span>

  <span class="w">        </span><span class="kt">float</span><span class="w"> </span><span class="n">dist</span><span class="w"> </span><span class="o">=</span><span class="w"> </span><span class="n">length</span><span class="p">(</span><span class="n">p</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">balls</span><span class="p">[</span><span class="n">i</span><span class="p">].</span><span class="n">center</span><span class="p">);</span>

  <span class="w">        </span><span class="n">d</span><span class="w"> </span><span class="o">+=</span><span class="w"> </span><span class="mf">1.0</span><span class="w"> </span><span class="o">/</span><span class="w"> </span><span class="p">(</span><span class="n">dist</span><span class="w"> </span><span class="o">*</span><span class="w"> </span><span class="n">dist</span><span class="p">);</span><span class="w">  </span><span class="c1">// 势能叠加</span>

  <span class="w">    </span><span class="p">}</span>

  <span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="mf">1.0</span><span class="w"> </span><span class="o">/</span><span class="w"> </span><span class="n">sqrt</span><span class="p">(</span><span class="n">d</span><span class="p">)</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">threshold</span><span class="p">;</span><span class="w">  </span><span class="c1">// 转回距离</span>

  <span class="p">}</span>

  </code></pre></div>


  <h3>特性对比</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">方法</th>

  <th style="text-align: left;">融合效果</th>

  <th style="text-align: left;">计算量</th>

  <th style="text-align: left;">用途</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>普通球体</strong></td>

  <td style="text-align: left;">无融合，硬边界</td>

  <td style="text-align: left;">O(n)</td>

  <td style="text-align: left;">刚性球体</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>MetaBall</strong></td>

  <td style="text-align: left;">自然融合，有机感</td>

  <td style="text-align: left;">O(n)</td>

  <td style="text-align: left;">流体、有机体</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>SDF Smooth Union</strong></td>

  <td style="text-align: left;">可控融合半径</td>

  <td style="text-align: left;">O(log n)</td>

  <td style="text-align: left;">CSG 建模</td>

  </tr>

  </tbody>

  </table>

  <h3>典型效果</h3>

  <p>多个球体靠近时会自动"拉丝"融合，远离时恢复独立球体形态——这正是 MetaBall 的经典视觉效果，广泛用于 2D/3D 的有机形态生成。</p>

  <hr />

  <h2>总结</h2>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">技术</th>

  <th style="text-align: left;">核心思想</th>

  <th style="text-align: left;">输出形式</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>SDF</strong></td>

  <td style="text-align: left;">空间各点到表面的距离</td>

  <td style="text-align: left;">隐式曲面</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>Ray Marching</strong></td>

  <td style="text-align: left;">沿 SDF 安全步进求交</td>

  <td style="text-align: left;">像素图像</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>Marching Cube</strong></td>

  <td style="text-align: left;">体素等值面提取</td>

  <td style="text-align: left;">三角网格</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>MetaBall</strong></td>

  <td style="text-align: left;">势能场叠加 + 等值面</td>

  <td style="text-align: left;">隐式曲面 → 图像或网格</td>

  </tr>

  </tbody>

  </table>'
simple-binpack: '<h2>三维装箱问题 — 3D Bin Packing</h2>

  <p>装箱问题（Bin Packing Problem）是组合优化中的经典 NP-hard 问题：将若干小物品放入容量有限的大容器中，使得容器数量最少或空间利用率最高。</p>

  <h3>三维装箱</h3>

  <p>三维装箱扩展了经典的一维/二维装箱：每个物品有长、宽、高三个维度，容器也有三维容量。</p>

  <p>$$<br />

  \text{目标：} \min \sum_{j} y_j \quad \text{s.t.} \quad <br />

  \begin{cases}<br />

  \text{每个物品恰好放入一个容器} \<br />

  \text{每个容器内物品不重叠} \<br />

  \text{物品方向可旋转}<br />

  \end{cases}<br />

  $$</p>

  <h3>贪心装箱（Greedy）</h3>

  <p>每次选择剩余物品中体积最大的，放到<strong>当前可用空间</strong>的最左下角位置：</p>

  <ul>

  <li>从原点 (0, 0, 0) 开始，按 X → Z → Y 轴顺序扫描可用位置</li>

  <li>物品放置后更新物品列表</li>

  <li>逐一放入，直至物品用完或容量耗尽</li>

  </ul>

  <p>贪心策略速度快但非最优，可能提前耗尽空间。</p>

  <h3>回溯装箱（Backtracking）</h3>

  <p>使用 DFS 回溯搜索满足容量约束的排布：</p>

  <ul>

  <li>递归放置每个物品，尝试所有可能位置</li>

  <li>若当前位置与已放置物品重叠或超出容量，回溯</li>

  <li>找到可行解即返回，未找到则报告不可行</li>

  </ul>

  <p>回溯能找到约束下的可行解，但最坏情况时间复杂度高。</p>

  <h3>关键特性</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">特性</th>

  <th style="text-align: left;">说明</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;">容器</td>

  <td style="text-align: left;">长×宽×高 = 10×8×8，总体积 640</td>

  </tr>

  <tr>

  <td style="text-align: left;">坐标系</td>

  <td style="text-align: left;">原点 O(0,0,0) 在左下角最内侧，X 向右、Y 向上、Z 由里向外</td>

  </tr>

  <tr>

  <td style="text-align: left;">旋转</td>

  <td style="text-align: left;">物品可绕任意轴旋转，自动检测可行朝向</td>

  </tr>

  <tr>

  <td style="text-align: left;">颜色编码</td>

  <td style="text-align: left;">红 / 蓝 / 黄循环着色，半透明显示便于观察重叠</td>

  </tr>

  </tbody>

  </table>

  <h3>参考</h3>

  <ul>

  <li>Coffman, E. G., Garey, M. R., &amp; Johnson, D. S. (1997). <em>Approximation algorithms for bin packing: A survey.</em></li>

  <li>Martello, S., &amp; Toth, P. (1990). <em>Knapsack Problems: Algorithms and Computer Implementations.</em></li>

  </ul>'
sph-water: "<h2>SPH / PBF 粒子水体</h2>\n<p>本 demo 对比两种主流的<strong>拉格朗日</strong>粒子流体求解器：<strong>SPH</strong>（力驱动）与 <strong>PBF</strong>（位置约束驱动）。可在工具栏切换求解器，粒子布局、交互与渲染保持一致。</p>\n<blockquote>\n<p>与 <a href=\"/gallery/water-2d.html\">2D 交互水面</a>（欧拉高度场）、<a href=\"/gallery/water-line.html\">2D 水线波动</a>（1D 波方程）互补：二者均在粒子位置直接演化，适合大变形与自由表面。</p>\n</blockquote>\n<hr />\n<h3>拉格朗日 vs 欧拉</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\"></th>\n<th style=\"text-align: left;\">拉格朗日（SPH / PBF）</th>\n<th style=\"text-align: left;\">欧拉（网格）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">追踪对象</td>\n<td style=\"text-align: left;\">粒子轨迹 $\\mathbf{x}_i(t)$</td>\n<td style=\"text-align: left;\">固定格点上的 $\\rho,\\mathbf{v}$</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">优势</td>\n<td style=\"text-align: left;\">大变形、无网格、自然自由面</td>\n<td style=\"text-align: left;\">求压 Poisson 成熟、规则域高效</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">代价</td>\n<td style=\"text-align: left;\">邻域搜索、需调参</td>\n\
  <td style=\"text-align: left;\">对流耗散、界面捕捉较难</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3>SPH：力驱动积分</h3>\n<p><strong>光滑粒子流体动力学（SPH）</strong> 通过核函数把粒子「抹平」成连续场，再求力积分。</p>\n<p>每步（5 个子步）：</p>\n<ol>\n<li><strong>邻域搜索</strong>（空间哈希）</li>\n<li><strong>密度</strong>（Poly6）：$\\rho_i = \\sum_j m_j W_{\\text{poly6}}$</li>\n<li><strong>压力</strong>（弱可压缩）：$P_i = k(\\rho_i - \\rho_0)$</li>\n<li><strong>力</strong>：Spiky 压力梯度 + 粘度 Laplacian + 重力</li>\n<li><strong>XSPH</strong> 速度平滑 + 欧拉积分</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">核</th>\n<th style=\"text-align: left;\">用途</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Poly6</strong></td>\n<td style=\"text-align: left;\">密度估计</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Spiky</strong></td>\n<td style=\"text-align: left;\">压力梯度</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Viscosity</strong></td>\n<td style=\"text-align: left;\">速度扩散</td>\n</tr>\n</tbody>\n</table>\n<p><strong>特点</strong>：物理直观，与文献公式一一对应；弱可压缩时需较小时间步，易出现密度震荡。</p>\n\
  <hr />\n<h3>PBF：位置约束投影</h3>\n<p><strong>Position Based Fluids（PBF）</strong>（Macklin &amp; Müller, 2013）不显式求压力力，而是：</p>\n<ol>\n<li><strong>预测位置</strong>：$\\mathbf{x}_i^* = \\mathbf{x}_i + \\mathbf{v}_i \\Delta t$（含重力与交互）</li>\n<li><strong>密度约束</strong>：$C_i = \\rho_i / \\rho_0 - 1$</li>\n<li><strong>拉格朗日乘子</strong>：<br />\n   $$ \\lambda_i = -\\frac{C_i}{\\sum_k |\\nabla W_{ik}|^2 + \\varepsilon} $$</li>\n<li><strong>位置修正</strong>（迭代 5 次）：<br />\n   $$ \\Delta \\mathbf{x}<em>i = \\frac{1}{\\rho_0}\\sum_j (\\lambda_i + \\lambda_j + s</em>{\\text{corr}})\\,\\nabla W_{ij} $$</li>\n<li><strong>速度更新</strong>：$\\mathbf{v}_i = (\\mathbf{x}_i' - \\mathbf{x}_i) / \\Delta t$，再 XSPH 粘度混合</li>\n</ol>\n<p>$s_{\\text{corr}}$ 为<strong>张力修正</strong>（tensile instability correction），减轻粒子成簇。</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">对比项</th>\n<th style=\"text-align: left;\">SPH</th>\n<th style=\"text-align: left;\">PBF</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"\
  >驱动量</td>\n<td style=\"text-align: left;\">力 $\\mathbf{F}$</td>\n<td style=\"text-align: left;\">约束 $C_i=0$</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">时间步</td>\n<td style=\"text-align: left;\">较小（$\\sim 5.5\\times10^{-4}$）</td>\n<td style=\"text-align: left;\">较大（$\\sim 3\\times10^{-3}$）</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">不可压缩性</td>\n<td style=\"text-align: left;\">依赖状态方程刚度 $k$</td>\n<td style=\"text-align: left;\">迭代投影，更稳</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">交互调参</td>\n<td style=\"text-align: left;\"><strong>压力</strong> $k$</td>\n<td style=\"text-align: left;\"><strong>刚度</strong>（乘子缩放）</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3>交互</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">操作</th>\n<th style=\"text-align: left;\">效果</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>求解器</strong></td>\n<td style=\"text-align: left;\">SPH ↔ PBF 切换（重置粒子）</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>拖拽</strong></td>\n\
  <td style=\"text-align: left;\">径向推动水体</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>点击（靠上）</strong></td>\n<td style=\"text-align: left;\">注入粒子</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>注水</strong></td>\n<td style=\"text-align: left;\">顶部落下一块水</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>粘度</strong></td>\n<td style=\"text-align: left;\">SPH 粘度核强度 / 二者 XSPH 混合</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>压力 / 刚度</strong></td>\n<td style=\"text-align: left;\">SPH 气体常数 $k$ / PBF 约束强度</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>重力</strong></td>\n<td style=\"text-align: left;\">向下加速度</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h3>实现要点</h3>\n<ul>\n<li>共享：Poly6 / Spiky 核、空间哈希、SoA 粒子数组（最多约 3500）</li>\n<li>SPH：5 子步力积分</li>\n<li>PBF：每帧 5 次约束投影 + 张力修正</li>\n<li>渲染：按密度着色 + <code>lighter</code> 混合</li>\n</ul>\n<hr />\n<h3>局限</h3>\n<ul>\n<li>2D 演示，非完整 3D 管道</li>\n<li>PBF 未实现 Macklin 原文的各向异性粘度与完整边界处理</li>\n<li>未含表面张力、多相流</li>\n</ul>\n\
  <hr />\n<h3>参考</h3>\n<ul>\n<li>Müller et al. (2003). \"Particle-Based Fluid Simulation for Interactive Applications.\" <em>SCA</em>.</li>\n<li>Macklin &amp; Müller (2013). \"Position Based Fluids.\" <em>ACM TOG / SIGGRAPH</em>.</li>\n<li>Monaghan (2005). \"Smoothed particle hydrodynamics.\" <em>Reports on Progress in Physics</em>.</li>\n</ul>"
water-2d: '<h2>2D 交互水面</h2>

  <p>本 demo 用<strong>二维波方程</strong>在规则网格上模拟水面高度场，支持鼠标/触摸制造涟漪，以及<strong>浮球与波面的双向耦合</strong>（浮力、坡度推力、反作用涟漪）。</p>

  <p>与 Gallery 中的 <a href="/gallery/WebGL%20Water.html">WebGL 水面焦散</a> 不同：这里是纯 Canvas 2D、俯视水面 + 法线着色，侧重<strong>快速交互</strong>与<strong>刚体-流体简化耦合</strong>，而非 3D 折射焦散。</p>

  <hr />

  <h3>波方程离散</h3>

  <p>将水面高度记为 $h(x,y,t)$。在均匀网格上用<strong> Verlet 型</strong>差分近似二维波动方程：</p>

  <p>$$h^{n+1}<em>{i,j} = \frac{h^n</em>{i-1,j}+h^n_{i+1,j}+h^n_{i,j-1}+h^n_{i,j+1}}{2} - h^{n-1}_{i,j}$$</p>

  <p>每步乘以阻尼 $\gamma \in (0,1)$ 模拟能量耗散。边界格点固定为 0（固壁）。</p>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">参数</th>

  <th style="text-align: left;">作用</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>波速</strong></td>

  <td style="text-align: left;">缩放 $\Delta t$ 等效步长，越大 ripple 传播越快</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>阻尼</strong></td>

  <td style="text-align: left;">$\gamma$ 越大，波纹消失越快</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>扰动</strong></td>

  <td style="text-align: left;">点击/拖拽注入的高斯 bump 强度</td>

  </tr>

  </tbody>

  </table>

  <hr />

  <h3>交互</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">操作</th>

  <th style="text-align: left;">效果</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>点击</strong></td>

  <td style="text-align: left;">局部抬高水面，产生圆形涟漪</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>拖拽</strong></td>

  <td style="text-align: left;">连续注入扰动，可推起波浪</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>点中浮球</strong></td>

  <td style="text-align: left;">给球初速度，并激起水花</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>雨滴</strong></td>

  <td style="text-align: left;">随机落点持续扰动</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>重置</strong></td>

  <td style="text-align: left;">清空高度场与球速度</td>

  </tr>

  </tbody>

  </table>

  <hr />

  <h3>浮球物理（简化）</h3>

  <p>每个浮球有归一化位置 $(x,y)$、速度 $(v_x,v_y)$ 与半径 $r$。每帧：</p>

  <ol>

  <li><strong>采样波面</strong>：在球下 disk 内平均高度 $\bar h$，估计浮力 $F_y \propto -\bar h$</li>

  <li><strong>坡度力</strong>：有限差分 $\partial h/\partial x,\partial h/\partial y$，球沿坡向加速</li>

  <li><strong>阻尼与池壁反弹</strong></li>

  <li><strong>反作用</strong>：球对局部 grid 施加负向 splash，模拟排开液体</li>

  </ol>

  <p>球在渲染时随局部 $h$ <strong>上下 bob</strong>，阴影与高光随位置变化。</p>

  <hr />

  <h3>渲染</h3>

  <p>由高度场梯度算法线 $\mathbf{n} \propto (-\partial h/\partial x,\,-\partial h/\partial y,\,1)$，再与固定方向光做点积得到漫反射 + 高光，得到类似浅水池的蓝色调。浮球用径向渐变绘制在波面之上。</p>

  <hr />

  <h3>局限</h3>

  <ul>

  <li>线性波方程，无破碎、飞溅真实流体</li>

  <li>浮球为 2D 简化模型，非刚体全耦合</li>

  <li>分辨率 $180\times135$，大扰动时可能有轻微数值反射</li>

  </ul>

  <hr />

  <h3>参考</h3>

  <ul>

  <li>Teschner et al. — 交互式水面高度场（游戏/实时图形常用套路）</li>

  <li>经典 Canvas「水波纹」双缓冲 Verlet 实现</li>

  </ul>'
water-euler: '<h2>欧拉网格流体</h2>

  <p>本 demo 在<strong>固定欧拉网格</strong>上求解 2D 不可压缩流体，采用 Stam (1999) <strong>Stable Fluids</strong> 框架：半拉格朗日平流 + 扩散 + <strong>压力投影</strong>（散度归零）。染料标量场随速度场运动，视觉上呈现水体流动。</p>

  <blockquote>

  <p>与 <a href="/gallery/sph-water.html">SPH / PBF 粒子水体</a>（拉格朗日粒子）相对：欧拉法在格点上存储 $\mathbf{u}$ 与染料 $d$，适合观察<strong>网格视角</strong>下的涡旋、回流与整体流动结构。</p>

  </blockquote>

  <hr />

  <h3>欧拉 vs 拉格朗日</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;"></th>

  <th style="text-align: left;">欧拉（本 demo）</th>

  <th style="text-align: left;">拉格朗日（SPH/PBF）</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;">离散对象</td>

  <td style="text-align: left;">固定格点 $(i,j)$</td>

  <td style="text-align: left;">移动粒子 $x_i$</td>

  </tr>

  <tr>

  <td style="text-align: left;">对流</td>

  <td style="text-align: left;">半拉格朗日回溯</td>

  <td style="text-align: left;">粒子携带量 / 核插值</td>

  </tr>

  <tr>

  <td style="text-align: left;">不可压缩</td>

  <td style="text-align: left;">Poisson 投影 $\nabla\cdot\mathbf{u}=0$</td>

  <td style="text-align: left;">压力力 / PBF 约束</td>

  </tr>

  <tr>

  <td style="text-align: left;">优势</td>

  <td style="text-align: left;">全局流动结构清晰、投影成熟</td>

  <td style="text-align: left;">大变形、无网格、自由面自然</td>

  </tr>

  <tr>

  <td style="text-align: left;">代价</td>

  <td style="text-align: left;">数值耗散、需足够网格</td>

  <td style="text-align: left;">邻域搜索、粒子噪声</td>

  </tr>

  </tbody>

  </table>

  <hr />

  <h3>Stable Fluids 每帧流程</h3>

  <p><strong>速度步</strong> <code>vel_step</code>：</p>

  <ol>

  <li>加外力（重力、鼠标搅动）→ $\mathbf{u}_0$</li>

  <li><strong>扩散</strong>（粘度，Jacobi 迭代）</li>

  <li><strong>投影</strong>：求 $p$ 使 $\nabla\cdot\mathbf{u}=0$，修正 $\mathbf{u} \leftarrow \mathbf{u} - \nabla p$</li>

  <li><strong>平流</strong>（半拉格朗日）：$\mathbf{u} \leftarrow \text{advect}(\mathbf{u}_0, \mathbf{u}_0)$</li>

  <li>再次 <strong>投影</strong></li>

  </ol>

  <p><strong>染料步</strong> <code>dens_step</code>：</p>

  <ol>

  <li>加源项（点击 / 注水）</li>

  <li>扩散</li>

  <li>用当前 $\mathbf{u}$ 平流染料 $d$</li>

  </ol>

  <p>边界：固壁反射（$u_\perp$ 翻转）。</p>

  <hr />

  <h3>压力投影（简述）</h3>

  <p>对中间速度场 $\mathbf{u}^*$，求压力 $p$ 满足：</p>

  <p>$$ \nabla^2 p = \nabla \cdot \mathbf{u}^* $$</p>

  <p>然后 $\mathbf{u} = \mathbf{u}^* - \nabla p$。实现上用 Jacobi 迭代近似解 Poisson 方程（与 Stam 原文一致）。</p>

  <hr />

  <h3>场变量</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">场</th>

  <th style="text-align: left;">含义</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;">$\mathbf{u}(i,j)$</td>

  <td style="text-align: left;">水平 / 竖直速度</td>

  </tr>

  <tr>

  <td style="text-align: left;">$d(i,j)$</td>

  <td style="text-align: left;">染料浓度（渲染为蓝色水体）</td>

  </tr>

  <tr>

  <td style="text-align: left;">$p$</td>

  <td style="text-align: left;">压力（每步临时，不显示）</td>

  </tr>

  </tbody>

  </table>

  <p>网格分辨率随画布自适应，约 $80\text{–}160 \times 60\text{–}120$。</p>

  <hr />

  <h3>交互</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">操作</th>

  <th style="text-align: left;">效果</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>拖拽</strong></td>

  <td style="text-align: left;">局部速度脉冲 + 染料 splat，搅动水流</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>点击</strong></td>

  <td style="text-align: left;">注入染料与轻微扰动</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>注水</strong></td>

  <td style="text-align: left;">顶部落下一块水体</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>粘度 / 扩散</strong></td>

  <td style="text-align: left;">速度场与染料平滑程度</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>力度</strong></td>

  <td style="text-align: left;">鼠标交互强度</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>速度场</strong></td>

  <td style="text-align: left;">叠加白色速度箭头</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>重置</strong></td>

  <td style="text-align: left;">底部水块初始状态</td>

  </tr>

  </tbody>

  </table>

  <hr />

  <h3>实现要点</h3>

  <ul>

  <li>纯 Canvas 2D，无 WebGL</li>

  <li>双缓冲交换（<code>u</code>/<code>u0</code>、<code>dens</code>/<code>dens0</code>）</li>

  <li>染料渲染：$1 - e^{-1.6d}$ tone mapping</li>

  <li>轻微向下「重力」源项使水体有下沉感</li>

  </ul>

  <hr />

  <h3>局限</h3>

  <ul>

  <li>2D、单相染料示踪，非真实自由面高度场</li>

  <li>Jacobi 迭代次数有限，强不可压缩场景有残余散度</li>

  <li>半拉格朗日带来数值耗散（涡旋会逐渐抹平）</li>

  </ul>

  <hr />

  <h3>参考</h3>

  <ul>

  <li>Stam (1999). "Stable Fluids." <em>SIGGRAPH</em>.</li>

  <li>Foster &amp; Metaxas (1996) — 早期网格流体动画。</li>

  </ul>'
water-line: '<h2>2D 水线波动</h2>

  <p>侧视视角的<strong>一维水面</strong>：静止时水线是一条水平直线；受到扰动后沿 $x$ 方向传播波动，并随阻尼逐渐恢复平静。</p>

  <p>与 <a href="/gallery/water-2d.html">2D 交互水面</a>（俯视高度场 + 浮球）互补：本 demo 强调<strong>水线即界面</strong>的极简视觉，适合理解 1D 波动方程与阻尼。</p>

  <hr />

  <h3>1D 波动方程</h3>

  <p>在 $N$ 个等距采样点 $h_i(t)$ 上离散<strong>弦/水面波动</strong>（Verlet 型）：</p>

  <p>$$h_i^{n+1} = \frac{h_{i-1}^n + h_{i+1}^n}{2} - h_i^{n-1}, \qquad h_i \leftarrow \gamma\, h_i$$</p>

  <p>两端 $h_0 = h_{N-1} = 0$ 固壁。$\gamma \in (0,1)$ 为<strong>阻尼</strong>，控制波纹衰减速度；波速系数控制每步传播快慢。</p>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">控件</th>

  <th style="text-align: left;">对应</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>波速</strong></td>

  <td style="text-align: left;">离散时间步 / 传播速度</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>阻尼</strong></td>

  <td style="text-align: left;">$\gamma$，越大越快恢复平静</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>力度</strong></td>

  <td style="text-align: left;">点击、拖拽、投石注入的脉冲幅度</td>

  </tr>

  </tbody>

  </table>

  <hr />

  <h3>视觉</h3>

  <ul>

  <li><strong>天空</strong>：水线上方渐变</li>

  <li><strong>水体</strong>：水线以下填充深色渐变（仅示意深度）</li>

  <li><strong>水线</strong>：$y = y_0 - h_i \cdot s$，平静时 $h_i \approx 0$ → 一条直线</li>

  <li><strong>高光</strong>：水线描边 + 轻微 glow</li>

  </ul>

  <hr />

  <h3>物理交互</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">操作</th>

  <th style="text-align: left;">效果</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>点击</strong></td>

  <td style="text-align: left;">局部抬高/压低 $h_i$，激起对称涟漪</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>拖拽</strong></td>

  <td style="text-align: left;">连续注入脉冲，形成行波</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>投石</strong></td>

  <td style="text-align: left;">随机位置大脉冲 + 宽波包</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>小黄鸭</strong></td>

  <td style="text-align: left;">随局部 $h$ 与 $\partial h/\partial x$ 起伏、漂移；对水面反作用</td>

  </tr>

  </tbody>

  </table>

  <p>点击鸭子附近可推它移动，并同时扰动水线。</p>

  <hr />

  <h3>与 2D 高度场的区别</h3>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;"></th>

  <th style="text-align: left;">水线 (本 demo)</th>

  <th style="text-align: left;">交互水面 (water-2d)</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;">维度</td>

  <td style="text-align: left;">1D $h(x)$</td>

  <td style="text-align: left;">2D $h(x,y)$</td>

  </tr>

  <tr>

  <td style="text-align: left;">视角</td>

  <td style="text-align: left;">侧视，界面即曲线</td>

  <td style="text-align: left;">俯视，法线着色</td>

  </tr>

  <tr>

  <td style="text-align: left;">静止态</td>

  <td style="text-align: left;">一条直线</td>

  <td style="text-align: left;">平面池面</td>

  </tr>

  <tr>

  <td style="text-align: left;">典型用途</td>

  <td style="text-align: left;">湖泊侧视、2D 游戏水面条</td>

  <td style="text-align: left;">点击涟漪池</td>

  </tr>

  </tbody>

  </table>

  <hr />

  <h3>局限</h3>

  <ul>

  <li>线性 1D 波，无飞溅、无非线性陡波</li>

  <li>鸭子为装饰性简化耦合，非刚体浮力全模型</li>

  </ul>'
wfc: '<p>本文从一个每个人都见过的约束满足问题——<strong>数独</strong>出发，引出波函数塌缩（Wave Function Collapse, WFC）算法的核心思想，再将其推广到图像生成与程序化内容创建。</p>

  <hr />

  <h2>1. 从数独说起</h2>

  <h3>1.1 数独是什么</h3>

  <p>一个 $9 \times 9$ 的网格，部分格子已填入 1-9 的数字，要求在空格中填入数字，使得<strong>每行、每列、每个 $3 \times 3$ 宫格</strong>都恰好包含 1-9 各一次。</p>

  <p>这不是一个数学问题，而是一个<strong>约束满足问题（Constraint Satisfaction Problem, CSP）</strong>。</p>

  <h3>1.2 用计算机解数独</h3>

  <p>最朴素的解法是穷举：每个空格试 1-9，遇到矛盾就回溯。但一个数独有 81 个格子，穷举的复杂度是 $9^{81}$，显然不现实。</p>

  <p>聪明一点的解法利用了<strong>约束传播</strong>：</p>

  <blockquote>

  <p>当我们确定某个格子是 5 之后，与它在同一行、同一列、同一宫格的所有格子就<strong>不可能</strong>是 5 了——这就是"约束传播"。</p>

  </blockquote>

  <p>更进一步：我们应该<strong>优先填那些可能性最少的格子</strong>。如果一个格子只剩 1 种可能，那它就是确定的，应该立刻填上；如果另一个格子还有 8 种可能，就先放一放。</p>

  <p>这就是<strong>"最小剩余值"（Minimum Remaining Values, MRV）</strong>启发式——优先处理约束最强的变量。</p>

  <h3>1.3 数独求解算法</h3>

  <div class="codehilite"><pre><span></span><code><span class="k">function</span><span class="w"> </span><span class="nf">SolveSudoku</span><span class="p">(</span>grid<span class="p">):</span>

  <span class="w">    </span><span class="o">//</span><span class="w"> </span>初始化：每个空格的可能性为<span class="w"> </span><span class="p">{</span><span class="mi">1</span><span class="p">,</span><span class="mi">2</span><span class="p">,</span><span class="k">...</span><span class="c">,9}</span>

  <span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">each</span><span class="w"> </span><span class="nb">empty</span><span class="w"> </span><span class="nb">cell</span><span class="p">:</span>

  <span class="w">        </span><span class="nb">cell</span><span class="p">.</span><span class="n">possibilities</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="p">{</span><span class="mi">1</span><span class="p">,</span><span class="w"> </span><span class="mi">2</span><span class="p">,</span><span class="w"> </span><span class="k">...</span><span class="c">, 9}</span>


  <span class="w">    </span><span class="o">//</span><span class="w"> </span>约束传播：根据已知数字削减可能性

  <span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">each</span><span class="w"> </span><span class="n">given</span><span class="w"> </span><span class="n">number</span><span class="w"> </span><span class="n">in</span><span class="w"> </span><span class="nb">grid</span><span class="p">:</span>

  <span class="w">        </span><span class="n">Propagate</span><span class="p">(</span><span class="n">given</span><span class="p">.</span><span class="n">cell</span><span class="p">,</span><span class="w"> </span><span class="nb">grid</span><span class="p">)</span>


  <span class="w">    </span><span class="o">//</span><span class="w"> </span>主循环

  <span class="w">    </span><span class="k">while</span><span class="w"> </span>存在未确定的格子<span class="p">:</span>

  <span class="w">        </span><span class="o">//</span><span class="w"> </span>选择可能性最少的格子

  <span class="w">        </span><span class="nb">cell</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="n">FindMinPossibilitiesCell</span><span class="p">(</span><span class="nb">grid</span><span class="p">)</span>


  <span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="nb">cell</span><span class="p">.</span><span class="n">possibilities</span><span class="w"> </span>为空<span class="p">:</span>

  <span class="w">            </span><span class="k">return</span><span class="w"> </span><span class="n">FAILURE</span><span class="w">  </span><span class="o">//</span><span class="w"> </span>矛盾！需要回溯或重启


  <span class="w">        </span><span class="o">//</span><span class="w"> </span><span class="s">&quot;塌缩&quot;</span>：随机选一个可能值

  <span class="w">        </span><span class="n">chosen</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="n">RandomPick</span><span class="p">(</span><span class="nb">cell</span><span class="p">.</span><span class="n">possibilities</span><span class="p">)</span>

  <span class="w">        </span><span class="nb">cell</span><span class="p">.</span><span class="n">value</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="n">chosen</span>

  <span class="w">        </span><span class="nb">cell</span><span class="p">.</span><span class="n">possibilities</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="p">{</span><span class="n">chosen</span><span class="p">}</span>


  <span class="w">        </span><span class="o">//</span><span class="w"> </span>约束传播：更新同行<span class="o">/</span>列<span class="o">/</span>宫的格子

  <span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">NOT</span><span class="w"> </span><span class="n">Propagate</span><span class="p">(</span><span class="nb">cell</span><span class="p">,</span><span class="w"> </span><span class="nb">grid</span><span class="p">):</span>

  <span class="w">            </span><span class="k">return</span><span class="w"> </span><span class="n">FAILURE</span>


  <span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="nb">grid</span><span class="w">  </span><span class="o">//</span><span class="w"> </span>成功！


  <span class="k">function</span><span class="w"> </span><span class="nf">Propagate</span><span class="p">(</span>cell, grid<span class="p">):</span>

  <span class="w">    </span><span class="o">//</span><span class="w"> </span>从同行、同列、同宫格的其他格子中

  <span class="w">    </span><span class="o">//</span><span class="w"> </span>移除<span class="w"> </span><span class="nb">cell</span><span class="p">.</span><span class="n">value</span><span class="w"> </span>这个可能性

  <span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">each</span><span class="w"> </span><span class="n">related</span><span class="w"> </span><span class="nb">cell</span><span class="w"> </span><span class="p">(</span>同行<span class="o">/</span>同列<span class="o">/</span>同宫<span class="p">):</span>

  <span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="nb">cell</span><span class="p">.</span><span class="n">value</span><span class="w"> </span><span class="n">in</span><span class="w"> </span><span class="n">related</span><span class="p">.</span><span class="n">possibilities</span><span class="p">:</span>

  <span class="w">            </span><span class="n">related</span><span class="p">.</span><span class="n">possibilities</span><span class="w"> </span><span class="o">-</span><span class="p">=</span><span class="w"> </span><span class="nb">cell</span><span class="p">.</span><span class="n">value</span>

  <span class="w">            </span><span class="k">if</span><span class="w"> </span><span class="n">related</span><span class="p">.</span><span class="n">possibilities</span><span class="w"> </span>为空<span class="p">:</span>

  <span class="w">                </span><span class="k">return</span><span class="w"> </span><span class="nb">false</span><span class="w">  </span><span class="o">//</span><span class="w"> </span>矛盾！

  <span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="nb">true</span>

  </code></pre></div>


  <h3>1.4 数独中已经包含了 WFC 的全部要素</h3>

  <p>仔细看上面的算法，它包含了三个核心步骤：</p>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">步骤</th>

  <th style="text-align: left;">数独中的含义</th>

  <th style="text-align: left;">WFC 中的对应</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>初始化</strong></td>

  <td style="text-align: left;">每个空格可以是 1-9 中的任何一个</td>

  <td style="text-align: left;">每个格子可以是任何一个 tile</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>塌缩</strong></td>

  <td style="text-align: left;">选择可能性最少的格子，填入一个数字</td>

  <td style="text-align: left;">选择熵最低的格子，放上一个 tile</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>约束传播</strong></td>

  <td style="text-align: left;">同行/列/宫的格子不能再填这个数字</td>

  <td style="text-align: left;">相邻格子的允许 tile 被削减</td>

  </tr>

  </tbody>

  </table>

  <p><strong>WFC 本质上就是"数独的泛化"</strong>——把数独的"行/列/宫约束"替换为"相邻 tile 的匹配约束"，把"数字 1-9"替换为"图像小块（tiles）"，就得到了 WFC。</p>

  <hr />

  <h2>2. WFC：从数独到图像生成</h2>

  <h3>2.1 从数字到图像</h3>

  <p>数独中每个格子填的是一个<strong>数字</strong>，相邻格子的约束是"不能重复"。</p>

  <p>WFC 中每个格子放的是一个<strong>图像小块（tile）</strong>，相邻格子的约束是"<strong>边缘像素必须匹配</strong>"。</p>

  <p>$$\boxed{\text{数独：格子} \to \text{数字，约束} \to \text{不重复}} \xrightarrow{\text{泛化}} \boxed{\text{WFC：格子} \to \text{tile，约束} \to \text{边缘匹配}}$$</p>

  <h3>2.2 量子力学的类比</h3>

  <p>WFC 的命名来源于量子力学的类比：</p>

  <ul>

  <li><strong>"波函数"</strong>：每个格子处于所有可能 tile 的<strong>叠加态</strong>（就像薛定谔的猫"既是活的又是死的"）</li>

  <li><strong>"观测/塌缩"</strong>：选择一个格子，将其固定为某个确定 tile（就像"打开盒子观测猫"）</li>

  <li><strong>"约束传播"</strong>：一次塌缩会影响相邻格子的可能性，像波纹一样扩散</li>

  </ul>

  <p>这个类比虽然形象，但本质上是<strong>约束满足 + 启发式搜索</strong>——和数独求解的数学本质完全一样。</p>

  <h3>2.3 核心思想</h3>

  <blockquote>

  <p><strong>从小的样本图像生成更大的图像，保证局部连续性。</strong></p>

  </blockquote>

  <p>与数独不同的是：数独的约束规则是人为规定的（行/列/宫不重复），而 WFC 的约束规则是<strong>从样本图像中自动提取的</strong>。</p>

  <hr />

  <h2>3. WFC 的完整流程</h2>

  <h3>3.1 样例展示</h3>

  <p>样本图：</p>

  <p><img alt="circuit" src="https://lgximgs.oss-cn-beijing.aliyuncs.com/images/circuit.png" /></p>

  <p>生成结果：</p>

  <p><img alt="circuit_9_9" src="https://lgximgs.oss-cn-beijing.aliyuncs.com/images/circuit_9_9.png" /></p>

  <p>样本图 2：</p>

  <p><img alt="greek" src="https://lgximgs.oss-cn-beijing.aliyuncs.com/images/greek.png" /></p>

  <p>生成结果：</p>

  <p><img alt="greek_9_9" src="https://lgximgs.oss-cn-beijing.aliyuncs.com/images/greek_9_9.png" /></p>

  <h3>3.2 步骤一：图片切分</h3>

  <p>将输入图像切分成 $N \times N$ 个小块（tiles），作为基本单元。</p>

  <div class="codehilite"><pre><span></span><code><span class="n">imgList</span><span class="p">{</span><span class="n">N</span><span class="o">*</span><span class="n">N</span><span class="p">}</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="p">[];</span>

  <span class="n">pixNum</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="nb">size</span><span class="p">(</span><span class="n">img</span><span class="p">,</span><span class="w"> </span><span class="mi">1</span><span class="p">)</span><span class="w"> </span><span class="o">/</span><span class="w"> </span><span class="n">N</span><span class="p">;</span>

  <span class="k">for</span><span class="w"> </span><span class="nb">i</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="mi">1</span><span class="p">:</span><span class="n">N</span>

  <span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="nb">j</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="mi">1</span><span class="p">:</span><span class="n">N</span>

  <span class="w">        </span><span class="n">imgList</span><span class="p">{</span><span class="nb">sub2ind</span><span class="p">([</span><span class="n">N</span><span class="p">,</span><span class="n">N</span><span class="p">],</span><span class="nb">i</span><span class="p">,</span><span class="nb">j</span><span class="p">)}</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="k">...</span>

  <span class="w">            </span><span class="n">img</span><span class="p">(((</span><span class="nb">i</span><span class="o">-</span><span class="mi">1</span><span class="p">)</span><span class="o">*</span><span class="n">pixNum</span><span class="o">+</span><span class="mi">1</span><span class="p">):(</span><span class="nb">i</span><span class="o">*</span><span class="n">pixNum</span><span class="p">),</span><span class="w"> </span><span class="k">...</span>

  <span class="w">                </span><span class="p">((</span><span class="nb">j</span><span class="o">-</span><span class="mi">1</span><span class="p">)</span><span class="o">*</span><span class="n">pixNum</span><span class="o">+</span><span class="mi">1</span><span class="p">):(</span><span class="nb">j</span><span class="o">*</span><span class="n">pixNum</span><span class="p">),</span><span class="w"> </span><span class="p">:);</span>

  <span class="w">    </span><span class="k">end</span>

  <span class="k">end</span>

  </code></pre></div>


  <p>每个 tile 被赋予一个<strong>权重</strong>（通常就是它在样本中出现的频率）。权重越高，该 tile 在随机选择时被选中的概率越大。</p>

  <blockquote>

  <p><strong>类比数独</strong>：这一步相当于确定"每个格子可以填哪些数字"——在数独中是 ${1, 2, \ldots, 9}$，在 WFC 中是 ${\text{tile}<em>1, \text{tile}_2, \ldots, \text{tile}</em>{N^2}}$。</p>

  </blockquote>

  <h3>3.3 步骤二：构建邻接表（Adjacency Rules）</h3>

  <p>计算哪些 tile 可以在上下左右四个方向相邻。这是 WFC 的<strong>核心数据</strong>——相当于数独中"同行/列/宫不能重复"的规则。</p>

  <p><strong>判定标准</strong>：使用<strong>边缘像素的均方根误差（RMSE）</strong>：</p>

  <p>$$\text{RMSE} = \sqrt{\frac{1}{k} \sum_{i=1}^{k} (p_i^{\text{left}} - p_i^{\text{right}})^2}$$</p>

  <p>其中 $k$ 是边缘像素数量。RMSE &lt; 阈值（如 40）则认为可以连接。</p>

  <div class="codehilite"><pre><span></span><code><span class="k">for</span><span class="w"> </span><span class="nb">i</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="mi">1</span><span class="p">:</span><span class="n">N</span><span class="o">*</span><span class="n">N</span>

  <span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="nb">j</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="mi">1</span><span class="p">:</span><span class="n">N</span><span class="o">*</span><span class="n">N</span>

  <span class="w">        </span><span class="c">% 检测右连接：i 的右边缘 vs j 的左边缘</span>

  <span class="w">        </span><span class="n">rErr</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="nb">sqrt</span><span class="p">(</span><span class="nb">mean</span><span class="p">((</span><span class="n">rImgC</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">rImgS</span><span class="p">)</span><span class="o">.^</span><span class="mi">2</span><span class="p">));</span>

  <span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">rErr</span><span class="w"> </span><span class="o">&lt;</span><span class="w"> </span><span class="n">err</span>

  <span class="w">            </span><span class="n">adjList</span><span class="p">(</span><span class="nb">i</span><span class="p">).</span><span class="n">right</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="p">[</span><span class="n">adjList</span><span class="p">(</span><span class="nb">i</span><span class="p">).</span><span class="n">right</span><span class="p">,</span><span class="w"> </span><span class="nb">j</span><span class="p">];</span>

  <span class="w">        </span><span class="k">end</span>

  <span class="w">        </span><span class="c">% 类似地检测左、上、下连接...</span>

  <span class="w">    </span><span class="k">end</span>

  <span class="k">end</span>

  </code></pre></div>


  <p><strong>结果</strong>：每条规则形如 "tile $i$ 的右边可以接 tile $j$"，存储在邻接表中。</p>

  <blockquote>

  <p><strong>类比数独</strong>：邻接表相当于数独的约束规则——数独中"同行不能有相同数字"是一种约束，WFC 中"tile $i$ 的右边必须能接 tile $j$"也是一种约束。区别在于数独的约束是人为规定的，WFC 的约束是从样本中<strong>自动学习</strong>的。</p>

  </blockquote>

  <h3>3.4 步骤三：波函数塌缩生成</h3>

  <p>这是 WFC 算法的核心——与数独的 MRV 启发式完全一致：<strong>优先处理可能性最少的格子</strong>。</p>

  <h4>初始化</h4>

  <p>创建一个 $R \times C$ 的网格，每个格子初始状态为<strong>所有 tile 的叠加态</strong>：</p>

  <p>$$\text{cell}(i,j).\text{possibilities} = {1, 2, \ldots, N^2}$$</p>

  <h4>主循环</h4>

  <div class="codehilite"><pre><span></span><code><span class="k">function</span><span class="w"> </span><span class="nf">WFC</span><span class="p">(</span>rows, cols, adjList, weights<span class="p">):</span>

  <span class="w">    </span><span class="o">//</span><span class="w"> </span>初始化：每个格子可以是任何<span class="w"> </span><span class="n">tile</span>

  <span class="w">    </span><span class="nb">grid</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="n">Grid</span><span class="p">(</span><span class="n">rows</span><span class="p">,</span><span class="w"> </span><span class="n">cols</span><span class="p">)</span>

  <span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="n">each</span><span class="w"> </span><span class="nb">cell</span><span class="w"> </span><span class="n">in</span><span class="w"> </span><span class="nb">grid</span><span class="p">:</span>

  <span class="w">        </span><span class="nb">cell</span><span class="p">.</span><span class="n">possibilities</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="p">{</span><span class="n">ALL_TILES</span><span class="p">}</span>


  <span class="w">    </span><span class="k">while</span><span class="w"> </span>存在未塌缩的格子<span class="p">:</span>

  <span class="w">        </span><span class="o">//</span><span class="w"> </span><span class="mf">1.</span><span class="w"> </span>选择熵最低的未塌缩格子（类比数独的<span class="w"> </span><span class="n">MRV</span>）

  <span class="w">        </span><span class="nb">cell</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="n">FindLowestEntropyCell</span><span class="p">(</span><span class="nb">grid</span><span class="p">)</span>


  <span class="w">        </span><span class="o">//</span><span class="w"> </span><span class="mf">2.</span><span class="w"> </span>塌缩：根据权重随机选择一个<span class="w"> </span><span class="n">tile</span>

  <span class="w">        </span><span class="n">chosen</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="n">WeightedRandom</span><span class="p">(</span><span class="nb">cell</span><span class="p">.</span><span class="n">possibilities</span><span class="p">,</span><span class="w"> </span><span class="n">weights</span><span class="p">)</span>

  <span class="w">        </span><span class="nb">cell</span><span class="p">.</span><span class="n">possibilities</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="p">{</span><span class="n">chosen</span><span class="p">}</span><span class="w">  </span><span class="o">//</span><span class="w"> </span>塌缩为单态


  <span class="w">        </span><span class="o">//</span><span class="w"> </span><span class="mf">3.</span><span class="w"> </span>约束传播（类比数独中更新同行<span class="o">/</span>列<span class="o">/</span>宫）

  <span class="w">        </span><span class="k">if</span><span class="w"> </span><span class="n">NOT</span><span class="w"> </span><span class="n">Propagate</span><span class="p">(</span><span class="nb">cell</span><span class="p">,</span><span class="w"> </span><span class="nb">grid</span><span class="p">,</span><span class="w"> </span><span class="n">adjList</span><span class="p">):</span>

  <span class="w">            </span><span class="k">return</span><span class="w"> </span><span class="n">FAILURE</span><span class="w">  </span><span class="o">//</span><span class="w"> </span>矛盾！某格子可能性清零


  <span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="nb">grid</span><span class="w">  </span><span class="o">//</span><span class="w"> </span>成功！

  </code></pre></div>


  <h4>熵的计算</h4>

  <p>WFC 使用<strong>加权香农熵</strong>来选择塌缩顺序：</p>

  <p>$$H = \log\left(\sum_{i} w_i\right) - \frac{\sum_{i} w_i \log w_i}{\sum_{i} w_i}$$</p>

  <p>其中 $w_i$ 是 tile $i$ 的权重（频率），求和遍历该格子当前所有可能 tile。</p>

  <p><strong>为什么选熵最低的格子？</strong> 熵最低意味着可能性最少，约束最强。优先塌缩最受限的格子可以<strong>尽早发现矛盾</strong>——这和数独中"先填只剩 1 种可能的格子"是完全一样的策略。</p>

  <p>为避免熵相同的格子产生随机性，实际中通常加一个微小的随机扰动：$H'' = H + \epsilon \cdot \text{random}()$。</p>

  <h4>约束传播（Constraint Propagation）</h4>

  <p>这是 WFC 的<strong>精髓</strong>，也是数独求解器中的核心机制。</p>

  <div class="codehilite"><pre><span></span><code><span class="k">function</span><span class="w"> </span><span class="nf">Propagate</span><span class="p">(</span>startCell, grid, adjList<span class="p">):</span>

  <span class="w">    </span><span class="nb">stack</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="p">[</span><span class="n">startCell</span><span class="p">]</span>


  <span class="w">    </span><span class="k">while</span><span class="w"> </span><span class="nb">stack</span><span class="w"> </span>非空<span class="p">:</span>

  <span class="w">        </span><span class="nb">cell</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="nb">stack</span><span class="p">.</span><span class="n">pop</span><span class="p">()</span>


  <span class="w">        </span><span class="k">for</span><span class="w"> </span><span class="n">each</span><span class="w"> </span><span class="n">neighbor</span><span class="w"> </span><span class="n">of</span><span class="w"> </span><span class="nb">cell</span><span class="w"> </span><span class="p">(</span>上下左右<span class="p">):</span>

  <span class="w">            </span><span class="o">//</span><span class="w"> </span>获取<span class="w"> </span><span class="n">neighbor</span><span class="w"> </span>在<span class="w"> </span><span class="nb">cell</span><span class="w"> </span>方向上允许的<span class="w"> </span><span class="n">tile</span>

  <span class="w">            </span><span class="n">allowed</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="n">GetAllowedTiles</span><span class="p">(</span><span class="nb">cell</span><span class="p">,</span><span class="w"> </span><span class="n">neighbor</span><span class="p">,</span><span class="w"> </span><span class="n">adjList</span><span class="p">)</span>


  <span class="w">            </span><span class="o">//</span><span class="w"> </span>从<span class="w"> </span><span class="n">neighbor</span><span class="w"> </span>的可能性中剔除不允许的<span class="w"> </span><span class="n">tile</span>

  <span class="w">            </span><span class="n">removed</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="n">neighbor</span><span class="p">.</span><span class="n">possibilities</span><span class="w"> </span><span class="o">-</span><span class="w"> </span><span class="n">allowed</span>


  <span class="w">            </span><span class="k">if</span><span class="w"> </span><span class="n">removed</span><span class="w"> </span>非空<span class="p">:</span>

  <span class="w">                </span><span class="n">neighbor</span><span class="p">.</span><span class="n">possibilities</span><span class="w"> </span><span class="o">-</span><span class="p">=</span><span class="w"> </span><span class="n">removed</span>

  <span class="w">                </span><span class="k">if</span><span class="w"> </span><span class="n">neighbor</span><span class="p">.</span><span class="n">possibilities</span><span class="w"> </span>为空<span class="p">:</span>

  <span class="w">                    </span><span class="k">return</span><span class="w"> </span><span class="nb">false</span><span class="w">  </span><span class="o">//</span><span class="w"> </span>矛盾！

  <span class="w">                </span><span class="nb">stack</span><span class="p">.</span><span class="n">push</span><span class="p">(</span><span class="n">neighbor</span><span class="p">)</span><span class="w">  </span><span class="o">//</span><span class="w"> </span>继续传播


  <span class="w">    </span><span class="k">return</span><span class="w"> </span><span class="nb">true</span>

  </code></pre></div>


  <blockquote>

  <p><strong>类比数独</strong>：<br />

  - 数独中：格子填了 5 → 同行/列/宫的格子不能再填 5<br />

  - WFC 中：格子放了 tile $A$ → 右边格子只能放 $A$ 的允许邻居（比如 tile $B$ 或 tile $D$）</p>

  <p>传播机制完全相同——都是"确定一个格子的状态后，削减相关格子的可能性"。</p>

  </blockquote>

  <h3>3.5 步骤四：图像合成</h3>

  <p>根据最终塌缩结果，将 tile 拼接为输出图像。</p>

  <div class="codehilite"><pre><span></span><code><span class="n">newImg</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="nb">zeros</span><span class="p">([</span><span class="n">rows</span><span class="o">*</span><span class="n">pixNum</span><span class="p">,</span><span class="w"> </span><span class="n">cols</span><span class="o">*</span><span class="n">pixNum</span><span class="p">,</span><span class="w"> </span><span class="nb">size</span><span class="p">(</span><span class="n">img</span><span class="p">,</span><span class="mi">3</span><span class="p">)]);</span>

  <span class="k">for</span><span class="w"> </span><span class="nb">i</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="mi">1</span><span class="p">:</span><span class="n">rows</span>

  <span class="w">    </span><span class="k">for</span><span class="w"> </span><span class="nb">j</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="mi">1</span><span class="p">:</span><span class="n">cols</span>

  <span class="w">        </span><span class="n">newImg</span><span class="p">(((</span><span class="nb">i</span><span class="o">-</span><span class="mi">1</span><span class="p">)</span><span class="o">*</span><span class="n">pixNum</span><span class="o">+</span><span class="mi">1</span><span class="p">):(</span><span class="nb">i</span><span class="o">*</span><span class="n">pixNum</span><span class="p">),</span><span class="w"> </span><span class="k">...</span>

  <span class="w">               </span><span class="p">((</span><span class="nb">j</span><span class="o">-</span><span class="mi">1</span><span class="p">)</span><span class="o">*</span><span class="n">pixNum</span><span class="o">+</span><span class="mi">1</span><span class="p">):(</span><span class="nb">j</span><span class="o">*</span><span class="n">pixNum</span><span class="p">),</span><span class="w"> </span><span class="p">:)</span><span class="w"> </span><span class="p">=</span><span class="w"> </span><span class="k">...</span>

  <span class="w">            </span><span class="n">imgList</span><span class="p">{</span><span class="n">indMat</span><span class="p">(</span><span class="nb">i</span><span class="p">,</span><span class="nb">j</span><span class="p">)};</span>

  <span class="w">    </span><span class="k">end</span>

  <span class="k">end</span>

  </code></pre></div>


  <hr />

  <h2>4. 数独 vs WFC：一张表看懂本质</h2>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">维度</th>

  <th style="text-align: left;">数独</th>

  <th style="text-align: left;">WFC（Tiled Model）</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>格子状态</strong></td>

  <td style="text-align: left;">数字 ${1, \ldots, 9}$</td>

  <td style="text-align: left;">图像 tile ${\text{tile}_1, \ldots, \text{tile}_k}$</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>约束类型</strong></td>

  <td style="text-align: left;">同行/列/宫不重复</td>

  <td style="text-align: left;">相邻 tile 边缘像素匹配</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>约束来源</strong></td>

  <td style="text-align: left;">人为规定</td>

  <td style="text-align: left;">从样本图像自动提取</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>塌缩策略</strong></td>

  <td style="text-align: left;">选可能性最少的格子</td>

  <td style="text-align: left;">选熵最低的格子</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>约束传播</strong></td>

  <td style="text-align: left;">削减同行/列/宫的可能性</td>

  <td style="text-align: left;">削减相邻格子的可能性</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>矛盾处理</strong></td>

  <td style="text-align: left;">回溯或重启</td>

  <td style="text-align: left;">回溯或重启</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>输出</strong></td>

  <td style="text-align: left;">唯一解（有解数独）</td>

  <td style="text-align: left;">多种可能（随机性生成）</td>

  </tr>

  </tbody>

  </table>

  <p>核心观察：<strong>WFC 的算法骨架与数独求解器几乎完全相同</strong>，只是把"数字 + 行列宫约束"泛化为了"tile + 邻接约束"，并加入了权重随机性以产生多样化的输出。</p>

  <hr />

  <h2>5. 两种模型</h2>

  <h3>5.1 Tiled Model（拼贴模型）</h3>

  <p>将样本图像切分为若干个小块（tiles），分析它们之间的邻接关系，然后基于这些关系生成新图像。</p>

  <ul>

  <li><strong>输入</strong>：一张样本图像 + tiles 的切分信息</li>

  <li><strong>规则来源</strong>：手工指定或自动提取 tiles 之间的邻接关系</li>

  <li><strong>优点</strong>：概念简单，可控性强</li>

  <li><strong>缺点</strong>：需要预先定义 tiles 和邻接规则</li>

  </ul>

  <h3>5.2 Overlapping Model（重叠模型）</h3>

  <p>不预定义 tiles，而是从样本图像中提取 $N \times N$ 的<strong>像素模式（patterns）</strong>，分析这些模式之间的重叠关系。</p>

  <ul>

  <li><strong>输入</strong>：仅一张样本图像</li>

  <li><strong>规则来源</strong>：自动从样本中提取模式及其允许的重叠方式</li>

  <li><strong>优点</strong>：完全自动化，不需要手工定义规则</li>

  <li><strong>缺点</strong>：模式数量可能很多，计算开销更大</li>

  </ul>

  <hr />

  <h2>6. 矛盾处理：回溯 vs 重启</h2>

  <p>当约束传播导致某个格子的可能性清零时，算法遇到了<strong>矛盾</strong>——就像数独中某个格子没有任何合法数字可填。</p>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">策略</th>

  <th style="text-align: left;">方法</th>

  <th style="text-align: left;">优点</th>

  <th style="text-align: left;">缺点</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>重启（Restart）</strong></td>

  <td style="text-align: left;">放弃当前结果，从头开始</td>

  <td style="text-align: left;">实现简单</td>

  <td style="text-align: left;">可能多次失败，浪费计算</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>回溯（Backtracking）</strong></td>

  <td style="text-align: left;">撤销上一次塌缩决策，尝试其他 tile</td>

  <td style="text-align: left;">更高成功率</td>

  <td style="text-align: left;">实现复杂，可能指数级回溯</td>

  </tr>

  </tbody>

  </table>

  <p>原始 WFC 实现使用<strong>重启策略</strong>。实践表明，对于合理设计的邻接规则，重启几次后几乎总能成功。但对于约束很紧的问题（类似于数独中的"极难数独"），回溯更可靠。</p>

  <hr />

  <h2>7. WFC 与其他程序化生成方法的对比</h2>

  <table>

  <thead>

  <tr>

  <th style="text-align: left;">方法</th>

  <th style="text-align: left;">原理</th>

  <th style="text-align: left;">输入</th>

  <th style="text-align: left;">优点</th>

  <th style="text-align: left;">缺点</th>

  </tr>

  </thead>

  <tbody>

  <tr>

  <td style="text-align: left;"><strong>WFC</strong></td>

  <td style="text-align: left;">约束传播 + 熵塌缩</td>

  <td style="text-align: left;">一张样本图</td>

  <td style="text-align: left;">自动学习规则，局部连续性好</td>

  <td style="text-align: left;">全局结构不可控</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>L-System</strong></td>

  <td style="text-align: left;">字符串重写规则</td>

  <td style="text-align: left;">产生式规则</td>

  <td style="text-align: left;">适合植物/分形结构</td>

  <td style="text-align: left;">规则需手工设计</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>噪声函数（Perlin/Simplex）</strong></td>

  <td style="text-align: left;">梯度噪声插值</td>

  <td style="text-align: left;">参数</td>

  <td style="text-align: left;">连续平滑，计算快</td>

  <td style="text-align: left;">不适合结构化内容</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>Cellular Automata</strong></td>

  <td style="text-align: left;">局部邻域规则</td>

  <td style="text-align: left;">规则 + 初始状态</td>

  <td style="text-align: left;">简单直观，适合洞穴生成</td>

  <td style="text-align: left;">规则需手工设计</td>

  </tr>

  <tr>

  <td style="text-align: left;"><strong>Voronoi 图</strong></td>

  <td style="text-align: left;">最近邻划分</td>

  <td style="text-align: left;">种子点</td>

  <td style="text-align: left;">天然分区效果</td>

  <td style="text-align: left;">生成结果模式单一</td>

  </tr>

  </tbody>

  </table>

  <p>WFC 的独特优势在于<strong>数据驱动</strong>——只需提供一张样本，算法自动提取规则。不需要手工编写规则，也不需要机器学习训练。</p>

