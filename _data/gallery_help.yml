: "<p>碰撞检测是游戏开发、物理模拟、机器人学中的核心问题。本文从粗检测到精检测，系统梳理碰撞检测算法体系。</p>\n<!--more-->\n\n<hr />\n<h2>1. 碰撞检测的分层架构</h2>\n<p>实际的碰撞检测系统通常分为<strong>两个阶段</strong>：</p>\n<p>$$\\underbrace{\\text{Broad Phase（粗检测）}}<em>{\\text{快速排除不可能碰撞的物体对}} \\to \\underbrace{\\text{Narrow Phase（精检测）}}</em>{\\text{精确判断是否碰撞 + 计算碰撞信息}}$$</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">阶段</th>\n<th style=\"text-align: left;\">目标</th>\n<th style=\"text-align: left;\">方法</th>\n<th style=\"text-align: left;\">复杂度（$n$ 个物体）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>Broad Phase</strong></td>\n<td style=\"text-align: left;\">快速排除不可能碰撞的对</td>\n<td style=\"text-align: left;\">AABB 粗检、空间划分、BVH</td>\n<td style=\"text-align: left;\">$O(n \\log n)$</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Narrow Phase</strong></td>\n<td style=\"text-align: left;\">精确判断碰撞并计算碰撞信息</td>\n<td style=\"text-align: left;\">SAT、GJK、EPA</td>\n<td style=\"text-align: left;\">$O(1)$ 每对</td>\n</tr>\n</tbody>\n\
  </table>\n<p>为什么需要分层？朴素方法需要 $O(n^2)$ 两两检测，当 $n = 10^4$ 时完全不现实。Broad Phase 将候选对从 $O(n^2)$ 降到 $O(n \\log n)$，Narrow Phase 对每对候选做精确检测。</p>\n<hr />\n<h2>2. 包围体（Bounding Volume）——Broad Phase 的基础</h2>\n<h3>2.1 包围球（Bounding Sphere）</h3>\n<p>最简单的包围体，用球心 $c$ 和半径 $r$ 表示。</p>\n<p><strong>碰撞判断</strong>：两球心距离 &lt; 半径之和</p>\n<p>$$|c_A - c_B|^2 &lt; (r_A + r_B)^2$$</p>\n<p>注意：比较<strong>距离的平方</strong>以避免开方运算。</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">优点</th>\n<th style=\"text-align: left;\">缺点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">计算极快，$O(1)$</td>\n<td style=\"text-align: left;\">对长条形物体包裹不紧</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">旋转不变（球旋转后不变）</td>\n<td style=\"text-align: left;\">大量误报（false positive）</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">容易计算（取最远顶点对）</td>\n<td style=\"text-align: left;\">无法利用物体方向信息</td>\n</tr>\n</tbody>\n</table>\n<h3>2.2 AABB（Axis-Aligned Bounding Box）</h3>\n<p>轴对齐包围盒：边平行于坐标轴的长方体。用 $(x_{\\min}, x_{\\max}, y_{\\\
  min}, y_{\\max})$ 表示。</p>\n<p><strong>碰撞判断</strong>：三个轴上投影都重叠</p>\n<p>$$\\text{AABB}<em>A \\cap \\text{AABB}_B \\neq \\emptyset \\iff \\begin{cases} x</em>{\\min}^A \\leq x_{\\max}^B \\text{ 且 } x_{\\max}^A \\geq x_{\\min}^B \\ y_{\\min}^A \\leq y_{\\max}^B \\text{ 且 } y_{\\max}^A \\geq y_{\\min}^B \\ z_{\\min}^A \\leq z_{\\max}^B \\text{ 且 } z_{\\max}^A \\geq z_{\\min}^B \\end{cases}$$</p>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"kt\">bool</span><span class=\"w\"> </span><span class=\"nf\">AABBIntersect</span><span class=\"p\">(</span><span class=\"n\">AABB</span><span class=\"w\"> </span><span class=\"n\">a</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">AABB</span><span class=\"w\"> </span><span class=\"n\">b</span><span class=\"p\">)</span><span class=\"w\"> </span><span class=\"p\">{</span>\n<span class=\"w\">    </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"p\">(</span><span class=\"n\">a</span><span\
  \ class=\"p\">.</span><span class=\"n\">minX</span><span class=\"w\"> </span><span class=\"o\">&lt;=</span><span class=\"w\"> </span><span class=\"n\">b</span><span class=\"p\">.</span><span class=\"n\">maxX</span><span class=\"w\"> </span><span class=\"o\">&amp;&amp;</span><span class=\"w\"> </span><span class=\"n\">a</span><span class=\"p\">.</span><span class=\"n\">maxX</span><span class=\"w\"> </span><span class=\"o\">&gt;=</span><span class=\"w\"> </span><span class=\"n\">b</span><span class=\"p\">.</span><span class=\"n\">minX</span><span class=\"p\">)</span><span class=\"w\"> </span><span class=\"o\">&amp;&amp;</span>\n<span class=\"w\">           </span><span class=\"p\">(</span><span class=\"n\">a</span><span class=\"p\">.</span><span class=\"n\">minY</span><span class=\"w\"> </span><span class=\"o\">&lt;=</span><span class=\"w\"> </span><span class=\"n\">b</span><span class=\"p\">.</span><span class=\"n\">maxY</span><span class=\"w\"> </span><span class=\"o\">&amp;&amp;</span><span\
  \ class=\"w\"> </span><span class=\"n\">a</span><span class=\"p\">.</span><span class=\"n\">maxY</span><span class=\"w\"> </span><span class=\"o\">&gt;=</span><span class=\"w\"> </span><span class=\"n\">b</span><span class=\"p\">.</span><span class=\"n\">minY</span><span class=\"p\">)</span><span class=\"w\"> </span><span class=\"o\">&amp;&amp;</span>\n<span class=\"w\">           </span><span class=\"p\">(</span><span class=\"n\">a</span><span class=\"p\">.</span><span class=\"n\">minZ</span><span class=\"w\"> </span><span class=\"o\">&lt;=</span><span class=\"w\"> </span><span class=\"n\">b</span><span class=\"p\">.</span><span class=\"n\">maxZ</span><span class=\"w\"> </span><span class=\"o\">&amp;&amp;</span><span class=\"w\"> </span><span class=\"n\">a</span><span class=\"p\">.</span><span class=\"n\">maxZ</span><span class=\"w\"> </span><span class=\"o\">&gt;=</span><span class=\"w\"> </span><span class=\"n\">b</span><span class=\"p\">.</span><span class=\"n\">minZ</span><span class=\"\
  p\">);</span>\n<span class=\"p\">}</span>\n</code></pre></div>\n\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">优点</th>\n<th style=\"text-align: left;\">缺点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">比包围球更紧凑（尤其对扁平/方形物体）</td>\n<td style=\"text-align: left;\">不旋转不变——物体旋转后需重新计算</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">6 次比较即可判断</td>\n<td style=\"text-align: left;\">对倾斜的长条物体包裹仍不够紧</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">内存开销小（6 个浮点数）</td>\n<td style=\"text-align: left;\">—</td>\n</tr>\n</tbody>\n</table>\n<h3>2.3 OBB（Oriented Bounding Box）</h3>\n<p>有向包围盒：允许旋转的 AABB。用中心 $c$、三个半轴向量 $\\mathbf{u}, \\mathbf{v}, \\mathbf{w}$ 和三个半长度 $h_u, h_v, h_w$ 表示。</p>\n<p><strong>碰撞判断</strong>：需要 15 条分离轴（见 SAT 部分）。</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">优点</th>\n<th style=\"text-align: left;\">缺点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">比 AABB 紧密得多（利用物体方向）</td>\n<td style=\"text-align: left;\">碰撞检测更复杂（15\
  \ 条分离轴）</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">旋转后只需重新计算轴向，不需要重新拟合</td>\n<td style=\"text-align: left;\">包围体更新代价高</td>\n</tr>\n</tbody>\n</table>\n<h3>2.4 三种包围体对比</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">维度</th>\n<th style=\"text-align: left;\">包围球</th>\n<th style=\"text-align: left;\">AABB</th>\n<th style=\"text-align: left;\">OBB</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>紧凑度</strong></td>\n<td style=\"text-align: left;\">★☆☆</td>\n<td style=\"text-align: left;\">★★☆</td>\n<td style=\"text-align: left;\">★★★</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>检测速度</strong></td>\n<td style=\"text-align: left;\">★★★</td>\n<td style=\"text-align: left;\">★★★</td>\n<td style=\"text-align: left;\">★★☆</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>旋转适应</strong></td>\n<td style=\"text-align: left;\">★★★（不变）</td>\n<td style=\"text-align: left;\">★☆☆（需重构）</td>\n<td style=\"text-align: left;\">★★★（随物体旋转）</td>\n\
  </tr>\n<tr>\n<td style=\"text-align: left;\"><strong>更新代价</strong></td>\n<td style=\"text-align: left;\">★★★（不变）</td>\n<td style=\"text-align: left;\">★★☆</td>\n<td style=\"text-align: left;\">★☆☆</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>内存</strong></td>\n<td style=\"text-align: left;\">4 floats</td>\n<td style=\"text-align: left;\">6 floats</td>\n<td style=\"text-align: left;\">15 floats</td>\n</tr>\n</tbody>\n</table>\n<p>工程实践中最常见的组合：<strong>Broad Phase 用 AABB，Narrow Phase 用 GJK</strong>。</p>\n<hr />\n<h2>3. 空间划分——Broad Phase 加速</h2>\n<h3>3.1 为什么需要空间划分</h3>\n<p>即使使用 AABB 粗检，$n$ 个物体仍需 $O(n^2)$ 次检测。空间划分的核心思想：</p>\n<blockquote>\n<p>如果两个物体在空间上相距很远，它们的 AABB 一定不相交，无需检测。</p>\n</blockquote>\n<h3>3.2 BVH（Bounding Volume Hierarchy）</h3>\n<p><strong>BVH</strong> 是一棵二叉树，每个节点存储一个包围体（通常是 AABB），叶子节点对应一个物体。</p>\n<p><strong>构建</strong>：自顶向下递归——选择最长的轴，按中位数切分，左右子树分别构建。</p>\n<p><strong>查询</strong>：从根节点开始，如果两棵 BVH 的根节点 AABB 不相交，则它们的子树都不可能相交，直接跳过。</p>\n<div class=\"codehilite\"><pre><span></span><code><span\
  \ class=\"k\">function</span><span class=\"w\"> </span><span class=\"nf\">BVHIntersect</span><span class=\"p\">(</span>nodeA, nodeB<span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"n\">NOT</span><span class=\"w\"> </span><span class=\"n\">AABBIntersect</span><span class=\"p\">(</span><span class=\"n\">nodeA</span><span class=\"p\">.</span><span class=\"n\">box</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">nodeB</span><span class=\"p\">.</span><span class=\"n\">box</span><span class=\"p\">):</span>\n<span class=\"w\">        </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"nb\">false</span><span class=\"w\">  </span><span class=\"o\">//</span><span class=\"w\"> </span>剪枝！\n\n<span class=\"w\">    </span><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"n\">nodeA</span><span class=\"p\">.</span><span class=\"n\">isLeaf</span><span class=\"\
  w\"> </span><span class=\"n\">AND</span><span class=\"w\"> </span><span class=\"n\">nodeB</span><span class=\"p\">.</span><span class=\"n\">isLeaf</span><span class=\"p\">:</span>\n<span class=\"w\">        </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"n\">NarrowPhase</span><span class=\"p\">(</span><span class=\"n\">nodeA</span><span class=\"p\">.</span><span class=\"n\">object</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">nodeB</span><span class=\"p\">.</span><span class=\"n\">object</span><span class=\"p\">)</span>\n\n<span class=\"w\">    </span><span class=\"o\">//</span><span class=\"w\"> </span>递归展开较大（更多子节点）的节点\n<span class=\"w\">    </span><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"n\">nodeA</span><span class=\"p\">.</span><span class=\"n\">area</span><span class=\"w\"> </span><span class=\"o\">&gt;</span><span class=\"w\"> </span><span class=\"n\">nodeB</span><span class=\"p\">.</span><span class=\"\
  n\">area</span><span class=\"p\">:</span>\n<span class=\"w\">        </span><span class=\"k\">for</span><span class=\"w\"> </span><span class=\"n\">each</span><span class=\"w\"> </span><span class=\"n\">child</span><span class=\"w\"> </span><span class=\"n\">of</span><span class=\"w\"> </span><span class=\"n\">nodeA</span><span class=\"p\">:</span>\n<span class=\"w\">            </span><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"n\">BVHIntersect</span><span class=\"p\">(</span><span class=\"n\">child</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">nodeB</span><span class=\"p\">):</span>\n<span class=\"w\">                </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"nb\">true</span>\n<span class=\"w\">    </span><span class=\"k\">else</span><span class=\"p\">:</span>\n<span class=\"w\">        </span><span class=\"k\">for</span><span class=\"w\"> </span><span class=\"n\">each</span><span class=\"w\"> </span><span\
  \ class=\"n\">child</span><span class=\"w\"> </span><span class=\"n\">of</span><span class=\"w\"> </span><span class=\"n\">nodeB</span><span class=\"p\">:</span>\n<span class=\"w\">            </span><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"n\">BVHIntersect</span><span class=\"p\">(</span><span class=\"n\">nodeA</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">child</span><span class=\"p\">):</span>\n<span class=\"w\">                </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"nb\">true</span>\n<span class=\"w\">    </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"nb\">false</span>\n</code></pre></div>\n\n<p><strong>动态更新</strong>：物体移动后，BVH 需要更新。常用策略：<br />\n- <strong>Refit</strong>：重新计算每个节点的 AABB（$O(n)$），不改变树结构<br />\n- <strong>Rebuild</strong>：当节点偏离过多时完全重建（通常每 N 帧一次）</p>\n<h3>3.3 其他空间划分方法</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">方法</th>\n<th style=\"\
  text-align: left;\">数据结构</th>\n<th style=\"text-align: left;\">适用场景</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>均匀网格（Uniform Grid）</strong></td>\n<td style=\"text-align: left;\">3D 数组</td>\n<td style=\"text-align: left;\">物体均匀分布、大小相近</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>八叉树（Octree）</strong></td>\n<td style=\"text-align: left;\">递归八分空间</td>\n<td style=\"text-align: left;\">大范围 3D 场景</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>四叉树（Quadtree）</strong></td>\n<td style=\"text-align: left;\">递归四分 2D 空间</td>\n<td style=\"text-align: left;\">2D 游戏</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>KD 树</strong></td>\n<td style=\"text-align: left;\">按轴交替切分</td>\n<td style=\"text-align: left;\">静态场景（射线追踪常用）</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>Sort and Sweep</strong></td>\n<td style=\"text-align: left;\">沿轴排序 + 扫描</td>\n<td style=\"text-align: left;\">动态物体较多的场景</td>\n</tr>\n</tbody>\n</table>\n<hr\
  \ />\n<h2>4. SAT（分离轴定理）——Narrow Phase 基础</h2>\n<h3>4.1 定理</h3>\n<p><strong>分离轴定理（Separating Axis Theorem, SAT）</strong>：</p>\n<blockquote>\n<p>两个<strong>凸</strong>多边形（或多面体）不相交，当且仅当存在一条<strong>分离轴</strong>，使得两个多边形在该轴上的投影不重叠。</p>\n</blockquote>\n<p>等价表述：如果两个凸体在<strong>所有候选分离轴</strong>上的投影都重叠，则它们<strong>相交</strong>。</p>\n<h3>4.2 候选分离轴</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">形状</th>\n<th style=\"text-align: left;\">候选分离轴</th>\n<th style=\"text-align: left;\">轴的数量</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>两个凸多边形</strong></td>\n<td style=\"text-align: left;\">两条边的法线</td>\n<td style=\"text-align: left;\">$n_A + n_B$ 条</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>两个 OBB</strong></td>\n<td style=\"text-align: left;\">6 个面法线 + 9 个边叉积</td>\n<td style=\"text-align: left;\"><strong>15 条</strong></td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>两个 AABB</strong></td>\n<td style=\"text-align: left;\">3 个坐标轴</td>\n<td style=\"\
  text-align: left;\">3 条</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>OBB vs AABB</strong></td>\n<td style=\"text-align: left;\">3 + 3 + 9 =</td>\n<td style=\"text-align: left;\">15 条</td>\n</tr>\n</tbody>\n</table>\n<h3>4.3 SAT 算法流程</h3>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"k\">function</span><span class=\"w\"> </span><span class=\"nf\">SAT</span><span class=\"p\">(</span>A, B<span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"nb\">axes</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">GetCandidateAxes</span><span class=\"p\">(</span><span class=\"n\">A</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">B</span><span class=\"p\">)</span>\n\n<span class=\"w\">    </span><span class=\"k\">for</span><span class=\"w\"> </span><span class=\"n\">each</span><span class=\"w\"> </span><span class=\"nb\">axis</span><span class=\"w\"> </span><span class=\"n\"\
  >in</span><span class=\"w\"> </span><span class=\"nb\">axes</span><span class=\"p\">:</span>\n<span class=\"w\">        </span><span class=\"o\">//</span><span class=\"w\"> </span>将两个物体投影到该轴上\n<span class=\"w\">        </span><span class=\"p\">[</span><span class=\"n\">minA</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">maxA</span><span class=\"p\">]</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">Project</span><span class=\"p\">(</span><span class=\"n\">A</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"nb\">axis</span><span class=\"p\">)</span>\n<span class=\"w\">        </span><span class=\"p\">[</span><span class=\"n\">minB</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">maxB</span><span class=\"p\">]</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">Project</span><span class=\"p\">(</span><span class=\"\
  n\">B</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"nb\">axis</span><span class=\"p\">)</span>\n\n<span class=\"w\">        </span><span class=\"o\">//</span><span class=\"w\"> </span>检查投影是否重叠\n<span class=\"w\">        </span><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"n\">maxA</span><span class=\"w\"> </span><span class=\"o\">&lt;</span><span class=\"w\"> </span><span class=\"n\">minB</span><span class=\"w\"> </span><span class=\"n\">OR</span><span class=\"w\"> </span><span class=\"n\">maxB</span><span class=\"w\"> </span><span class=\"o\">&lt;</span><span class=\"w\"> </span><span class=\"n\">minA</span><span class=\"p\">:</span>\n<span class=\"w\">            </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"nb\">false</span><span class=\"w\">  </span><span class=\"o\">//</span><span class=\"w\"> </span>找到分离轴<span class=\"w\"> </span>→<span class=\"w\"> </span>不相交！\n\n<span class=\"w\">        </span><span\
  \ class=\"o\">//</span><span class=\"w\"> </span>记录最小重叠量（用于穿透深度）\n<span class=\"w\">        </span><span class=\"n\">overlap</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"nb\">min</span><span class=\"p\">(</span><span class=\"n\">maxA</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">maxB</span><span class=\"p\">)</span><span class=\"w\"> </span><span class=\"o\">-</span><span class=\"w\"> </span><span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"n\">minA</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">minB</span><span class=\"p\">)</span>\n<span class=\"w\">        </span><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"n\">overlap</span><span class=\"w\"> </span><span class=\"o\">&lt;</span><span class=\"w\"> </span><span class=\"n\">minOverlap</span><span class=\"p\">:</span>\n<span class=\"w\">            </span><span class=\"n\">minOverlap</span><span\
  \ class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">overlap</span>\n<span class=\"w\">            </span><span class=\"n\">collisionNormal</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"nb\">axis</span>\n\n<span class=\"w\">    </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"nb\">true</span><span class=\"w\">  </span><span class=\"o\">//</span><span class=\"w\"> </span>所有轴都重叠<span class=\"w\"> </span>→<span class=\"w\"> </span>相交\n</code></pre></div>\n\n<h3>4.4 投影计算</h3>\n<p>将多边形投影到轴 $\\mathbf{n}$ 上：</p>\n<p>$$\\text{Project}(P, \\mathbf{n}) = \\left[\\min_{v \\in P}(v \\cdot \\mathbf{n}),\\ \\max_{v \\in P}(v \\cdot \\mathbf{n})\\right]$$</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">优点</th>\n<th style=\"text-align: left;\">缺点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\">概念直观，实现相对简单</td>\n<td style=\"text-align: left;\">只适用于<strong>凸</strong>体</td>\n\
  </tr>\n<tr>\n<td style=\"text-align: left;\">天然提供穿透深度和碰撞法线</td>\n<td style=\"text-align: left;\">候选轴数量随形状复杂度线性增长</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\">2D 多边形效果很好</td>\n<td style=\"text-align: left;\">3D 多面体可能有很多候选轴</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>5. GJK 算法——通用的凸体碰撞检测</h2>\n<h3>5.1 核心思想</h3>\n<p><strong>GJK（Gilbert-Johnson-Keerthi, 1988）</strong> 是一种通用的凸体碰撞检测算法，适用于<strong>任何凸体</strong>（不限于多边形），且不需要枚举所有分离轴。</p>\n<p>其核心观察：</p>\n<blockquote>\n<p><strong>判断两个凸体 $A$ 和 $B$ 是否相交，等价于判断它们的闵可夫斯基差是否包含原点。</strong></p>\n</blockquote>\n<h3>5.2 闵可夫斯基差（Minkowski Difference）</h3>\n<p>$$A \\ominus B = {\\mathbf{a} - \\mathbf{b} \\mid \\mathbf{a} \\in A,\\ \\mathbf{b} \\in B}$$</p>\n<p><strong>关键定理</strong>：</p>\n<p>$$A \\cap B \\neq \\emptyset \\iff \\mathbf{0} \\in A \\ominus B$$</p>\n<p>即：$A$ 和 $B$ 相交当且仅当原点在闵可夫斯基差内。</p>\n<p><strong>闵可夫斯基差的性质</strong>：若 $A$ 和 $B$ 是凸体，则 $A \\ominus B$ 也是凸体。</p>\n<h3>5.3 Support 函数</h3>\n<p>Support 函数返回凸体在给定方向上的<strong>最远点</strong>：</p>\n<p>$$S_C(\\\
  mathbf{d}) = \\arg\\max_{\\mathbf{c} \\in C} (\\mathbf{c} \\cdot \\mathbf{d})$$</p>\n<p><strong>关键性质</strong>：闵可夫斯基差的 Support 函数可以分解：</p>\n<p>$$S_{A \\ominus B}(\\mathbf{d}) = S_A(\\mathbf{d}) - S_B(-\\mathbf{d})$$</p>\n<p>这意味着我们<strong>不需要显式计算闵可夫斯基差</strong>（它可能有无穷多个点），只需要通过 Support 函数\"采样\"它。</p>\n<p><strong>不同形状的 Support 函数</strong>：</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">形状</th>\n<th style=\"text-align: left;\">Support 函数 $S(\\mathbf{d})$</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>球体</strong>（中心 $\\mathbf{c}$，半径 $r$）</td>\n<td style=\"text-align: left;\">$\\mathbf{c} + r \\cdot \\hat{\\mathbf{d}}$</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>AABB</strong>（中心 $\\mathbf{c}$，半尺寸 $\\mathbf{h}$）</td>\n<td style=\"text-align: left;\">$\\mathbf{c} + (h_x \\text{sign}(d_x),\\ h_y \\text{sign}(d_y),\\ h_z \\text{sign}(d_z))$</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>凸多面体</strong>（顶点集 $V$）</td>\n<td style=\"\
  text-align: left;\">$\\arg\\max_{\\mathbf{v} \\in V} (\\mathbf{v} \\cdot \\mathbf{d})$</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>胶囊体</strong>（中心 $\\mathbf{c}$，半高 $h$，半径 $r$）</td>\n<td style=\"text-align: left;\">$\\mathbf{c} + h \\cdot \\text{sign}(\\hat{\\mathbf{d}}_y) \\cdot \\hat{\\mathbf{y}} + r \\cdot \\text{proj}(\\hat{\\mathbf{d}}, \\perp\\hat{\\mathbf{y}})$</td>\n</tr>\n</tbody>\n</table>\n<h3>5.4 Simplex</h3>\n<p>GJK 通过迭代构建一个<strong>单纯形（Simplex）</strong>来逼近原点：<br />\n- 2D 中：点 → 线段 → 三角形<br />\n- 3D 中：点 → 线段 → 三角形 → 四面体</p>\n<p>每轮迭代，GJK 向原点方向搜索新的 Support 点，然后判断原点是否在当前 Simplex 内。如果不在，就缩减 Simplex（去掉最远的点），继续迭代。</p>\n<h3>5.5 GJK 完整伪代码</h3>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"k\">function</span><span class=\"w\"> </span><span class=\"nf\">GJK</span><span class=\"p\">(</span>Shape A, Shape B<span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"n\">d</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"\
  w\"> </span><span class=\"n\">B</span><span class=\"p\">.</span><span class=\"n\">center</span><span class=\"w\"> </span><span class=\"o\">-</span><span class=\"w\"> </span><span class=\"n\">A</span><span class=\"p\">.</span><span class=\"n\">center</span><span class=\"w\">  </span><span class=\"o\">//</span><span class=\"w\"> </span>初始方向：<span class=\"n\">A</span><span class=\"w\"> </span>中心指向<span class=\"w\"> </span><span class=\"n\">B</span><span class=\"w\"> </span>中心\n<span class=\"w\">    </span><span class=\"n\">simplex</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"p\">[]</span>\n\n<span class=\"w\">    </span><span class=\"o\">//</span><span class=\"w\"> </span>获取第一个<span class=\"w\"> </span><span class=\"n\">Support</span><span class=\"w\"> </span>点\n<span class=\"w\">    </span><span class=\"n\">simplex</span><span class=\"p\">.</span><span class=\"n\">add</span><span class=\"p\">(</span><span class=\"n\">Support</span><span\
  \ class=\"p\">(</span><span class=\"n\">A</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">B</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">d</span><span class=\"p\">))</span>\n<span class=\"w\">    </span><span class=\"n\">d</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"o\">-</span><span class=\"n\">simplex</span><span class=\"p\">[</span><span class=\"mi\">0</span><span class=\"p\">]</span><span class=\"w\">  </span><span class=\"o\">//</span><span class=\"w\"> </span>反向：从第一个点指向原点\n\n<span class=\"w\">    </span><span class=\"k\">for</span><span class=\"w\"> </span><span class=\"n\">iteration</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"mi\">1</span><span class=\"w\"> </span><span class=\"n\">to</span><span class=\"w\"> </span><span class=\"n\">MAX_ITERATIONS</span><span class=\"p\">:</span>\n<span class=\"w\">        </span><span\
  \ class=\"o\">//</span><span class=\"w\"> </span>在当前方向上获取新的<span class=\"w\"> </span><span class=\"n\">Support</span><span class=\"w\"> </span>点\n<span class=\"w\">        </span><span class=\"n\">A_new</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">Support</span><span class=\"p\">(</span><span class=\"n\">A</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">B</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">d</span><span class=\"p\">)</span>\n\n<span class=\"w\">        </span><span class=\"o\">//</span><span class=\"w\"> </span>如果新点没有越过原点<span class=\"w\"> </span>→<span class=\"w\"> </span>原点不在闵可夫斯基差内\n<span class=\"w\">        </span><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"nb\">dot</span><span class=\"p\">(</span><span class=\"n\">A_new</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">d</span><span class=\"p\">)</span><span\
  \ class=\"w\"> </span><span class=\"o\">&lt;</span><span class=\"w\"> </span><span class=\"mi\">0</span><span class=\"p\">:</span>\n<span class=\"w\">            </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"p\">(</span><span class=\"nb\">false</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"mi\">0</span><span class=\"p\">)</span><span class=\"w\">  </span><span class=\"o\">//</span><span class=\"w\"> </span>不相交\n\n<span class=\"w\">        </span><span class=\"n\">simplex</span><span class=\"p\">.</span><span class=\"n\">add</span><span class=\"p\">(</span><span class=\"n\">A_new</span><span class=\"p\">)</span>\n\n<span class=\"w\">        </span><span class=\"o\">//</span><span class=\"w\"> </span>检查<span class=\"w\"> </span><span class=\"n\">Simplex</span><span class=\"w\"> </span>是否包含原点\n<span class=\"w\">        </span><span class=\"p\">(</span><span class=\"nb\">contains</span><span class=\"p\">,</span><span class=\"w\"> </span><span\
  \ class=\"n\">d</span><span class=\"p\">)</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">SimplexContainsOrigin</span><span class=\"p\">(</span><span class=\"n\">simplex</span><span class=\"p\">)</span>\n<span class=\"w\">        </span><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"nb\">contains</span><span class=\"p\">:</span>\n<span class=\"w\">            </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"p\">(</span><span class=\"nb\">true</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">simplex</span><span class=\"p\">)</span><span class=\"w\">  </span><span class=\"o\">//</span><span class=\"w\"> </span>相交！返回<span class=\"w\"> </span><span class=\"n\">Simplex</span><span class=\"w\"> </span>给<span class=\"w\"> </span><span class=\"n\">EPA</span>\n<span class=\"w\">        </span><span class=\"o\">//</span><span class=\"w\"> </span>否则<span class=\"w\"> </span><span\
  \ class=\"n\">d</span><span class=\"w\"> </span>已更新为新的搜索方向\n\n<span class=\"w\">    </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"p\">(</span><span class=\"nb\">false</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"mi\">0</span><span class=\"p\">)</span><span class=\"w\">  </span><span class=\"o\">//</span><span class=\"w\"> </span>超过最大迭代次数\n\n<span class=\"k\">function</span><span class=\"w\"> </span><span class=\"nf\">Support</span><span class=\"p\">(</span>A, B, direction<span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"n\">SupportA</span><span class=\"p\">(</span><span class=\"n\">A</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">direction</span><span class=\"p\">)</span><span class=\"w\"> </span><span class=\"o\">-</span><span class=\"w\"> </span><span class=\"n\">SupportB</span><span class=\"p\">(</span><span class=\"n\"\
  >B</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"o\">-</span><span class=\"n\">direction</span><span class=\"p\">)</span>\n\n<span class=\"k\">function</span><span class=\"w\"> </span><span class=\"nf\">SimplexContainsOrigin</span><span class=\"p\">(</span>simplex<span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"n\">simplex</span><span class=\"p\">.</span><span class=\"n\">size</span><span class=\"w\"> </span><span class=\"o\">==</span><span class=\"w\"> </span><span class=\"mi\">2</span><span class=\"p\">:</span><span class=\"w\">  </span><span class=\"o\">//</span><span class=\"w\"> </span>线段\n<span class=\"w\">        </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"n\">LineContainsOrigin</span><span class=\"p\">(</span><span class=\"n\">simplex</span><span class=\"p\">)</span>\n<span class=\"w\">    </span><span class=\"n\">elif</span><span class=\"w\">\
  \ </span><span class=\"n\">simplex</span><span class=\"p\">.</span><span class=\"n\">size</span><span class=\"w\"> </span><span class=\"o\">==</span><span class=\"w\"> </span><span class=\"mi\">3</span><span class=\"p\">:</span><span class=\"w\">  </span><span class=\"o\">//</span><span class=\"w\"> </span>三角形（2<span class=\"n\">D</span>）<span class=\"o\">/</span><span class=\"w\"> </span>三角形（3<span class=\"n\">D</span><span class=\"w\"> </span>中间态）\n<span class=\"w\">        </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"n\">TriangleContainsOrigin</span><span class=\"p\">(</span><span class=\"n\">simplex</span><span class=\"p\">)</span>\n<span class=\"w\">    </span><span class=\"n\">elif</span><span class=\"w\"> </span><span class=\"n\">simplex</span><span class=\"p\">.</span><span class=\"n\">size</span><span class=\"w\"> </span><span class=\"o\">==</span><span class=\"w\"> </span><span class=\"mi\">4</span><span class=\"p\">:</span><span class=\"w\">\
  \  </span><span class=\"o\">//</span><span class=\"w\"> </span>四面体（3<span class=\"n\">D</span>）\n<span class=\"w\">        </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"n\">TetrahedronContainsOrigin</span><span class=\"p\">(</span><span class=\"n\">simplex</span><span class=\"p\">)</span>\n\n<span class=\"k\">function</span><span class=\"w\"> </span><span class=\"nf\">TriangleContainsOrigin</span><span class=\"p\">(</span>simplex<span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"o\">//</span><span class=\"w\"> </span><span class=\"n\">simplex</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"p\">[</span><span class=\"n\">A</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">B</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">C</span><span class=\"p\">]</span>（逆时针）\n<span class=\"w\">    </span><span class=\"n\">A</span><span class=\"w\"\
  > </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">simplex</span><span class=\"p\">[</span><span class=\"mi\">0</span><span class=\"p\">],</span><span class=\"w\"> </span><span class=\"n\">B</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">simplex</span><span class=\"p\">[</span><span class=\"mi\">1</span><span class=\"p\">],</span><span class=\"w\"> </span><span class=\"n\">C</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">simplex</span><span class=\"p\">[</span><span class=\"mi\">2</span><span class=\"p\">]</span>\n<span class=\"w\">    </span><span class=\"n\">AB</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">B</span><span class=\"w\"> </span><span class=\"o\">-</span><span class=\"w\"> </span><span class=\"n\">A</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">AC</span><span\
  \ class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">C</span><span class=\"w\"> </span><span class=\"o\">-</span><span class=\"w\"> </span><span class=\"n\">A</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">AO</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"o\">-</span><span class=\"n\">A</span>\n\n<span class=\"w\">    </span><span class=\"o\">//</span><span class=\"w\"> </span>检查原点是否在<span class=\"w\"> </span><span class=\"n\">AB</span><span class=\"w\"> </span>边的外侧\n<span class=\"w\">    </span><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"nb\">dot</span><span class=\"p\">(</span><span class=\"n\">AB</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">AO</span><span class=\"p\">)</span><span class=\"w\"> </span><span class=\"o\">&gt;</span><span class=\"w\"> </span><span class=\"mi\">0</span><span class=\"p\">:</span>\n<span\
  \ class=\"w\">        </span><span class=\"n\">simplex</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"p\">[</span><span class=\"n\">A</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">B</span><span class=\"p\">]</span><span class=\"w\">  </span><span class=\"o\">//</span><span class=\"w\"> </span>缩减为<span class=\"w\"> </span><span class=\"n\">AB</span><span class=\"w\"> </span>线段\n<span class=\"w\">        </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"p\">(</span><span class=\"nb\">false</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"nb\">cross</span><span class=\"p\">(</span><span class=\"nb\">cross</span><span class=\"p\">(</span><span class=\"n\">AB</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">AO</span><span class=\"p\">),</span><span class=\"w\"> </span><span class=\"n\">AB</span><span class=\"p\">))</span><span class=\"\
  w\">  </span><span class=\"o\">//</span><span class=\"w\"> </span>垂直于<span class=\"w\"> </span><span class=\"n\">AB</span><span class=\"w\"> </span>指向原点\n\n<span class=\"w\">    </span><span class=\"o\">//</span><span class=\"w\"> </span>检查原点是否在<span class=\"w\"> </span><span class=\"n\">AC</span><span class=\"w\"> </span>边的外侧\n<span class=\"w\">    </span><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"nb\">dot</span><span class=\"p\">(</span><span class=\"n\">AC</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">AO</span><span class=\"p\">)</span><span class=\"w\"> </span><span class=\"o\">&gt;</span><span class=\"w\"> </span><span class=\"mi\">0</span><span class=\"p\">:</span>\n<span class=\"w\">        </span><span class=\"n\">simplex</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"p\">[</span><span class=\"n\">A</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\"\
  >C</span><span class=\"p\">]</span><span class=\"w\">  </span><span class=\"o\">//</span><span class=\"w\"> </span>缩减为<span class=\"w\"> </span><span class=\"n\">AC</span><span class=\"w\"> </span>线段\n<span class=\"w\">        </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"p\">(</span><span class=\"nb\">false</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"nb\">cross</span><span class=\"p\">(</span><span class=\"nb\">cross</span><span class=\"p\">(</span><span class=\"n\">AC</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">AO</span><span class=\"p\">),</span><span class=\"w\"> </span><span class=\"n\">AC</span><span class=\"p\">))</span>\n\n<span class=\"w\">    </span><span class=\"o\">//</span><span class=\"w\"> </span>原点在三角形内部\n<span class=\"w\">    </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"p\">(</span><span class=\"nb\">true</span><span class=\"p\">,</span><span class=\"\
  w\"> </span><span class=\"n\">zero_vector</span><span class=\"p\">)</span>\n</code></pre></div>\n\n<h3>5.6 GJK 的复杂度</h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">维度</th>\n<th style=\"text-align: left;\">复杂度</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>每次迭代</strong></td>\n<td style=\"text-align: left;\">$O(V)$（$V$ 是凸体顶点数，用于计算 Support）</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>迭代次数</strong></td>\n<td style=\"text-align: left;\">通常 $&lt; 64$（实践中极少超过 20）</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>总复杂度</strong></td>\n<td style=\"text-align: left;\">$O(V)$（几乎常数时间）</td>\n</tr>\n</tbody>\n</table>\n<p>GJK 的收敛速度非常快，这就是为什么它是大多数物理引擎（Box2D, Bullet, PhysX, Jolt）的首选 Narrow Phase 算法。</p>\n<hr />\n<h2>6. EPA 算法——计算穿透深度</h2>\n<h3>6.1 GJK 的局限</h3>\n<p>GJK 只能回答<strong>是否碰撞</strong>，但物理模拟还需要：<br />\n- <strong>穿透深度（Penetration Depth）</strong>：两个物体互相穿透了多少<br />\n- <strong>碰撞法线（Collision Normal）</strong>：沿什么方向将两个物体推开</p>\n<p><strong>EPA（Expanding\
  \ Polytope Algorithm）</strong> 正是用来解决这个问题的。</p>\n<h3>6.2 EPA 的核心思想</h3>\n<p>GJK 检测到碰撞时，最终的 Simplex 是一个包含原点的三角形（2D）或四面体（3D）。EPA 从这个 Simplex 出发，<strong>不断向原点方向扩展</strong>，直到找到闵可夫斯基差表面上的最近点。</p>\n<p>$$\\text{穿透深度} = | \\mathbf{p} |, \\quad \\text{碰撞法线} = \\frac{\\mathbf{p}}{|\\mathbf{p}|}$$</p>\n<p>其中 $\\mathbf{p}$ 是闵可夫斯基差表面上离原点最近的点。</p>\n<h3>6.3 EPA 算法流程</h3>\n<div class=\"codehilite\"><pre><span></span><code><span class=\"k\">function</span><span class=\"w\"> </span><span class=\"nf\">EPA</span><span class=\"p\">(</span>Shape A, Shape B, simplex_from_GJK<span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"o\">//</span><span class=\"w\"> </span><span class=\"mf\">1.</span><span class=\"w\"> </span>从<span class=\"w\"> </span><span class=\"n\">GJK</span><span class=\"w\"> </span>的<span class=\"w\"> </span><span class=\"n\">Simplex</span><span class=\"w\"> </span>构建初始多面体\n<span class=\"w\">    </span><span class=\"n\">polytope</span><span class=\"w\"> </span><span class=\"\
  p\">=</span><span class=\"w\"> </span><span class=\"n\">BuildConvexPolytope</span><span class=\"p\">(</span><span class=\"n\">simplex_from_GJK</span><span class=\"p\">)</span>\n\n<span class=\"w\">    </span><span class=\"k\">for</span><span class=\"w\"> </span><span class=\"n\">iteration</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"mi\">1</span><span class=\"w\"> </span><span class=\"n\">to</span><span class=\"w\"> </span><span class=\"n\">MAX_ITERATIONS</span><span class=\"p\">:</span>\n<span class=\"w\">        </span><span class=\"o\">//</span><span class=\"w\"> </span><span class=\"mf\">2.</span><span class=\"w\"> </span>找到离原点最近的面\n<span class=\"w\">        </span><span class=\"n\">face</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">FindClosestFace</span><span class=\"p\">(</span><span class=\"n\">polytope</span><span class=\"p\">)</span>\n<span class=\"w\">        </span><span\
  \ class=\"n\">normal</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">face</span><span class=\"p\">.</span><span class=\"n\">normal</span>\n<span class=\"w\">        </span><span class=\"n\">distance</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">face</span><span class=\"p\">.</span><span class=\"n\">distance_to_origin</span>\n\n<span class=\"w\">        </span><span class=\"o\">//</span><span class=\"w\"> </span><span class=\"mf\">3.</span><span class=\"w\"> </span>在该法线方向获取新的<span class=\"w\"> </span><span class=\"n\">Support</span><span class=\"w\"> </span>点\n<span class=\"w\">        </span><span class=\"n\">support</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">Support</span><span class=\"p\">(</span><span class=\"n\">A</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">B</span><span class=\"p\">,</span><span\
  \ class=\"w\"> </span><span class=\"n\">normal</span><span class=\"p\">)</span>\n\n<span class=\"w\">        </span><span class=\"o\">//</span><span class=\"w\"> </span><span class=\"mf\">4.</span><span class=\"w\"> </span>检查新点是否超出当前最近面\n<span class=\"w\">        </span><span class=\"k\">if</span><span class=\"w\"> </span><span class=\"nb\">dot</span><span class=\"p\">(</span><span class=\"n\">support</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">normal</span><span class=\"p\">)</span><span class=\"w\"> </span><span class=\"o\">-</span><span class=\"w\"> </span><span class=\"n\">distance</span><span class=\"w\"> </span><span class=\"o\">&lt;</span><span class=\"w\"> </span><span class=\"n\">EPA_TOLERANCE</span><span class=\"p\">:</span>\n<span class=\"w\">            </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"p\">(</span><span class=\"n\">normal</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">distance</span><span\
  \ class=\"p\">)</span><span class=\"w\">  </span><span class=\"o\">//</span><span class=\"w\"> </span>收敛！\n\n<span class=\"w\">        </span><span class=\"o\">//</span><span class=\"w\"> </span><span class=\"mf\">5.</span><span class=\"w\"> </span>将新点加入多面体，删除可见面，添加新的三角面\n<span class=\"w\">        </span><span class=\"n\">polytope</span><span class=\"w\"> </span><span class=\"p\">=</span><span class=\"w\"> </span><span class=\"n\">ExpandPolytope</span><span class=\"p\">(</span><span class=\"n\">polytope</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">support</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">normal</span><span class=\"p\">)</span>\n\n<span class=\"w\">    </span><span class=\"k\">return</span><span class=\"w\"> </span><span class=\"p\">(</span><span class=\"n\">normal</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">distance</span><span class=\"p\">)</span><span class=\"w\">  </span><span class=\"\
  o\">//</span><span class=\"w\"> </span>超时返回当前最优解\n</code></pre></div>\n\n<h3>6.4 GJK + EPA 的组合</h3>\n<div class=\"codehilite\"><pre><span></span><code>碰撞检测完整流程：\n  1. Broad Phase (AABB / BVH) → 过滤不可能碰撞的对\n  2. GJK → 判断是否碰撞（是/否）\n  3. 如果碰撞 → EPA → 计算穿透深度和碰撞法线\n  4. 碰撞响应（物理引擎）：根据穿透深度和法线进行位置修正/速度反弹\n</code></pre></div>\n\n<hr />\n<h2>7. 算法对比总结</h2>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">方法</th>\n<th style=\"text-align: left;\">适用形状</th>\n<th style=\"text-align: left;\">检测内容</th>\n<th style=\"text-align: left;\">复杂度</th>\n<th style=\"text-align: left;\">主要用途</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><strong>AABB</strong></td>\n<td style=\"text-align: left;\">任意</td>\n<td style=\"text-align: left;\">粗检（是否可能碰撞）</td>\n<td style=\"text-align: left;\">$O(1)$ 每对</td>\n<td style=\"text-align: left;\">Broad Phase</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>OBB</strong></td>\n<td style=\"text-align: left;\">任意</td>\n<td style=\"text-align:\
  \ left;\">较精确粗检</td>\n<td style=\"text-align: left;\">$O(1)$ 每对</td>\n<td style=\"text-align: left;\">动态物体的 Broad Phase</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>BVH</strong></td>\n<td style=\"text-align: left;\">任意</td>\n<td style=\"text-align: left;\">大规模场景加速</td>\n<td style=\"text-align: left;\">$O(n \\log n)$</td>\n<td style=\"text-align: left;\">Broad Phase 加速</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>SAT</strong></td>\n<td style=\"text-align: left;\">凸体</td>\n<td style=\"text-align: left;\">精确碰撞 + 穿透深度</td>\n<td style=\"text-align: left;\">$O(n_A + n_B)$ 轴</td>\n<td style=\"text-align: left;\">简单凸体的 Narrow Phase</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>GJK</strong></td>\n<td style=\"text-align: left;\">凸体</td>\n<td style=\"text-align: left;\">精确碰撞判断</td>\n<td style=\"text-align: left;\">$O(V)$ 迭代</td>\n<td style=\"text-align: left;\">通用 Narrow Phase</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><strong>EPA</strong></td>\n<td\
  \ style=\"text-align: left;\">凸体</td>\n<td style=\"text-align: left;\">穿透深度 + 法线</td>\n<td style=\"text-align: left;\">$O(V)$ 迭代</td>\n<td style=\"text-align: left;\">碰撞响应输入</td>\n</tr>\n</tbody>\n</table>\n<p><strong>工程推荐组合</strong>：</p>\n<p>$$\\boxed{\\text{AABB + BVH}} \\xrightarrow{\\text{Broad Phase}} \\boxed{\\text{GJK + EPA}} \\xrightarrow{\\text{Narrow Phase}} \\boxed{\\text{碰撞响应}}$$</p>\n<p>这也是 Box2D（2D）和 Bullet/PhysX/Jolt（3D）等主流物理引擎所采用的架构。</p>\n<h2>参考</h2>\n<ul>\n<li>Gilbert, E. G., Johnson, D. W., &amp; Keerthi, S. S. (1988). \"A fast procedure for computing the distance between complex objects in three-dimensional space.\" <em>IEEE Journal of Robotics and Automation</em>.</li>\n<li>Ericson, C. (2004). <em>Real-Time Collision Detection</em>. Morgan Kaufmann.</li>\n<li>van den Bergen, G. (1999). \"A fast and robust GJK implementation for collision detection of convex objects.\" <em>Journal of Graphics Tools</em>.</li>\n</ul>"
